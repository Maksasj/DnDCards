<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Карточки D&amp;D</title>
    <meta name="description" content="Выберите заклинания и магические предметы D&amp;D 5e и распечатайте их карточками на A4." />
  </head>
  <body data-tab="spells">
    <header class="topbar">
      <div class="topbar-row">
        <h1>Карточки D&amp;D</h1>
        <nav class="tabs" role="tablist">
          <button type="button" role="tab" data-tab="spells" aria-selected="true">Заклинания<span id="count-spells"></span></button>
          <button type="button" role="tab" data-tab="items" aria-selected="false">Магические предметы<span id="count-items"></span></button>
          <button type="button" role="tab" data-tab="sheets" aria-selected="false">Листы для печати<span id="count-sheets"></span></button>
        </nav>
        <button type="button" id="share" title="Ссылка открывает этот же набор карточек">Скопировать ссылку</button>
        <button type="button" id="print" class="primary">Печать / PDF</button>
      </div>

      <div class="topbar-row filters" id="filters-spells" data-for="spells"></div>
      <div class="topbar-row actions" data-for="spells">
        <span id="found-spells" class="found"></span>
        <label class="check"><input type="checkbox" id="only-selected-spells" /> только выбранные</label>
        <button type="button" id="add-found-spells">Выбрать найденные</button>
        <button type="button" id="clear-spells">Снять все заклинания</button>
      </div>

      <div class="topbar-row filters" id="filters-items" data-for="items"></div>
      <div class="topbar-row actions" data-for="items">
        <span id="found-items" class="found"></span>
        <label class="check"><input type="checkbox" id="only-selected-items" /> только выбранные</label>
        <button type="button" id="add-found-items">Выбрать найденные</button>
        <button type="button" id="clear-items">Снять все предметы</button>
      </div>

      <div class="topbar-row actions" data-for="sheets">
        <span id="status" class="found"></span>
        <select id="view" aria-label="Вид">
          <option value="sheet">Листы A4</option>
          <option value="cards">Крупно</option>
        </select>
      </div>
    </header>

    <main class="spells" id="list-spells" data-for="spells"></main>
    <main class="spells" id="list-items" data-for="items"></main>

    <section class="sheets-tab">
      <p class="print-hint">
        В окне печати выберите масштаб <b>100%</b> («Фактический размер»), иначе карты получатся не того размера.
        Для PDF — принтер «Сохранить как PDF».
      </p>
      <div id="sheets"></div>
    </section>

    <footer class="credits">
      Тексты и значки — <a href="https://dnd.su/" target="_blank" rel="noopener">dnd.su</a>.
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
