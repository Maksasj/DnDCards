higher_levels: Когда вы накладываете это заклинание, используя ячейку 4-го уровня или выше, урон увеличивается на 1к4 за каждый уровень ячейки выше 3-го.
description: Вы шепчете магические слова, вызывающие враждебность у одного существа по вашему выбору в пределах дистанции. Цель должна преуспеть в спасброске Мудрости. При провале цель получает 4к4 урона психической энергией и должна немедленно реакцией совершить рукопашную атаку по другому существу по вашему выбору, которое вы можете видеть. Если цель не может совершить эту атаку (например, если в пределах её досягаемости никого нет или у неё не осталось реакций), цель совершает следующий бросок атаки до начала вашего следующего хода с помехой. При успехе цель получает только половину урона.
