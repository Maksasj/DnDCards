id: ensnaring-strike
name: Опутывающий удар
name_en: Ensnaring strike
source_url: https://dnd.su/spells/212-ensnaring-strike/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10241-ensnaring-strike
level: 1
school: вызов
ritual: false
casting_time: 1 бонусное действие
range: На себя
components: В
duration: Концентрация, вплоть до 1 минуты
concentration: true
classes:
  - следопыт
higher_levels: Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1к6 за каждый уровень ячейки выше первого.
description: |-
  Когда вы в следующий раз попадёте по существу атакой оружием, пока заклинание активно, в точке удара появляется извивающаяся масса растений с шипами, и цель должна преуспеть в спасброске Силы, иначе она станет опутана магическими плетьми, пока заклинание активно. Существа Большого размера или более совершают этот спасбросок с преимуществом. Если цель преуспевает в спасброске, плети усыхают.

  Будучи опутанной этим заклинанием, цель получает 1к6 колющего урона в начале каждого своего хода. Опутанное существо или существо, способное коснуться его, может действием совершить проверку Силы против Сл ваших заклинаний. При успехе цель освобождается.
