    book: Xanathar's Guide to Everything
  - code: POA
    book: Princes of the Apocalypse
level: 3
school: вызов
ritual: false
casting_time: 1 действие
range: 120 футов
components: В, С, М
material: капля воды
duration: Мгновенная
concentration: false
classes:
  - волшебник
  - друид
  - чародей
description: Вы призываете волну, которая обрушивается на выбранную вами область в пределах дистанции. Эта область может быть до 30 футов длиной, до 10 футов шириной и до 10 футов высотой. Все существа в этой области должны совершить спасбросок Ловкости. При провале существо получает 4к8 дробящего урона и сбивается с ног. При успехе оно получает половину урона и не сбивается с ног. После этого вода разливается во все стороны по земле, гася любые незащищённые источники огня в области действия заклинания и в пределах 30 футов от неё, после чего исчезает.
