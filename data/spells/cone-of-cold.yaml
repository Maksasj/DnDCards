description: Из ваших рук вырывается волна холодного воздуха. Все существа в 60-футовом конусе должны совершить спасбросок Телосложения. Существа получают 8к8 урона холодом при провале или половину этого урона при успехе. Существа, убитые этим заклинанием, становятся замороженными статуями, пока не растают.
