id: holy-aura
name: Аура святости
name_en: Holy aura
source_url: https://dnd.su/spells/6-holy-aura/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10544-holy-aura
level: 8
school: ограждение
ritual: false
casting_time: 1 действие
range: На себя
components: В, С, М
material: крошечный контейнер, стоящий как минимум 1 000 зм, хранящий священную реликвию, такую как лоскут ткани с мантии святого или кусочек пергамента с религиозным текстом
duration: Концентрация, вплоть до 1 минуты
concentration: true
classes:
  - жрец
description: Божественный свет исходит от вас мягким сиянием в радиусе 30 футов. Пока заклинание активно, существа в этом радиусе, выбранные вами при накладывании этого заклинания, испускают тусклый свет в радиусе 5 футов и совершают все спасброски с преимуществом, а остальные существа совершают с помехой броски атаки по ним. Кроме того, если Исчадие или Нежить попадает по такому существу рукопашной атакой, аура вспыхивает ярким светом. Атакующий должен преуспеть в спасброске Телосложения, иначе станет ослеплённым, пока это заклинание не окончится.
