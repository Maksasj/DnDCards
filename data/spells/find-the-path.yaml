sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10509-find-the-path
level: 6
school: прорицание
ritual: false
casting_time: 1 минута
range: На себя
components: В, С, М
material: набор инструментов для ворожбы — такой, как кости, палочки из слоновой кости, карты, зубы или резные руны — стоящий 100 зм, а также предмет из места, которое вы хотите найти
duration: Концентрация, вплоть до 1 дня
