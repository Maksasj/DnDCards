id: frost-fingers
name: Ледяные пальцы
name_en: Frost fingers
source_url: https://dnd.su/spells/3022-frost-fingers/
sources:
  - code: IDRF
    book: "Icewind Dale: Rime of the Frostmaiden"
level: 1
school: воплощение
ritual: false
casting_time: 1 действие
range: На себя (15-футовый конус)
components: В, С
duration: Мгновенная
concentration: false
classes:
  - волшебник
higher_levels: Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, урон увеличивается на 1к8 за каждый уровень ячейки выше первого.
description: |-
  Из ваших пальцев в 15-футовом конусе вырывается леденящий холод. Каждое существо в этой области должно совершить спасбросок Телосложения, получая 2к8 урона холодом при провале и половину этого урона при успехе.

  В области воздействия холод замораживает немагические жидкости, которые никто не несёт и не носит.
