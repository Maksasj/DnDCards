id: temporal-shunt
name: Временной сдвиг
name_en: Temporal shunt
source_url: https://dnd.su/spells/2450-temporal-shunt/
sources:
  - code: EGW
    book: Explorer's Guide to Wildemount
level: 5
school: преобразование
ritual: false
casting_time: 1 реакция
reaction_trigger: когда существо, которое вы видите, совершает бросок атаки или накладывает заклинание
range: 120 футов
components: В, С
duration: 1 раунд
concentration: false
subclasses:
  - магия хронургии (волшебник)
  - магия гравитургии (волшебник)
higher_levels: Если вы накладываете это заклинание, используя ячейку 6-го уровня или выше, вы можете выбрать в качестве цели одно дополнительное существо за каждый уровень выше пятого. Все цели должны быть в пределах 30 футов друг от друга.
description: Вы нацеливаетесь на спровоцировавшее реакцию существо, и оно должно преуспеть в спасброске Мудрости, иначе оно исчезает, оказываясь в ином временном промежутке, в котором его атака промахивается, а заклинание не оказывает никакого эффекта. В начале своего следующего хода цель появляется в том же месте или ближайшем к нему свободном пространстве. Цель не помнит как вы накладывали заклинание и как она была подвержена эффекту этого заклинания.
