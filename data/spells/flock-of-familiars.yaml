id: flock-of-familiars
name: Стая фамильяров
name_en: Flock of Familiars
source_url: https://dnd.su/spells/3847-flock-of-familiars/
sources:
  - code: AL00-06
    book: Lost Laboratory of Kwalish
level: 2
school: вызов
ritual: false
casting_time: 1 минута
range: Касание
components: В, С
duration: Концентрация, вплоть до 1 часа
