id: shadow-of-moil
name: Облачение тени
name_en: Shadow of Moil
source_url: https://dnd.su/spells/478-shadow-of-moil/
sources:
  - code: XGE
    book: Xanathar's Guide to Everything
level: 4
school: некромантия
ritual: false
casting_time: 1 действие
range: На себя
components: В, С, М
material: глазное яблоко Нежити, заключенное в драгоценный камень стоимостью не менее 150 зм
duration: Концентрация, вплоть до 1 минуты
