    book: "Strixhaven: A Curriculum of Chaos"
level: 1
school: очарование
ritual: false
casting_time: 1 реакция
reaction_trigger: когда видимое вами в пределах 60 футов от вас существо преуспевает в броске атаки, проверке характеристики или спасброске
range: 60 футов
