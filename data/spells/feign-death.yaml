id: feign-death
name: Притворная смерть
name_en: Feign death
source_url: https://dnd.su/spells/280-feign-death/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10507-feign-death
level: 3
school: некромантия
ritual: true
casting_time: 1 действие
range: Касание
components: В, С, М
material: щепотка кладбищенской земли
duration: 1 час
concentration: false
classes:
  - бард
  - волшебник
  - друид
  - жрец
description: |-
  Вы касаетесь согласного существа и погружаете его в каталептическое состояние, неотличимое от смерти.

  Пока заклинание активно, или пока вы не коснетесь действием цели, снимая заклинание, цель выглядит мёртвой для любого обследования и заклинаний, определяющих состояние цели. Цель ослеплена и недееспособна, а скорость равна 0. Цель получает сопротивление урону всех видов, кроме психической энергии. Если цель была больна или отравлена, когда вы накладываете это заклинание, или становится больной или отравленной, находясь под его действием, болезни и яды не оказывают никакого эффекта, пока заклинание не окончится.
