id: protection-from-evil-and-good
name: Защита от зла и добра
name_en: Protection from evil and good
source_url: https://dnd.su/spells/99-protection-from-evil-and-good/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10226-protection-from-evil-and-good
level: 1
school: ограждение
ritual: false
casting_time: 1 действие
range: Касание
components: В, С, М
material: святая вода или порошок серебра и железа, расходуемые заклинанием
duration: Концентрация, вплоть до 10 минут
concentration: true
classes:
  - волшебник
  - друид
  - жрец
  - колдун
  - паладин
description: |-
  Пока заклинание активно, одно согласное существо, которого вы коснулись, защищено от существ следующих видов: Аберрации, Исчадия, Небожители, Нежить, Феи и Элементали.

  Защита предоставляет несколько преимуществ. Данные существа совершают с помехой броски атаки по цели. Цель также не может быть очарована, испугана и одержима ими. Если цель уже очарована, испугана или одержима таким существом, цель совершает последующие спасброски от таких эффектов с преимуществом.
