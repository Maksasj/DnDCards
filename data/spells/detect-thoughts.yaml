id: detect-thoughts
name: Обнаружение мыслей
name_en: Detect thoughts
source_url: https://dnd.su/spells/196-detect-thoughts/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10479-detect-thoughts
level: 2
school: прорицание
ritual: false
casting_time: 1 действие
range: На себя
components: В, С, М
