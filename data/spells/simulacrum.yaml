    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10643-simulacrum
level: 7
school: иллюзия
ritual: false
casting_time: 12 часов
range: Касание
components: В, С, М
material: снег или лёд в количестве, достаточном для создания точной копии существа, немного волос, обрезков ногтей или других частей тела этого существа, помещаемые в снег или лёд и толчёный рубин стоимостью 1500 зм, которым посыпается копия, и который расходуется заклинанием
duration: Пока не рассеяно
