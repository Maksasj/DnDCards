id: summon-undead
name: Призыв духа нежити
name_en: Summon Undead
source_url: https://dnd.su/spells/3067-summon-undead/
sources:
  - code: TCE
    book: Tasha's Cauldron of Everything
url_2024: https://next.dnd.su/spells/10664-summon-undead
level: 3
school: некромантия
ritual: false
casting_time: 1 действие
range: 90 футов
components: В, С, М
material: позолоченный череп стоимостью не менее 300 зм
duration: Концентрация, вплоть до 1 часа
