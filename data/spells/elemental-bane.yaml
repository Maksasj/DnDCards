id: elemental-bane
name: Проклятие стихии
name_en: Elemental Bane
source_url: https://dnd.su/spells/404-elemental-bane/
sources:
  - code: XGE
    book: Xanathar's Guide to Everything
  - code: POA
    book: Princes of the Apocalypse
level: 4
school: преобразование
ritual: false
casting_time: 1 действие
range: 90 футов
components: В, С
duration: Концентрация, вплоть до 1 минуты
concentration: true
classes:
  - волшебник
  - друид
  - изобретатель
  - колдун
higher_levels: Если вы накладываете это заклинание, используя ячейку 5-го уровня или выше, вы можете выбрать одну дополнительную цель за каждый уровень ячейки выше 4-го. Выбранные существа должны находиться в пределах 30 футов друг от друга.
description: "Выберите одно существо, которое вы можете видеть в пределах дистанции, а затем выберите один из следующих видов урона: звук, кислота, огонь, холод или электричество. Цель должна преуспеть в спасброске Телосложения, иначе будет подвержена эффекту заклинания в течение времени его действия. Когда цель впервые за ход получает урон выбранного вида, она также получает дополнительно 2к6 урона этого вида. Кроме того, цель теряет любые сопротивления урону этого вида, пока заклинание не окончится."
