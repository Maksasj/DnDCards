id: gate-seal
name: Запечатывание врат
name_en: Gate seal
source_url: https://dnd.su/spells/6578-gate-seal/
sources:
  - code: PAM
    book: "Planescape: Adventures in the Multiverse"
level: 4
school: ограждение
ritual: false
casting_time: 1 минута
range: 60 футов
components: В, С, М
material: сломанный ключ портала, расходуемый заклинанием
duration: 24 часа
concentration: false
classes:
  - волшебник
  - колдун
  - чародей
higher_levels: Когда вы накладываете это заклинание, используя ячейку заклинания 6-го уровня или выше, заклинание длится до тех пор, пока не будет рассеяно.
description: Вы укрепляете ткань плана в 30-футовом кубе, который вы можете видеть в пределах досягаемости. Внутри этой области порталы закрываются и не могут быть открыты в течение длительности. Заклинания и другие эффекты, позволяющие путешествовать по планам или открывать порталы, такие как врата [gate] или уход в иной мир [plane shift], проваливаются, если используются для входа в эту область или для выхода из неё. Куб неподвижен.
