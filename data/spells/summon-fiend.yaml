sources:
  - code: TCE
    book: Tasha's Cauldron of Everything
url_2024: https://next.dnd.su/spells/10663-summon-fiend
level: 6
school: вызов
ritual: false
casting_time: 1 действие
range: 90 футов
components: В, С, М
material: кровь Гуманоида внутри рубинового флакона стоимостью не менее 600 зм
