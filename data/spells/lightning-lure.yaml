id: lightning-lure
name: Лассо молнии
name_en: Lightning lure
source_url: https://dnd.su/spells/460-lightning-lure/
sources:
  - code: SCAG
    book: Sword Coast Adventurer's Guide
  - code: TCE
    book: Tasha's Cauldron of Everything
level: 0
school: воплощение
ritual: false
casting_time: 1 действие
range: На себя (15-футовый радиус)
components: В
duration: Мгновенная
concentration: false
classes:
  - волшебник
  - изобретатель
