description: К цели, находящейся в пределах дистанции, устремляется мерцающая зелёная стрела, разлетающаяся кислотными брызгами. Совершите по цели дальнобойную атаку заклинанием. При попадании цель получает единовременно 4к4 урона кислотой и 2к4 урона кислотой в конце своего следующего хода. При промахе стрела немного задевает цель и наносит половину единовременного урона, а в конце своего следующего хода цель урона не получает.
