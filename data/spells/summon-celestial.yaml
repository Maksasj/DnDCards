    book: Tasha's Cauldron of Everything
url_2024: https://next.dnd.su/spells/10660-summon-celestial
level: 5
school: вызов
ritual: false
casting_time: 1 действие
range: 90 футов
components: В, С, М
material: золотой реликварий стоимостью не менее 500 зм
duration: Концентрация, вплоть до 1 часа
