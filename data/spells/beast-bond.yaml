id: beast-bond
name: Звериные узы
name_en: Beast bond
source_url: https://dnd.su/spells/382-beast-bond/
sources:
  - code: XGE
    book: Xanathar's Guide to Everything
  - code: POA
    book: Princes of the Apocalypse
level: 1
school: прорицание
ritual: false
casting_time: 1 действие
range: Касание
components: В, С, М
material: кусочек меха, завёрнутого в ткань
duration: Концентрация, вплоть до 10 минут
concentration: true
classes:
  - друид
  - следопыт
description: Вы устанавливаете телепатическую связь с одним Зверем, которого касаетесь, если он дружественен вам или очарован вами. Заклинание терпит неудачу, если Интеллект Зверя больше 3. Пока заклинание действует, связь активна, если вы и Зверь находитесь в пределах прямой видимости. Связь позволяет Зверю понимать ваши телепатические сообщения, и он может телепатически передавать простые эмоции и образы обратно вам. Пока связь активна, Зверь совершает с преимуществом броски атаки против любого существа в пределах 5 футов от вас, которое вы можете видеть.
