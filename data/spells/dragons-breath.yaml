id: dragons-breath
name: Дыхание дракона
name_en: Dragon's breath
source_url: https://dnd.su/spells/467-dragons-breath/
sources:
  - code: XGE
    book: Xanathar's Guide to Everything
url_2024: https://next.dnd.su/spells/10489-dragons-breath
level: 2
school: преобразование
ritual: false
casting_time: 1 бонусное действие
range: Касание
components: В, С, М
material: острый перец
duration: Концентрация, вплоть до 1 минуты
concentration: true
classes:
