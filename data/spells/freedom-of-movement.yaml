id: freedom-of-movement
name: Свобода перемещения
name_en: Freedom of movement
source_url: https://dnd.su/spells/308-freedom-of-movement/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10249-freedom-of-movement
level: 4
school: ограждение
ritual: false
casting_time: 1 действие
range: Касание
components: В, С, М
material: кожаный ремешок, обмотанный вокруг предплечья или аналогичной конечности
duration: 1 час
concentration: false
classes:
  - бард
  - друид
  - жрец
