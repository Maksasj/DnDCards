id: greater-restoration
name: Высшее восстановление
name_en: Greater restoration
source_url: https://dnd.su/spells/39-greater-restoration/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10212-greater-restoration
level: 5
school: ограждение
ritual: false
casting_time: 1 действие
range: Касание
components: В, С, М
material: бриллиантовая пыль, стоящая как минимум 100 зм, расходуемая заклинанием
duration: Мгновенная
concentration: false
classes:
  - бард
