id: clairvoyance
name: Подсматривание
name_en: Clairvoyance
source_url: https://dnd.su/spells/238-clairvoyance/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10461-clairvoyance
level: 3
school: прорицание
ritual: false
casting_time: 10 минут
range: 1 миля
components: В, С, М
material: "фокусировка, стоящая как минимум 100 зм: либо украшенный камнями рог для подслушивания, либо стеклянный глаз для подсматривания"
duration: Концентрация, вплоть до 10 минут
concentration: true
classes:
  - бард
