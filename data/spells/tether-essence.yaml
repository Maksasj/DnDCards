id: tether-essence
name: Единство сущностей
name_en: Tether essence
source_url: https://dnd.su/spells/2452-tether-essence/
sources:
  - code: EGW
    book: Explorer's Guide to Wildemount
level: 7
school: некромантия
ritual: false
casting_time: 1 действие
range: 60 футов
components: В, С, М
material: катушка с платиновым шнуром стоимостью не менее 250 зм, расходуемая заклинанием
duration: Концентрация, вплоть до 1 часа
concentration: true
subclasses:
  - магия хронургии (волшебник)
  - магия гравитургии (волшебник)
description: Два существа, видимых в пределах дистанции, должны совершить спасбросок Телосложения. Бросок совершается с помехой, если существа находятся не дальше 30 футов друг от друга. Оба существа могут по желанию провалить этот бросок. Если хотя бы одно существо преуспевает в спасброске, заклинание не имеет эффекта. Если оба существа проваливают спасбросок, существа магически соединяются друг с другом на время действия заклинания, вне зависимости от расстояния между ними. Если одно существо получает урон, второе существо получает тот же урон. Если одно существо восстанавливает хиты, другое существо восстанавливает то же самое количество хитов. Когда хиты одного из существ опускается до 0, заклинание оканчивается на обоих. Если заклинание оканчивается на одном существе, оно оканчивается на другом.
