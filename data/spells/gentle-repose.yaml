id: gentle-repose
name: Нетленные останки
name_en: Gentle repose
source_url: https://dnd.su/spells/186-gentle-repose/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10527-gentle-repose
level: 2
school: некромантия
ritual: true
casting_time: 1 действие
range: Касание
components: В, С, М
material: щепотка соли и по одной медной монетке на каждый глаз трупа, которые должны оставаться там все время, пока активно заклинание
duration: 10 дней
concentration: false
classes:
  - волшебник
  - жрец
  - паладин
description: |-
  Вы касаетесь трупа или других останков. Пока заклинание активно, цель защищена от разложения и не может стать Нежитью.

  Это заклинание также увеличивает ограничение по времени, в течение которого труп можно воскресить, так как дни, проведенные под воздействием этого заклинания, не учитываются при подсчёте времени со дня смерти для таких заклинаний как оживление [raise dead].
