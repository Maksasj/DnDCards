higher_levels: Когда вы накладываете это заклинание, используя ячейку заклинания 3-го уровня или выше, урон увеличивается на 1к8 для каждого уровня ячейки выше 2-го.
description: Вы достигаете разума одного существа, которое видите в пределах дистанции. Цель должна совершить спасбросок Мудрости, получая 3к8 урона психической энергией при провале или половину этого урона при успехе. При провале вы также всегда знаете местоположение цели до тех пор, пока заклинание активно, но только пока вы оба находитесь на одном и том же плане существования. Пока у вас есть это знание, цель не может стать спрятанной от вас, и если она невидима, она не получает никакой выгоды от этого состояния против вас.
