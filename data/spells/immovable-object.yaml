id: immovable-object
name: Неподвижный предмет
name_en: Immovable object
source_url: https://dnd.su/spells/2446-immovable-object/
sources:
  - code: EGW
    book: Explorer's Guide to Wildemount
level: 2
school: преобразование
ritual: false
casting_time: 1 действие
range: Касание
components: В, С, М
material: золотая пыль стоимостью не менее 25 зм, расходуемая заклинанием
duration: 1 час
concentration: false
subclasses:
  - магия хронургии (волшебник)
  - магия гравитургии (волшебник)
higher_levels: Если вы накладываете заклинание, используя ячейку 4-го или 5-го уровня, то максимальная нагрузка увеличивается до 8 000 фунтов, Сл сдвига увеличивается на 5, а длительность заклинания увеличивается до 24 часов. Если вы накладываете заклинание, используя ячейку 6-го уровня или выше, то максимальная нагрузка увеличивается до 20 000 фунтов, Сл сдвига увеличивается на 10, а заклинание длится, пока не будет рассеяно.
description: |-
  Вы касаетесь предмета, вес которого не превышает 10 фунтов (4,5 кг), и магическим образом фиксируете его в пространстве. Вы и указанные вами существа можете перемещать предмет как обычно. Кроме того, вы можете указать пароль, который при его произнесении в 5 футов от объекта подавляет эффект заклинания на 1 минуту.

  Если предмет находится в воздухе, он может выдержать нагрузку до 4 000 фунтов, при превышении которой заклинание заканчивается. Существо может действием совершить проверку Силы против Сл ваших заклинаний. При успехе оно может сдвинуть предмет на расстояние до 10 футов.
