id: aura-of-life
name: Аура жизни
name_en: Aura of life
source_url: https://dnd.su/spells/4-aura-of-life/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10435-aura-of-life
level: 4
school: ограждение
ritual: false
casting_time: 1 действие
range: На себя (30-футовый радиус)
components: В
duration: Концентрация, вплоть до 10 минут
concentration: true
classes:
  - жрец
  - паладин
description: От вас исходит защищающая жизнь аура с радиусом 30 футов. Пока заклинание активно, аура перемещается вместе с вами, оставаясь с центром на вас. Все невраждебные существа в ауре (включая вас) обладают сопротивлением урону некротической энергией, и максимум их хитов не может уменьшаться. Кроме того, когда невраждебное живое существо с 0 хитов начинает ход в этой ауре, оно восстанавливает 1 хит.
