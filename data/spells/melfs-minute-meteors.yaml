id: melfs-minute-meteors
name: Мельфовы маленькие метеоры
name_en: Melf's minute meteors
source_url: https://dnd.su/spells/390-melfs-minute-meteors/
sources:
  - code: XGE
    book: Xanathar's Guide to Everything
  - code: POA
    book: Princes of the Apocalypse
level: 3
school: воплощение
ritual: false
casting_time: 1 действие
range: На себя
components: В, С, М
material: селитра, сера и шарик сосновой смолы
duration: Концентрация, вплоть до 10 минут
concentration: true
classes:
  - волшебник
  - чародей
higher_levels: Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, число призываемых метеоров увеличивается на 2 за каждый уровень ячейки выше 3-го.
description: Вы создаёте вокруг себя шесть маленьких метеоров. Они парят в воздухе и вращаются вокруг вас, пока действует заклинание. Когда вы накладываете заклинание (а также в следующих ходах бонусным действием) вы можете отправить один или два метеора в точки, выбранные в пределах 120 футов. Долетев до цели или столкнувшись с твёрдой поверхностью, метеор взрывается. Все существа в пределах 5 футов от точки взрыва должны совершить спасбросок Ловкости. При провале существо получает 2к6 урона огнём, а при успехе — половину урона.
