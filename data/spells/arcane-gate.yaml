sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10428-arcane-gate
level: 6
school: вызов
ritual: false
casting_time: 1 действие
range: 500 футов
components: В, С
duration: Концентрация, вплоть до 10 минут
