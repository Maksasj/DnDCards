id: create-homunculus
name: Сотворение гомункула
name_en: Create homunculus
source_url: https://dnd.su/spells/499-create-homunculus/
sources:
  - code: XGE
    book: Xanathar's Guide to Everything
level: 6
school: преобразование
ritual: false
casting_time: 1 час
range: Касание
components: В, С, М
material: Глина, пепел и корень мандрагоры, расходуемые заклинанием, и кинжал с инкрустированными драгоценными камнями стоимостью не менее 1000 зм
duration: Мгновенная
concentration: false
classes:
  - волшебник
description: |-
  Произнося замысловатое заклинание, вы режете себя кинжалом, украшенным драгоценными камнями, и получаете 2к4 колющего урона, который никак не может быть уменьшен. Затем вы капаете свою кровь на другие компоненты заклинания и прикасаетесь к ним, превращая их в особого Конструкта, называемого гомункулом [homunculus].

  Это ваш преданный спутник, и он умирает, если умираете вы. Каждый раз, когда вы заканчиваете продолжительный отдых, вы можете потратить до половины своих Костей Хитов, если гомункул находится на том же плане существования, что и вы. Когда вы это делаете, бросьте каждую Кость Хитов и добавьте к ней свой модификатор Телосложения.

  Максимум ваших хитов понижается на получившуюся сумму, а максимум хитов гомункула вместе с текущим количеством хитов увеличивается на это же значение. Этот процесс не может понизить ваши хиты ниже 1, и этот обмен хитами между вами и гомункулом заканчивается после того как вы завершите следующий продолжительный отдых. До этого момента понижение максимума ваших хитов не может быть убрано никаким другим образом, кроме смерти гомункула.

  Вы можете иметь только одного гомункула в каждый момент времени. Если вы накладываете это заклинание, пока ваш гомункул жив, заклинание проваливается.
