higher_levels: Если вы накладываете это заклинание, используя ячейку заклинания 8-го уровня или выше, количество создаваемых частиц света увеличивается на две за каждый уровень ячейки выше 7-го.
description: |-
  Пока заклинание действует, вокруг вашей головы вращаются 7 похожих на звёзды частиц света. Вы можете бонусным действием отправить одну из частиц к одному существу или объекту в пределах 120 футов от вас. Если вы так делаете, совершите дальнобойную атаку заклинанием. При попадании цель получает 4к12 урона излучением.

  Независимо от того, попали вы или нет, частица света исчезает. Действие заклинания оканчивается раньше, когда исчезает последняя частица света.

  Пока у вас остаётся хотя бы 4 частицы, они испускают яркий свет в пределах 30 футов и тусклый свет в пределах ещё 30 футов. Если у вас осталось меньше 4 частиц, то они испускают тусклый свет в пределах 30 футов.
