id: clone
name: Двойник
name_en: Clone
source_url: https://dnd.su/spells/54-clone/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10462-clone
level: 8
school: некромантия
ritual: false
casting_time: 1 час
range: Касание
components: В, С, М
material: алмаз, стоящий как минимум 1000 зм, и как минимум 1 кубический дюйм (16 кубических сантиметров) плоти клонируемого существа, расходуемые заклинанием, а также сосуд, стоящий как минимум 2000 зм, с запираемой крышкой и достаточно большой, чтобы вместить клонируемое существо, например, огромная урна, гроб, яма в земле или кристаллический контейнер, заполненный солёной водой
duration: Мгновенная
