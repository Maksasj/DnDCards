    book: Tasha's Cauldron of Everything
level: 3
school: некромантия
ritual: false
casting_time: 1 бонусное действие
range: На себя
components: В, С
duration: Концентрация, вплоть до 1 минуты
concentration: true
classes:
  - волшебник
  - жрец
