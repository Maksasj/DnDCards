description: Вы высыпаете спектральные карты 15-футовым конусом. Каждое существо в этой области должно совершить спасбросок Ловкости. При провале существо получает 2к10 урона силовым полем и становится ослеплённым до конца своего следующего хода. При успехе существо получает только половину урона без дополнительных эффектов.
