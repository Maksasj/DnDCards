    book: Xanathar's Guide to Everything
  - code: POA
    book: Princes of the Apocalypse
level: 3
school: преобразование
ritual: false
casting_time: 1 действие
range: Касание
components: В, С
duration: Концентрация, вплоть до 1 часа
concentration: true
classes:
  - волшебник
  - друид
  - изобретатель
  - следопыт
  - чародей
higher_levels: Если вы накладываете это заклинание, используя ячейку 4-го уровня или выше, количество боеприпасов, на которые действует заклинание, увеличивается на 2 за каждый уровень ячейки выше 3-го.
description: Вы касаетесь колчана, в котором находятся стрелы или болты. Когда дальнобойная атака оружием с использованием боеприпаса, вынутого из этого колчана, попадает по цели, цель получает дополнительно 1к6 урона огнём. Действие магии на боеприпасе заканчивается после попадания или промаха. Заклинание заканчивается, когда из колчана было извлечено 12 боеприпасов.
