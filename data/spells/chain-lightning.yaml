    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10454-chain-lightning
level: 6
school: воплощение
ritual: false
casting_time: 1 действие
range: 150 футов
components: В, С, М
material: кусочек меха, кусок янтаря, стекла или кристаллический жезл, три серебряные булавки
