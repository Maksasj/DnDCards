description: Вы нацеливаетесь на существо, видимое в пределах дистанции, и подвергаете его процессу опустошающего старения. Существо должно совершить спасбросок Телосложения. При провале существо получает 10к12 урона некротической энергией, и половину этого урона при успехе. При провале существо стареет до той степени, при которой оно умрет от старости через 30 суток. В таком состоянии цель совершает броски атаки, проверки характеристик и спасброски с помехой, и её скорость уменьшена вдвое. Только заклинания исполнение желаний [wish] и высшее восстановление [greater restoration], наложенное как заклинание 9-го уровня, могут обратить вспять эти эффекты и вернуть цели её предыдущий возраст.
