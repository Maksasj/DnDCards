    book: Xanathar's Guide to Everything
level: 0
school: вызов
ritual: false
casting_time: 1 действие
range: 30 футов
components: В, С, М
material: живая блоха
duration: Мгновенная
concentration: false
classes:
  - волшебник
  - друид
