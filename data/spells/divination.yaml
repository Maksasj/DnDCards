id: divination
name: Предсказание
name_en: Divination
source_url: https://dnd.su/spells/266-divination/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/spells/10484-divination
level: 4
school: прорицание
ritual: true
casting_time: 1 действие
range: На себя
components: В, С, М
material: благовония и жертвенное подношение, подходящее вашей религии, стоящие вместе как минимум 25 зм, расходуемые заклинанием
duration: Мгновенная
concentration: false
classes:
  - волшебник
