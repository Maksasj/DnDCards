higher_levels: Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждый уровень ячейки выше второго.
description: Существо, которого вы касаетесь, становится невидимым до окончания действия заклинания. Все, что цель несёт или носит невидимо, пока находится у неё. Заклинание оканчивается на цели, если она совершает атаку или накладывает заклинание.
