higher_levels: Если вы накладываете это заклинание, используя ячейку 2-го уровня или выше, максимальная длина предмета увеличивается на 1 фут за каждый уровень ячейки выше первого.
description: |-
  Вам нужно выжать ещё несколько золотых из торговца, которому вы пытаетесь продать странную статую осьминога, «освобождённую» вами из храма хаоса? Или занизить стоимость кое-каких магических ценностей, когда к вам заглянет сборщик налогов? Искажение цены вам в этом поможет.

  Выберите один предмет длиной не больше 1 фута в любом из измерений. В можете удвоить его видимую ценность, добавив иллюзорные блеск и привлекательность, или уменьшить на половину, добавив иллюзорных царапин, вмятин и других неприглядных черт. Любой, кто внимательно изучит предмет и совершит проверку Интеллекта (Расследование) против Сл ваших заклинаний, узнает настоящую цену.
