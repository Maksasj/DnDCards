id: fortunes-favor
name: Благословение удачи
name_en: Fortune's favor
source_url: https://dnd.su/spells/2445-fortunes-favor/
sources:
  - code: EGW
    book: Explorer's Guide to Wildemount
level: 2
school: прорицание
ritual: false
casting_time: 1 минута
range: 60 футов
components: В, С, М
material: жемчужина, стоящая как минимум 100 зм, расходуемая заклинанием
duration: 1 час
concentration: false
subclasses:
  - магия хронургии (волшебник)
  - магия гравитургии (волшебник)
higher_levels: Если вы накладываете это заклинание, используя ячейку 3-го уровня или выше, вы можете сделать целью одно дополнительное существо за каждую ячейку выше второго.
description: "Вы даруете искру потенциала себе или другому согласному существу, которое вы можете видеть в пределах дистанции. Когда выбранное существо совершает бросок атаки, проверку характеристики или спасбросок до окончания заклинания, оно может окончить заклинание на себе и бросить дополнительный к20 и решить, какой из бросков использовать. В качестве альтернативы, когда по выбранному существу совершается бросок атаки, оно может окончить заклинание на себе и бросить дополнительный к20 и решить, какой из бросков использовать: цели или противника. Если оригинальный бросок к20 совершался с преимуществом или помехой, существо совершает дополнительный бросок к20 после того, как оригинальный бросок был совершён с преимуществом или помехой."
