id: wood-elf-magic
name: Магия лесных эльфов
name_en: Wood elf magic
source_url: https://dnd.su/feats/152-wood-elf-magic/
sources:
  - code: XGE
    book: Xanathar's Guide to Everything
prerequisite: Эльф (лесной)
description: Вы изучаете магию первобытных лесов, которые почитаются и защищаются вашим народом. Вы изучаете один заговор друида на ваш выбор. Вы также изучаете заклинания скороход [longstrider] и бесследное передвижение [pass without trace], каждое из которых вы можете наложить один раз не тратя ячейку заклинаний. Вы восстанавливаете возможность накладывать их таким образом в конце продолжительного отдыха. Мудрость – базовая характеристика для этих трёх заклинаний.
