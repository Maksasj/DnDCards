id: keenness-of-the-stone-giant
name: Чуткость каменного великана
name_en: Keenness of the stone giant
source_url: https://dnd.su/feats/221-keenness-of-the-stone-giant/
sources:
  - code: BPGG
    book: "Bigby Presents: Glory of the Giants"
prerequisite: 4 уровень, черта «Удар Великанов (Каменный удар)»
description: |-
  Вы проявляете физические способности, характерные для каменных великанов, что даёт вам следующие преимущества:

  **Увеличение характеристики.** Увеличьте значение Силы, Телосложения или Мудрости на 1 при максимуме 20.

  **Горное зрение**. Вы получаете тёмное зрение в радиусе 60 футов. Если у вас уже есть тёмное зрение из другого источника, его диапазон увеличивается на 60 футов.

  **Бросок камня.** Бонусным действием вы можете взять камень и совершить им магическую атаку. Эта атака является дальнобойной атакой заклинанием с дальностью 60 футов, которая в качестве базовой характеристики заклинаний использует ту, которую вы повысили при получении этой черты. При попадании камень наносит 1к10 урона силовым полем, и если цель существо, она должна преуспеть в спасброске Силы (Сл равна 8 + ваш бонус мастерства + модификатор базовой характеристики) или будет сбита с ног. Вы можете использовать это бонусное действие количество раз, равное вашему бонусу мастерства и вы восстанавливаете все израсходованные использования, когда заканчиваете продолжительный отдых.
