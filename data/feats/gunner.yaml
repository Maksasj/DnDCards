id: gunner
name: Знаток огнестрельного оружия
name_en: Gunner
source_url: https://dnd.su/feats/162-gunner/
sources:
  - code: TCE
    book: Tasha's Cauldron of Everything
description: |-
  Ваша рука быстра, а глаз остр, когда вопрос касается огнестрельного оружия, именно это и дарует вам следующие преимущества:

  Увеличьте значение вашей Ловкости на 1, при максимуме 20. Вы получаете владение огнестрельным оружием (см. раздел «Огнестрельное оружие» в *«Руководстве мастера»*). Вы игнорируете свойство «перезарядка» у огнестрельного оружия. Наличие противника в пределах 5 футов от вас не накладывает помехи на ваши броски дальнобойных атак.
