id: poisoner
name: Отравитель
name_en: Poisoner
source_url: https://dnd.su/feats/164-poisoner/
sources:
  - code: TCE
    book: Tasha's Cauldron of Everything
url_2024: https://next.dnd.su/feats/346-poisoner
description: |-
  Вы можете изготавливать и применять смертельные яды, получая следующие преимущества:

  - Когда вы совершаете бросок урона для нанесения урона ядом, он игнорирует сопротивление урону ядом.
  - Вы можете наносить яд на оружие или боеприпасы бонусным действием, а не действием.
  - Вы получаете владение инструментами отравителя, если вы ими ещё не владеете. За один час работы с помощью инструментов отравителя, расходуя материалы на 50 зм, вы можете создать количество доз сильнодействующего яда, равное вашему бонусу мастерства. После нанесения этого яда на оружие или боеприпасы яд сохраняет свою силу в течение 1 минуты или до тех пор, пока вы не попадете атакой этим оружием или боеприпасами. Когда существо получает урон от отравленного оружия или отравленных боеприпасов, оно должно преуспеть в спасброске Телосложения Сл 14, иначе получит 2к8 урона ядом и станет отравленным до конца вашего следующего хода.
