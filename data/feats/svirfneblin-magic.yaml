id: svirfneblin-magic
name: Магия свирфнеблинов
name_en: Svirfneblin magic
source_url: https://dnd.su/feats/178-svirfneblin-magic/
sources:
  - code: SCAG
    book: Sword Coast Adventurer's Guide
prerequisite: Гном (глубинный гном)
description: "Вы унаследовали врождённую способность к магии от своих предков. Она позволяет вам накладывать на себя заклинание необнаружимость [nondetection] по желанию и без надобности использовать материальные компоненты. Вы также можете однократно наложить следующие заклинания: глухота/слепота [blindness/deafness], размытый образ [blur] и маскировка [disguise self]. Вы восстанавливаете возможность накладывать эти заклинания закончив продолжительный отдых. Интеллект является базовой характеристикой для накладывания всех этих заклинаний."
