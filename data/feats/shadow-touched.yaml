id: shadow-touched
name: Затронутый тенью
name_en: Shadow touched
source_url: https://dnd.su/feats/160-shadow-touched/
sources:
  - code: TCE
    book: Tasha's Cauldron of Everything
description: |-
  Ваше взаимодействие с магией Царства Теней изменило вас, даровав вам следующие преимущества:

  Увеличьте значение вашего Интеллекта, Мудрости или Харизмы на 1 при максимуме 20. Вы узнаёте заклинание невидимость [invisibility] и одно заклинание 1-го уровня по вашему выбору. Заклинание 1-го уровня должно принадлежать школе Иллюзии или Некромантии. Вы можете накладывать каждое из этих заклинаний без затрат ячеек заклинаний. Как только вы накладываете любое из этих заклинаний подобным образом, вам необходимо закончить продолжительный отдых, чтобы наложить это заклинание подобным образом вновь. Вы также можете накладывать эти заклинания, используя любые имеющиеся у вас ячейки заклинаний подходящего уровня. Базовой характеристикой для этих заклинаний является та, которую вы увеличили данной чертой.
