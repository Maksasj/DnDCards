id: fey-teleportation
name: Телепортация фей
name_en: Fey teleportation
source_url: https://dnd.su/feats/156-fey-teleportation/
sources:
  - code: XGE
    book: Xanathar's Guide to Everything
prerequisite: Эльф (высший)
description: |-
  Изучение знаний высших эльфов открыло вам силу фей, которой владеют немногие эльфы, за исключением ваших собратьев эладринов. Опираясь на свое родство с феями, вы можете на мгновение пройти через Страну Фей, сократив свой путь. Вы получаете следующие преимущества:

  Увеличьте значение вашего Интеллекта или Харизмы на 1 при максимуме 20. Вы изучаете как читать, говорить и писать на Сильване. Вы изучаете заклинание туманный шаг [misty step] и можете наложить его один раз без использования ячейки заклинания. Вы восстанавливаете возможность накладывать его таким образом, когда завершаете короткий или продолжительный отдых. Интеллект – базовая характеристика для этого заклинания.
