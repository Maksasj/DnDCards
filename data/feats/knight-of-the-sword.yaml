id: knight-of-the-sword
name: Рыцарь Меча
name_en: Knight of the Sword
source_url: https://dnd.su/feats/255-knight-of-the-sword/
sources:
  - code: SDQ
    book: "Dragonlance: Shadow of the Dragon Queen"
prerequisite: 4 уровень, предыстория «Соламнийский Рыцарь»
description: |-
  Вы рыцарь Соламнии, связанный с Орденом Меча, группой, посвященной героизму и мужеству. Храбрость укрепляет ваш дух, предоставляя следующие преимущества:

  **Увеличение характеристик**. Увеличьте значение Интеллекта, Мудрости или Харизмы на 1 при максимуме 20.

  **Деморализующий удар**. Один раз за ход, когда вы попадаете по существу броском атаки оружием, вы можете попытаться напугать эту цель. Цель должна совершить спасбросок Мудрости (Сл равен 8 + ваш бонус мастерства + модификатор характеристики, увеличенной этой чертой). При провале цель становится испуганной вами до конца вашего следующего хода. В случае успеха, цель, до конца своего следующего хода, совершает следующий бросок атаки с помехой. Вы можете использовать это преимущество количество раз, равное вашему бонусу мастерства, и вы восстанавливаете все израсходованные использования, когда заканчиваете продолжительный отдых.
