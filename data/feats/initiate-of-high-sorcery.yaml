id: initiate-of-high-sorcery
name: Посвящённый в Высшее волшебство
name_en: Initiate of High Sorcery
source_url: https://dnd.su/feats/248-initiate-of-high-sorcery/
sources:
  - code: SDQ
    book: "Dragonlance: Shadow of the Dragon Queen"
prerequisite: кампания в Саге о Копье; Чародей, Волшебник или предыстория «Маг Высшего Волшебства»
description: |-
  Вы прошли обучение у заклинателей, связанных с Магами Высшего волшебства.

  Выберите одну из трёх лун Кринна, влияющих на вашу магию: чёрная луна Нуитари, красная луна Лунитари или белая луна Солинари. Вы изучаете один заговор на ваш выбор из списка заклинаний волшебника и два заклинания 1-го уровня согласно выбранной луне, как указано в таблице «Лунные заклинания».

  **Лунные заклинания**

  | Луна | Заклинания 1-го уровня |
  | Нуитари | Выберите два из диссонирующий шёпот [dissonant whispers], псевдожизнь [false life], сглаз [hex] и луч болезни [ray of sickness] |
  | Лунитари | Выберите два из сверкающие брызги [color spray], маскировка [disguise self], падение пёрышком [feather fall] и скороход [longstrider] |
  | Солинари | Выберите два из понимание языков [comprehend languages], обнаружение зла и добра [detect evil and good], защита от зла и добра [protection from evil and good] и щит [shield] |

  Вы можете накладывать каждое из выбранных заклинаний 1-го уровня без ячейки заклинания, и вы должны закончить продолжительный отдых, прежде чем вы сможете снова наложить их таким образом. Вы также можете наложить заклинания, используя любые имеющиеся у вас ячейки заклинаний.

  Вашей базовой характеристикой для заклинаний этой черты — Интеллект, Мудрость или Харизма (определите при выборе этой черты).
