id: artificer-initiate
name: Посвящённый в изобретательство
name_en: Artificer initiate
source_url: https://dnd.su/feats/166-artificer-initiate/
sources:
  - code: TCE
    book: Tasha's Cauldron of Everything
description: |-
  Вы обучились некоторым изобретательским хитростям:

  - Вы узнаёте один заговор по вашему выбору из списка заклинаний изобретателя, и вы узнаёте одно заклинание 1-го уровня по вашему выбору из этого же списка. Базовой заклинательной характеристикой для этих заклинаний является Интеллект.
  - Вы можете накладывать заклинание 1-го уровня, которое вы узнали от этой черты, без использования ячеек заклинаний, и должны закончить продолжительный отдых, прежде чем сможете снова воспользоваться этой особенностью. Вы можете также накладывать это заклинание, используя любые имеющиеся у вас ячейки заклинаний.
  - Вы получаете владение одним из инструментов ремесленника по вашему выбору и можете использовать этот инструмент в качестве заклинательной фокусировки для тех заклинаний, которые вы накладываете, используя Интеллект в качестве базовой характеристики.
