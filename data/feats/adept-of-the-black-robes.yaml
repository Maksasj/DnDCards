id: adept-of-the-black-robes
name: Адепт Чёрных одежд
name_en: Adept of the Black Robes
source_url: https://dnd.su/feats/249-adept-of-the-black-robes/
sources:
  - code: SDQ
    book: "Dragonlance: Shadow of the Dragon Queen"
prerequisite: 4 уровень, черта «Посвящённый в Высшее волшебство» (Нуитари)
description: |-
  Вы выбрали луну Нуитари, чтобы влиять на свою магию, и ваши амбиции и лояльность к Ордену Чёрных одежд были признаны, предоставляя вам следующие преимущества:

  **Амбициозная магия**. Вы изучаете одно заклинание 2-го уровня на ваш выбор. Заклинание 2-го уровня должно быть из школы очарования или некромантии. Вы можете наложить заклинание 2-го уровня от этой черты без траты ячейки заклинания, и вы должны завершить продолжительный отдых, прежде чем снова сможете наложить его таким образом. Вы также можете наложить это заклинание, используя имеющиеся у вас ячейки заклинаний соответствующего уровня. Базовая характеристика выбирается, когда вы получаете черту «Посвящённый в Высшее чародейство».

  **Канал Жизни**. Вы можете направить свою жизненную силу в силу своей магии. Когда существо, которое вы можете видеть в пределах 60 футов от вас, проваливает спасбросок от заклинания, наносящего урон, которое вы накладываете, вы можете потратить количество костей хитов, равное уровню заклинания. Бросьте использованные кости хитов и сложите их. Урон, который получает существо, увеличивается на получившуюся сумму.
