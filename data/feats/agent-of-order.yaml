id: agent-of-order
name: Агент Порядка
name_en: Agent of order
source_url: https://dnd.su/feats/222-agent-of-order/
sources:
  - code: PAM
    book: "Planescape: Adventures in the Multiverse"
prerequisite: 4 уровень, черта «Наследник внешних планов (законный внешний план)»
description: |-
  Вы можете направлять космические силы порядка, которые связывают мультивселенную в закономерности. Ваши действия зависят от вас, но эти силы дают вам следующие преимущества:

  **Увеличение характеристик*****.*** Увеличьте значение характеристики по вашему выбору на 1 при максимуме 20.

  **Стазисный удар.** Один раз за ход, когда вы наносите урон существу, которое видите в пределах 60 футов от себя, вы можете нанести цели дополнительный 1к8 урона силовым полем и она должна преуспеть в спасброске Мудрости (Сл равна 8 + ваш бонус мастерства + модификатор базовой характеристики, выбранной при взятии черты «Наследник внешних планов»), потому что спектральные оковы пытаются поймать его. При успехе цель избегает этого. При провале цель становится опутаной до начала вашего следующего хода. Эти оковы проявляются в виде цепей или какого-либо другого символа стазиса. Вы можете использовать это преимущество количество раз, равное вашему бонусу мастерства, и вы восстанавливаете все потраченные использования, когда оканчиваете продолжительный отдых.
