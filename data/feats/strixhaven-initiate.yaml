id: strixhaven-initiate
name: Поступивший в Стриксхейвен
name_en: Strixhaven initiate
source_url: https://dnd.su/feats/179-strixhaven-initiate/
sources:
  - code: SCC
    book: "Strixhaven: A Curriculum of Chaos"
description: |-
  Вы ознакомились с некоторыми магическими теориями и выучили несколько заклинаний, связанных с Университетом Стриксхейвен.

  Выберите один из факультетов Стриксхейвена: Лорхолд, Призмари, Квандрикс, Сильверквилл или Визерблум. Вы узнаёте два заговора и одно заклинание 1-го уровня в зависимости от выбранного вами факультета, как указано в таблице «Заклинания Стриксхейвена».

  Вы можете накладывать заклинание 1-го уровня без затрат ячеек заклинаний и вам необходимо закончить продолжительный отдых, чтобы наложить это заклинание подобным образом вновь. Вы также можете накладывать это заклинание, используя любые ячейки заклинаний, которые у вас есть.

  Интеллект, Мудрость или Харизма является вашей базовой характеристикой для этого заклинания (выберите одну из них при получении этой черты).

  **Заклинания Стриксхейвена**

  | Факультет | Заговоры | Заклинание 1-го уровня |
  | Лорхолд | Выберите два: свет [light], священное пламя [sacred flame] и чудотворство [thaumaturgy] | Выберите заклинание 1-го уровня из списка заклинаний жреца или волшебника. |
  | Призмари | Выберите два: огненный снаряд [fire bolt], фокусы [prestidigitation] и луч холода [ray of frost]. | Выберите заклинание 1-го уровня из списка заклинаний барда или чародея. |
  | Квандрикс | Выберите два: искусство друидов [druidcraft], указание [guidance] и волшебная рука [mage hand]. | Выберите заклинание 1-го уровня из списка заклинаний друида или волшебника. |
  | Сильверквилл | Выберите два: священное пламя [sacred flame], чудотворство [thaumaturgy] и злая насмешка [vicious mockery]. | Выберите заклинание 1-го уровня из списка заклинаний барда или жреца. |
  | Визерблум | Выберите два: леденящее прикосновение [chill touch], искусство друидов [druidcraft] и уход за умирающим [spare the dying]. | Выберите заклинание 1-го уровня из списка заклинаний друида или волшебника. |
