id: drow-high-magic
name: Высшая магия дроу
name_en: Drow high magic
source_url: https://dnd.su/feats/146-drow-high-magic/
sources:
  - code: XGE
    book: Xanathar's Guide to Everything
prerequisite: Эльф (дроу)
description: |-
  Вы изучаете магию, присущую тёмным эльфам.

  Вы изучаете заклинание обнаружение магии [detect magic] и можете свободно накладывать его без затрат ячеек заклинаний. Вы также изучаете заклинания левитация [levitate] и рассеивание магии [dispel magic], каждое из которых вы можете наложить один раз без затрат ячеек заклинаний. Вы восстанавливаете возможность накладывать эти два заклинания таким способом после продолжительного отдыха. Харизма – базовая характеристика для этих трёх заклинаний.
