id: flames-of-phlegethos
name: Пламя Флегетоса
name_en: Flames of Phlegethos
source_url: https://dnd.su/feats/155-flames-of-phlegethos/
sources:
  - code: XGE
    book: Xanathar's Guide to Everything
prerequisite: Тифлинг
description: |-
  Вы научились призывать адский огонь, и он вас слушается. Вы получаете следующие преимущества:

  - Увеличьте значение вашего Интеллекта или Харизмы на 1 при максимуме 20.
  - Когда вы делаете бросок урона огнём, который наносит ваше заклинание, вы можете перебросить любые «1» на костях урона огнём, но должны использовать новые результаты, даже если они тоже будут «1».
  - Когда вы накладываете заклинание, которое наносит урон огнём, вы можете заставить пламя окутать вас до конца вашего следующего хода. Пламя не причиняет урон вам и вашим вещам, а также излучает яркий свет на 30 футов и тусклый свет ещё на 30 футов. Пока пламя существует, любое существо в пределах 5 футов получают 1к4 урона огнём, если попадают по вам рукопашной атакой.
