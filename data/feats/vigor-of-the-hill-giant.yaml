id: vigor-of-the-hill-giant
name: Стойкость холмового великана
name_en: Vigor of the hill giant
source_url: https://dnd.su/feats/220-vigor-of-the-hill-giant/
sources:
  - code: BPGG
    book: "Bigby Presents: Glory of the Giants"
prerequisite: 4 уровень, черта «Удар Великанов (Холмовой удар)»
description: |-
  Вы проявили характерную для холмовых великанов стойкость, что дало вам следующие преимущества:

  **Увеличение характеристик.** Увеличьте значение Силы, Телосложения или Мудрости на 1 при максимуме 20.

  **Бастион.** Когда вы подвергаетесь эффекту, который переместит вас как минимум на 5 футов или собьёт с ног, вы можете реакцией устоять на ногах. Тогда вы не будете ни сдвинуты, ни сбиты с ног.

  **Железный желудок**. Всякий раз, когда вы едите пищу во время короткого отдыха и тратите одну или несколько Костей Хитов, чтобы восстановить хиты, вы восстанавливаете дополнительные хиты, равные вашему модификатору Телосложения + вашему бонусу мастерства.
