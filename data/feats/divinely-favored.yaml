id: divinely-favored
name: Любимец богов
name_en: Divinely Favored
source_url: https://dnd.su/feats/247-divinely-favored/
sources:
  - code: SDQ
    book: "Dragonlance: Shadow of the Dragon Queen"
prerequisite: 4 уровень, кампания «Саге о Копье»
description: |-
  Божество выбрало вас, чтобы нести искру своей силы.

  Вы изучаете один заговор по вашему выбору из списка заклинаний жреца и одно заклинание 1-го уровня, основанное на мировоззрении вашего персонажа, как указано в таблице «Заклинания мировоззрения» ниже. Вы также изучаете заклинание гадание [augury].

  **Заклинания мировоззрения**

  | Мировоззрение | Заклинание 1-го уровня |
  | Злое | Выберите одно из списка заклинаний колдуна 1-го уровня |
  | Доброе | Выберите одно из списка заклинаний жреца 1-го уровня |
  | Нейтральное | Выберите одно из списка заклинаний друида 1-го уровня |

  Вы можете наложить выбранное заклинание 1-го уровня и заклинание гадание [augury] без ячейки заклинания, и вы должны закончить продолжительный отдых, прежде чем сможете снова наложить любое из этих заклинаний таким же образом. Вы также можете накладывать эти заклинания, используя имеющиеся у вас ячейки заклинаний соответствующего уровня.

  Вашей базовой характеристикой для заклинаний от этой черты — Интеллект, Мудрость или Харизма (выберите, когда вы выбираете эту черту).

  Кроме того, вы можете использовать священный символ в качестве фокусировки заклинаний для любых заклинаний, которые используют базовую характеристику, определённую при выборе этой черты.
