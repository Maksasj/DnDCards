id: cohort-of-chaos
name: Когорта Хаоса
name_en: Cohort of chaos
source_url: https://dnd.su/feats/225-cohort-of-chaos/
sources:
  - code: PAM
    book: "Planescape: Adventures in the Multiverse"
prerequisite: 4 уровень, «Наследник внешних планов (хаотичный внешний план)»
description: |-
  Вы можете направить космические силы хаоса, чтобы получить следующие преимущества:

  **Увеличение характеристик.** Увеличьте значение характеристики по вашему выбору на 1 при максимуме 20.

  **Хаотическая вспышка.**Когда вы выбрасываете «1» или «20» при броске атаки или спасброске, магия хаоса течёт через вас. Совершите бросок по таблице «Хаотические вспышки», чтобы определить, что произойдет. Вспышка длится до конца вашего следующего хода, а новая вспышка не может появиться до тех пор, пока не закончится первая вспышка.

  **Хаотические вспышки**

  | к4 | Вспышка |
  | 1 | **Боевая ярость.** Существо по вашему выбору, которое вы видите, наполняется безрассудной яростью. Оно совершает броски атаки с преимуществом и совершает проверки характеристик с помехой. |
  | 2 | **Поле разрушения.** Волны энергии колеблются вокруг вас. Каждое существо, которое начинает свой ход в пределах 5 футов от вас или перемещается в эту область впервые за ход, получает 1к8 урона силовым полем. |
  | 3 | **Свободный**. Когда вы двигаетесь, вы можете использовать часть или всю свою скорость ходьбы, чтобы один раз телепортироваться вместе с любым снаряжением, которое вы носите или несёте, на расстояние, вплоть до используемой скорости в свободное пространство, которое вы можете видеть. |
  | 4 | **Воющие ветры**. Воющие ветры кружатся вокруг вас в сфере радиусом 15 футов. Вы и любое существо в этом радиусе совершаете спасброски Мудрости с помехой. |
