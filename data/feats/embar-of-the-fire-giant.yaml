id: embar-of-the-fire-giant
name: Пылкость огненного великана
name_en: Embar of the fire giant
source_url: https://dnd.su/feats/217-embar-of-the-fire-giant/
sources:
  - code: BPGG
    book: "Bigby Presents: Glory of the Giants"
prerequisite: 4 уровень, черта «Удар Великанов (Огненный удар)»
description: |-
  Вы проявляете ярость битвы, характерную для огненных великанов, что даёт вам следующие преимущества:

  **Увеличение характеристик.** Увеличьте значение Силы, Телосложения или Мудрости на 1 при максимуме 20.

  **Рождённый пламенем.**Вы получаете сопротивление урону огнём.

  **Пылающее воспламенение.**Когда вы совершаете действие Атака в свой ход, вы можете заменить одну атаку магическим взрывом пламени. Каждое существо по вашему выбору в пределах сферы радиусом 15 футов с центром на вас должно совершить спасбросок Ловкости (Сл равна 8 + ваш бонус мастерства + модификатор характеристики, увеличенной этой чертой). При провале существо получает 1к8 + ваш бонус мастерства урона огнём и ослепляется до начала вашего следующего хода. При успехе существо получает только половину урона. Вы можете использовать «Пылающее воспламенение» количество раз, равное вашему бонусу мастерства (но не больше раза в ход), и вы восстанавливаете все израсходованные использования, когда заканчиваете продолжительный отдых.
