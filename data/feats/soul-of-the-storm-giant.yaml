id: soul-of-the-storm-giant
name: Душа штормового великана
name_en: Soul of the storm giant
source_url: https://dnd.su/feats/213-soul-of-the-storm-giant/
sources:
  - code: BPGG
    book: "Bigby Presents: Glory of the Giants"
prerequisite: 4 уровень, черта «Удар Великанов (Штормовой удар)»
description: |-
  Вы проявили магию бури, характерную для штормовых великанов, что дает вам следующие преимущества:

  **Увеличение характеристик**. Увеличьте значение Силы, Мудрости или Харизмы на 1 при максимуме 20.

  **Аура водоворота**. Бонусным действием вы окружаете себя аурой магического ветра и молнии, которая простирается на 10 футов от вас во всех направлениях, но не через полное укрытие. Аура длится до начала вашего следующего хода или до тех пор, пока вы не станете недееспособны. Пока аура активна, вы получаете сопротивление урону звуком и электричеством. Так же броски атаки против вас совершаются с помехой, и всякий раз, когда существо начинает свой ход в пределах ауры, вы можете заставить его совершить спасбросок Силы (Сл равна 8 + ваш бонус мастерства + модификатор характеристики, увеличенной этой чертой). При провале скорость существа уменьшается вдвое до начала его следующего хода. Вы можете использовать это бонусное действие количество раз, равное вашему бонусу мастерства, и вы восстанавливаете все потраченные использования, когда заканчиваете продолжительный отдых.
