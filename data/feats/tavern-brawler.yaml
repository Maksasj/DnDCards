id: tavern-brawler
name: Драчун
name_en: Tavern brawler
source_url: https://dnd.su/feats/112-tavern-brawler/
sources:
  - code: PH14
    book: Player's Handbook
url_2024: https://next.dnd.su/feats/318-tavern-brawler
description: |-
  Привыкнув к мордобою с использованием подручных предметов, вы получаете следующие преимущества:

  Увеличьте значение Силы или Телосложения на 1 при максимуме 20. Вы получаете владение импровизированным оружием. Ваш безоружный удар использует для урона к4. Если вы в свой ход попадаете по существу безоружным ударом или импровизированным оружием, вы можете бонусным действием попытаться схватить цель.
