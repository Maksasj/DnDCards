id: adept-of-the-white-robes
name: Адепт Белых одежд
name_en: Adept of the White Robes
source_url: https://dnd.su/feats/251-adept-of-the-white-robes/
sources:
  - code: SDQ
    book: "Dragonlance: Shadow of the Dragon Queen"
prerequisite: 4 уровень, черта «Посвящённый в Высшее волшебство» (Солинари)
description: |-
  Вы выбрали луну Солинари, чтобы влиять на свою магию, и ваша клятва использовать магию, чтобы сделать мир лучше, была признана Орденом Белых одежд, предоставляя вам следующие преимущества:

  **Защитная магия**. Вы изучаете одно заклинание 2-го уровня на ваш выбор. Заклинание 2-го уровня должно быть из школы ограждения или прорицания. Вы можете наложить заклинание 2-го уровня этого умения без ячейки заклинания, и вы должны завершить продолжительный отдых, прежде чем снова сможете наложить его таким образом. Вы также можете наложить это заклинание, используя имеющиеся у вас ячейки заклинаний соответствующего уровня. Базовая характеристика выбирается, когда вы получаете черту «Посвящённый в Высшее Чародейство».

  **Защитная палата**. Когда вы или существо, которое вы можете видеть в пределах 30 футов от вас, получает урон, вы можете реакцией потратить ячейку заклинания и окружить цель защитной магией. Бросьте количество к6, равное уровню израсходованной ячейки заклинания, и уменьшите урон, получаемый целью, на сумму бросков на этих костях + ваш модификатор базовой характеристики.
