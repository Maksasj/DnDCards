id: mobile
name: Подвижный
name_en: Mobile
source_url: https://dnd.su/feats/132-mobile/
sources:
  - code: PH14
    book: Player's Handbook
description: |-
  Вы невероятно быстры и ловки. Вы получаете следующее преимущество:

  Ваша скорость увеличивается на 10 футов. Когда вы используете действие Рывок, труднопроходимая местность в этом ходу не замедляет ваше перемещение. Если вы совершаете рукопашную атаку по существу, вы до конца этого хода не провоцируете от него атаки, вне зависимости от того, попадёте или нет.
