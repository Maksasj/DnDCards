id: scion-of-the-outer-planes
name: Наследник внешних планов
name_en: Scion of the outer planes
source_url: https://dnd.su/feats/233-scion-of-the-outer-planes/
sources:
  - code: PAM
    book: "Planescape: Adventures in the Multiverse"
prerequisite: кампания в сеттинге «Planescape»
description: |-
  Ваша связь с Внешним планом наполняет вас энергией этого места. Выберите план, указанный в таблице «Планарное влияние». Ваш выбор даёт вам сопротивление виду урона и возможность накладывать заговор, указанный в таблице. Вы можете наложить этот заговор без материальных компонентов, а вашей базовой характеристикой для него является Интеллект, Мудрость или Харизма (выберите, когда выбираете эту черту).

  | План | Сопротивление урону | Заговор |
  | Хаотичный Внешний план | Яд | малая иллюзия [minor illusion] |
  | Злой Внешний план | Некротическая энергия | леденящее прикосновение [chill touch] |
  | Добрый Внешний план | Излучение | священное пламя [sacred flame] |
  | Законный Внешний план | Силовое поле | указание [guidance] |
  | Внешние земли | Психическая энергия | волшебная рука [mage hand] |
