description: |-
  Вы прошли интенсивную физическую подготовку и получаете следующие преимущества:

  Увеличьте значение Силы или Ловкости на 1 при максимуме 20. Если вы лежите ничком, вставание использует только 5 футов перемещения. Лазание не заставляет вас тратить дополнительное перемещение. Вы можете совершать прыжок в длину или высоту с разбега, переместившись только на 5 футов, а не на 10.
