id: outlands-envoy
name: Посол Внешних земель
name_en: Outlands envoy
source_url: https://dnd.su/feats/226-outlands-envoy/
sources:
  - code: PAM
    book: "Planescape: Adventures in the Multiverse"
prerequisite: 4 уровень, «Наследник внешних планов (Внешние земли)»
description: |-
  Вы провели много времени в Сигиле или где-то ещё во Внешних землях, на перекрестке мультивселенной. Погружение в сходящиеся планарные энергии даёт вам следующие преимущества:

  **Увеличение характеристик.** Увеличьте значение характеристики по вашему выбору на 1 при максимуме 20.

  **Эмиссар перекрёстка.** Вы изучаете заклинания туманный шаг [misty step] и языки [tongues]. Вы можете наложить каждое заклинание один раз, используя это умение без затрат ячеек заклинаний, и вы должны окончить продолжительный отдых, прежде чем вы сможете снова наложить это заклинание таким образом. Когда вы накладываете языки [tongues], используя эту черту, вам не требуются материальные компоненты. Вы также можете накладывать эти заклинания, используя имеющиеся у вас ячейки заклинаний соответствующего уровня. Базовая характеристика для этих заклинаний выбирается, когда вы получаете черту «Наследник внешних планов».
