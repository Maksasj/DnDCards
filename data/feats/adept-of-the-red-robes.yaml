id: adept-of-the-red-robes
name: Адепт Красных одежд
name_en: Adept of the Red Robes
source_url: https://dnd.su/feats/250-adept-of-the-red-robes/
sources:
  - code: SDQ
    book: "Dragonlance: Shadow of the Dragon Queen"
prerequisite: 4 уровень, черта «Посвящённый в Высшее волшебство» (Лунитари)
description: |-
  Вы выбрали луну Лунитари, чтобы влиять на свою магию, и ваша приверженность поддержанию баланса между всеми вещами была признана Орденом Красных одежд, предоставляя вам следующие преимущества:

  **Проницательная магия.** Вы изучаете одно заклинание 2-го уровня на ваш выбор. Заклинание 2-го уровня должно быть из школы магии иллюзии или преобразования. Вы можете наложить заклинание 2-го уровня этой черты без траты ячейки заклинания, и вы должны завершить продолжительный отдых, прежде чем снова сможете наложить его таким образом. Вы также можете наложить это заклинание, используя имеющиеся у вас ячейки заклинаний соответствующего уровня. Базовая характеристика выбирается, когда вы получаете черту «Посвящение в Высшее волшебство».

  **Магический баланс.**Когда вы совершаете бросок атаки или проверку характеристики и выбрасываете «9» или меньше на к20, вы можете сбалансировать судьбу и рассматривать бросок как 10. Вы можете сбалансировать судьбу таким образом количество раз, равное вашему бонусу мастерства, и вы восстанавливаете все потраченные использования, когда заканчиваете продолжительный отдых.
