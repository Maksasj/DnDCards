description: |-
  Пока вы носите этот золотой браслет, вы становитесь иммунны к состоянию окаменевшийи способны действием накладывать заклинание окаменение [flesh to stone] (Сл спасброска 15) с помощью браслета. После того, как заклинание будет наложено 3 раза, вы больше не способны накладывать данное заклинание с помощью браслета. После этого вы становитесь способны действием накладывать заклинание изменение формы камня [stone shape], с помощью браслета. После того, как заклинание будет наложено 13 раз, браслет теряет свою магию и превращается из золотого браслета в свинцовый.

  ***Проклятие.*** Родство браслета с землей проявляется в виде необычного проклятия. Существа из плоти, сильно связанные с землей и камнем, такие как каменные великаны и дварфы, с преимуществом совершают спасбросок от *окаменения [flesh to stone]* накладываемого с помощью браслета. Если спасбросок такого существа будет успешен, браслет заканчивает вашу настройку на него и накладывает заклинание на вас. Вы совершаете свой спасбросок с помехой, и при провале вы мгновенно каменеете.
