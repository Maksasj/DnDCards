description: С помощью этого магического щита вы можете совершать дальнобойные атаки оружием. Он имеет нормальную дистанцию в 20 футов и максимальную дистанцию в 60 футов, и для броска атаки он использует вашу Силу или Ловкость (на ваш выбор). Если вы владеете щитом, вы владеете атаками, совершаемыми с использованием этого щита. При попадании он наносит 1к6 рубящего урона. Если вы бросите щит, он снова появится в вашей руке сразу после того, как попадет в цель или промахнется.
