description: |-
  Обычный хрустальный шар является очень редким предметом, примерно 6 дюймов диаметром. Если вы его касаетесь, вы можете действием накладывать им заклинание наблюдение [scrying] (Сл спасброска 17).

  Описанные ниже разновидности являются легендарными предметами, обладающими дополнительными свойствами.

  **Хрустальный шар истинного зрения.** Если вы смотрите в этот шар, вы обладаете истинным зрением в радиусе 120 футов с центром на сенсоре заклинания.

  **Хрустальный шар телепатии.** Если вы смотрите в этот хрустальный шар, вы можете телепатически общаться с существами, видимыми вами в пределах 30 футов от сенсора. Вы также можете действием наложить заклинание внушение [suggestion] (Сл спасброска 17) через сенсор на одно из таких существ. Вы не обязаны концентрироваться на *внушении*, но это заклинание оканчивается вместе с наблюдением [scrying]. Вы не можете повторно использовать внушающую способность этого хрустального шара до следующего рассвета.

  **Хрустальный шар чтения мыслей.**Вы можете действием наложить заклинание обнаружение мыслей [detect thoughts] (Сл спасброска 17), пока смотрите в этот хрустальный шар, нацеливаясь на существо, которое вы видите в пределах 30 футов от сенсора заклинания. Вы не обязаны концентрироваться на *обнаружении мыслей [detect thoughts]*, но это заклинание оканчивается вместе с наблюдением [scrying].
