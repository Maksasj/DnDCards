description: |-
  Небольшое портативное устройство представляет собой стеклянную панель со светящимся дисплеем, который реагирует на прикосновения. Контроллер питается от батареи, хранящейся в устройстве. Если поместить в него полную батарею, оно получает 3 заряда.

  Пока вы держите это устройство, действием вы можете потратить 1 из его зарядов, чтобы создать один из следующих эффектов:

  - **Управление.** Один Конструкт на ваш выбор в радиусе 60 футов от вас должен преуспеть в спасброске Мудрости Сл 15, иначе станет очарованным. Когда Конструкт очарован таким образом, он подчиняется вашим словесным командам, а также вы дистанционно можете общаться друг с другом через устройство. Каждый раз, когда очарованный Конструкт получает урон, он может повторить спасбросок. При успехе эффект заканчивается.
  - **Прерывание.** Конструкты на ваш выбор в радиусе 30 футов от вас должны преуспеть в спасброске Мудрости Сл 15, иначе станут недееспособны на одну минуту. Недееспособный Конструкт может повторить спасбросок в конце каждого своего хода. При успехе эффект заканчивается.

  ***Замена батареи.*** Пока у устройства остаются заряды, его батарею нельзя извлечь. Когда в нем останется 0 зарядов, вы можете заменить батарею на новую действием или бонусным действием.
