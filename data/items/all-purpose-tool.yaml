id: all-purpose-tool
name: Универсальный инструмент
name_en: All-purpose tool
source_url: https://dnd.su/items/2488-all-purpose-tool/
sources:
  - code: TCE
    book: Tasha's Cauldron of Everything
type_key: magic
attunement: false
type: Чудесный предмет
rarity: редкость варьируется (+1 необычный, +2 редкий, +3 очень редкий, требуется настройка изобретателем)
rarity_key: varies
description: |-
  Эта простая отвёртка может трансформироваться в различные инструменты: действием вы можете коснуться её и превратить в любой тип инструментов ремесленника по вашему выбору (список инструментов находится в главе «Снаряжение» в *«Книге игрока»*). В какие бы инструменты отвёртка ни превращалась, вы имеете владение этим инструментом.

  Держа этот инструмент, вы получаете бонус к броскам атаки и Сл спасбросков ваших заклинаний изобретателя. Бонус определяется редкостью инструмента.

  Действием вы можете сосредоточиться на инструменте, чтобы пропустить через него свои творческие силы. Выберите заговор, который вы не знаете, из списка заклинаний любого класса. В течение 8 часов вы можете использовать этот заговор, и он является для вас заговором изобретателя. Это свойство не может быть использовано вновь до следующего рассвета.
