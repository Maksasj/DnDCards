description: Серебряный колокольчик покрыт выгравированными на нем магическими символами. Пока вы держите колокольчик, действием вы можете наложить заклинание изгнание [banishment] (Сл спасброска 20). Если цель заклинания имеет 50 хитов или меньше, то она автоматически проваливает спасбросок. После того, как колокольчик был использован для наложения заклинания, он не может быть использован таким образом до следующего рассвета.
