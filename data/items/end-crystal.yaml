description: |-
  Кристалл Края — это Большой объект с Классом Доспеха 11, 30 хитами, уязвимостью к дробящему урону и урону звуком, сопротивлением колющему и рубящему урону

  и иммунитетом к урону психической энергией и ядам. Когда кристалл разрушен, он взрывается в сфере разрушительной энергии радиусом 20 футов. Любое существо в этой области должно совершить спасбросок Ловкости Сл 15, получая 21 (6к6) урона силовым полем при провале или половину этого урона при успехе.
