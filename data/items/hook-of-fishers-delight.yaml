description: |-
  К этому крошечному серебряному рыболовному крючку прикреплено маленькое золотое перышко. Чтобы он функционировал, пернатый крючок должен быть привязан к концу лески и погружен в достаточное количество воды, заполняемое по крайней мере 10-футовый куб. В конце каждого часа непрерывного погружения бросайте к6. При выпадении 6, на крючке появляется извивающаяся 6-дюймовая магическая рыба. Цвет и свойства магической рыбы определяются броском по таблице «Крючок рыбацкого восторга». Как только крючок призывает рыбу, он не сможет сделать это снова до следующего рассвета.

  Крючок рыбацкого восторга

  | к20 | Цвет рыбы | Свойства |
  | 1-10 | Зеленый с медными полосами | Эта вкусная рыба обеспечивает пищей, достаточной на целый день одному существу, которое её ест. Рыба теряет это свойство и сгнивает, если её не съесть в течение 24 часов после вылова. |
  | 11-14 | Желтый с чёрными полосами | Сняв с крючка эту отвратительную на вкус рыбу, её можно метнуть на расстояние до 120 футов, целясь в существо, которое видит метатель. Цель должна преуспеть в спасброске Силы Сл 15 иначе падает ничком. После этого рыба исчезает. |
  | 15-18 | Синий с белыми полосами | Когда её снимают с крючка, она извивается, расправляет крылья и следует за вами напевая прекрасную мелодию на Акване. Она исчезает через 2к4 часа или при уменьшении хитов до 0. Рыба использует блок характеристик квиппера [quipper], за исключением того, что она может дышать воздухом и имеет скорость полёта 30 футов |
  | 19-20 | Золотой с серебряными полосами | Эта вкусная рыба обеспечивает пищей, достаточной на целый день одному существу, которое её ест, а так же даёт 2к10 временных хитов этому существу. Рыба теряет эти свойства и сгнивает, если её не съесть в течение 24 часов после вылова. |
