description: |-
  Лезвия этих ножниц имеют множество зазубрин и вмятин, но все равно чисто режут. Ножницы функционируют как магический кинжал. Оружие обладает следующими свойствами:

  ***Вечно острые.*** Когда вы попадаете атакой, совершаемой этими ножницами, цель дополнительно получает 1к6 урона силовым полем .*** Разрезание нитей.*** Когда вы попадаете по существу атакой, совершаемой этими ножницами, вы можете изменить судьбу этого существа. Пока цель не закончит продолжительный отдых, броски атаки против неё наносят критическое попадание при результате «19» или «20» на к20. Как только это свойство будет использовано, оно не сможет быть использовано снова до следующего рассвета.
