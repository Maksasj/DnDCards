description: |-
  Силовой доспех напоминает комплект из необычных лат с тонко сочлененными суставами, соединенными маслянистым черным материалом, похожим на кожу. Доспехи были созданы, чтобы создать вид мускулистого воина, а большой шлем, который присутствует в комплекте, необычен тем, что в нем нет отверстий — только широкая стеклянная пластина спереди и второй кусок стекла над ней. Странные пластины, трубки и большие металлические выступы украшают доспехи, казалось бы, случайным образом. На задней части левой рукавицы доспеха находится прямоугольная металлическая коробка, из которой торчит короткий стержень с коническим красным кристаллом на конце.

  Нося этот доспех, вы получаете следующие преимущества:

  - У вас есть бонус +1 к КД.
  - Ваш показатель Силы равен 18 (это не оказывают на вас эффект, если ваша Сила без них равна 18 или выше).
  - Вы совершаете с преимуществом спасброски от смерти.

  Доспех имеет дополнительные возможности, которые могут питаться либо от энергетических ячеек, либо от вашей собственной жизненной энергии. Вы можете использовать бонусное действие, чтобы черпать энергию из энергоячейки или пожертвовать хитами, чтобы получить одно из следующих преимуществ:

  - Создание силового поля, чтобы получить 2к6 + 5 временных хитов (1 заряд или 5 хитов).
  - Активация ускорителей, чтобы получить скорость полета 15 футов на 1 минуту (1 заряд или 5 хитов).
  - ***Установленный на руке лазер:**Дальнобойная атака оружием:*+8 к попаданию, дальность 120 футов, одна цель. *Попадание*: 2к6 урона излучением (1 заряд или 5 хитов).
  - Перевод любых письмен, которые вы можете увидеть на любом немагическом языке, в общей сложности в одну тысячу слов за 1 минуту (1 заряд или 5 хитов).
  - Наполнение брони воздухом, позволяющим нормально дышать в любых условиях до 1 часа (1 заряд или 5 хитов).
  - Получение темного зрения в радиусе 60 футов на срок до 1 часа (1 заряд или 5 хитов).

  Доспех может использовать только одну энергетическую ячейку за раз. Доспех можно найти с одной прикрепленной энергетической ячейкой, содержащей 2к10 зарядов.

  Варианты Силового доспехаВ зависимости от того, где и как этот доспех появится в приключении, вы можете изменить характеристики легендарного Квалиша. ***Автоматическая защита.*** Если Квалиш не отключит автоматическую защиту костюма, никто не сможет приблизиться к доспехам, не отключив эту защиту. Рассматривайте доспех как щитостража [shield guardian], с вложенным в него заклинанием волшебная стрела [magic missile] с использованием ячейки заклинания 4-го уровня. Когда хиты доспеха уменьшаются до 0, его защита становится инертной, и к нему можно безопасно приближаться. ***Сражение воли.*** Когда новый пользователь надевает доспех, он считает себя превосходящим и пытается завладеть этим пользователем. Пользователь должен преуспеть в спасброске Харизмы Сл 13, иначе он окажется одержим доспехами. Во время одержимости пользователь становится недееспособным и теряет контроль над своим телом, но сохраняет сознание. Доспех использует характеристики одержимого пользователя (пользующегося доспехом), но не получает доступа к знаниям, умениям или навыкам пользователя. Для освобождения существа, пойманного в доспех, сначала необходимо победить автоматическую защиту брони (как указано выше). Пойманное существо также может совершить спасбросок Харизмы Сл 20 каждый день на рассвете. В случае успеха доспехи больше не контролируют существо и могут быть безопасно надеты этим существом в любое время. ***Стазис.*** Всякий раз, когда хиты существа в доспехе падают до 0, доспех помещает это существо в состояние стазиса. Находясь в этом состоянии, существо стабилизированно и не совершает спасброски от смерти, но доспех берет на себя управление существом (как указано выше). Кроме того, доспех пытается принять личность пользователя, уверяя своих союзников, что все в порядке. Чтобы высвободить пользователя, сначала необходимо победить автоматическую защиту доспеха (как указано выше). Существо в стазисе не совершает спасброски Харизмы, чтобы сломить контроль доспехов. ***Альтернативная энергия.*** Первоначально для питания силового доспеха требовались энергетические ячейки, но Квалиш адаптировал его для подпитки жизненной энергией носящего его существа. Вы можете решить, что доспех также может получать энергию из дополнительных источников или что энергетические элементы можно перезаряжать с помощью ремонтника, изобретателя или ремесленника. Союзники также могут подключиться к доспехам с помощью магии, создающей канал, похожий на астральный серебряный шнур. При таком соединении союзник по доброй воле может реакцией израсходовать часть своих хитов, чтобы подпитать способности доспеха.
