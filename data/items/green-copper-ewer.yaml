description: Любая отравленная жидкость, вылитая в этот кувшин, немедленно превращается в то же количество сладкого вина. Более того, существо, держащее кувшин за ручку, может приказать кувшину наполниться, создав 1 галлон вина, после чего кувшин больше не может производить вино до следующего рассвета.
