attunement: false
type: Чудесный предмет
rarity: редкость варьируется (необычный, редкий, очень редкий, легендарный, требуется настройка бардом)
rarity_key: varies
description: |-
  Инструмент бардов это прекрасный образец музыкального инструмента, во всём превосходящий обычные аналоги. Есть семь разновидностей таких инструментов, каждый назван в честь одной из легендарных коллегий бардов. В приведённом списке указаны заклинания, общие для всех инструментов, а также заклинания, специфичные для каждого инструмента, а также редкость этих инструментов. Существо, пытающееся играть на инструменте, не будучи настроенным на него, должно преуспеть в спасброске Мудрости Сл 15, иначе получит урон психической энергией 2к4.

  Вы можете действием сыграть на инструменте и наложить одно из его заклинаний. После того как инструмент использован для наложения заклинания, он не может повторно накладывать это заклинание до следующего рассвета. Заклинания используют вашу базовую характеристику и Сл спасбросков от ваших заклинаний.

  Вы можете играть на инструменте при наложении заклинания, которое делает цели очарованными при провале спасброска, тем самым давая целям помеху на этот спасбросок. Этот эффект применяется только если заклинание имеет соматический или материальный компонент.

  | Инструмент | Редкость | Заклинания |
  | Все | - | Защита от зла и добра [protection from evil and good]**,**левитация [levitate]**,**невидимость [invisibility]**,**полёт [fly] плюс заклинания, перечисленные для конкретного инструмента |
  | Арфа Анструт | Очень редкая | Власть над погодой [control weather]**,**лечение ран [cure wounds] (5-го уровня)**,**терновая стена [wall of thorns] |
  | Лютня Досс | Необычная | Дружба с животными [animal friendship]**,**защита от энергии [protection from energy] (только от огня)**,**защита от яда [protection from poison] |
  | Мандолина Канаит | Редкая | Защита от энергии [protection from energy] (только от электричества)**,**лечение ран [cure wounds] (3-го уровня)**,**рассеивание магии [dispel magic] |
  | Лира Кли | Редкая | Изменение формы камня [stone shape]**,**огненная стена [wall of fire]**,**стена ветров [wind wall] |
  | Арфа Оллава | Легендарная | Власть над погодой [control weather]**,**смятение [confusion]**,**огненная буря [fire storm] |
  | Бандура Фоклучан | Необычная | Дубинка [shillelagh]**,**огонь фей [faerie fire]**,**опутывание [entangle]**,**разговор с животными [speak with animals] |
  | Цитра Мак-Фуирми | Необычная | Дубовая кора [barkskin]**,**лечение ран [cure wounds]**,**туманное облако [fog cloud] |
