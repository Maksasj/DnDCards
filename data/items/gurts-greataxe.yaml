description: |-
  В Год Ледяного Топора (123 ЛД), лорд ледяных великанов [frost giant] Гурт пал от руки Утгара Гардольфссона лидера народов, которые позже станут варварами Утгардта в битве, которая знаменовала возвышение людей над великанами в Долине Дессарин. Секира Гурта была захоронен в Кургане Моргура пока её не откопали и не принесли в Глубоководье. После того, как она пролежала в хранилище города несколько десятков лет, секира была отдана Харшнагу, путешественнику ледяному великану, в благодарность за службу Глубоководью. Утгардтские варвары узнают это оружие, как только увидят его, и нападают на всякого гиганта, который держит его.

  Вы получаете бонус +1 к броскам атак и урона, совершённым этим магическим оружием. Оно подходит по размерам великану, весит 325 фунтов и наносит рубящий урон 3к12 при попадании, плюс дополнительный рубящий урон 2к12, если цель атаки человек.

  Секира излучает свет как факел, когда температура вокруг падает ниже отметки в 0°F. В таких условиях этот свет погасить никак нельзя.

  Действием, вы можете наложить версию заклинания раскалённый металл [heat metal] (Сл спасброска 13), которая наносит урон холодом вместо урона огнём. Как только вы воспользуетесь этим свойством, вы не можете им более воспользоваться до наступления рассвета.
