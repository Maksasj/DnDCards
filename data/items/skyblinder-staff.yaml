description: |-
  Вы получаете бонус +1 к броскам атаки и урона, совершённым этим магическим посохом. Пока вы его держите, вы получаете бонус +1 к броскам атаки заклинанием.

  Если летающее существо, которое вы видите в пределах 30 футов от вас, совершает бросок атаки против вас, вы можете использовать свою реакцию, чтобы поднять посох в воздух и заставить его вспыхнуть светом. Атакующий получает помеху на бросок атаки, и он должен преуспеть в спасброске Телосложения Сл 15, иначе станет ослеплённымдо начала своего следующего хода.
