description: На одной чаше весов изображены символы небожителей, на другой-исчадий. Вы можете использовать весы, чтобы наложить обнаружение зла и добра [detect evil and good] как ритуал. Для этого необходимо поместить весы на твердую поверхность, а затем окропить чаши святой водой или поместить в каждую чашу прозрачный драгоценный камень стоимостью 100 зм. Весы остаются неподвижны, если они ничего не обнаруживают, наклоняется в одну или другую сторону для добра (освященного) или зла (оскверненного) и слегка колеблется, если они обнаруживают существо, описанное в заклинании, но не доброе и не злое. Прикоснувшись к весам после ритуала, вы мгновенно узнаете любую информацию, которую обычно может даровать заклинание, после чего эффект заканчивается.
