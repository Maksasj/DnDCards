description: |-
  Эта искусно вырезанная трубка пускает пузыри без запаха вместо дыма при использовании. У трубки 3 заряда, и она восстанавливает все потраченные заряды ежедневно на рассвете. Пока вы держите трубку, вы можете расходовать заряды, чтобы получить доступ к следующим свойствам:

  Вы можете действием наложить заклинание туманное облако [fog cloud] (1 заряд). Вы можете бонусным действием сотворить заклинание туманный шаг [misty step] (2 заряда). Вы можете действием призвать парового мефита [steam mephit] (3 заряда). Мефит дружелюбен к вам, подчиняется вашим устным командам и действует в свой ход в порядке инициативы. Он исчезает в безвредном облачке пара через 1 минуту или если заканчивает свой ход на расстоянии более 60 футов от трубки.
