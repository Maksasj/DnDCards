description: |-
  Сфера профессора [professor orb], принадлежащая Веллинн Харпелл и украденная Нассом Лантомиром, именует себя Профессором Скантом. Он законно-добрый, и обладает Мудростью 11 и Харизмой 9. Он говорит и читает на Общем, Драконьем, Эльфийском и Лороссском (мёртвый язык империи Нетерила). Профессор Скант-болтун и считает, что все гуманоиды-тупицы. Когда речь заходит о его областях знаний, его голос непреднамеренно принимает покровительственный тон. Он имеет следующие четыре области знаний:

  - История Нетерила (см. «Судьба Нетерила» )
  - Вампиризм и черты вампиров
  - Ритуалы, связанные с изготовлением, розливом и питьем Эльверкисста (редкого эльфийского ликера, рубинового цвета, дистиллированного из солнечного света и редких летних фруктов)
  - Тараск [tarrasque] (см. Бестиарий)

  **Судьба Нетерила**Империя Нетерила возникла более пяти тысяч лет назад. Те, кто следуют календарю Летоисчисления Долин, поместили бы дату рождения Нетерила в - 3859 ЛД. История Нетерила началось с обнаружения «Свитков Нетера». Эти длинные золотые свитки обучили арканистов Нетерила владеть магией за пределами их самых смелых фантазий. Потребовались столетия, но Нетерильцы, овладевшие силой «Свитков Нетера», стали правящим классом, живущим в больших летающих городах или скрывающимся в отдаленных подземных логовах. Несмотря на свою огромную мощь, Нетерильцы столкнулись с растущей угрозой. Под сердцем их империи жили магические аберрации, называемые фаэриммы. Используя свою способность высасывать магию, фаэриммы начали распутывать Плетение, без которого Нетерил превратился бы в руины. В 339 ЛД, через четыре года после падения Итрина, самый могущественный арканист империи, Карсус, попытался нейтрализовать угрозу фаэриммов, наложив заклинание беспрецедентной силы, которое позволило бы ему заменить Мистрил на роли Бога магии, даруя ему абсолютный контроль над Плетением. Мистрил помешала Карсусу в ключевой момент во время произнесения заклинания, и свершила подвиг, который только она и могла совершить, пожертвовав собой и разорвав Плетение. Карсус был мгновенно убит, и в течение некоторого времени после этого большинство существ в мире либо не имели магии, либо просто не могли её контролировать. Без могущественной магии, способной удержать их в воздухе, оставшиеся летающие города Нетерила рухнули на землю, и многие уцелевшие арканисты сошли с ума. Как только магия вновь вернулась, Нетерильские арканисты больше не могли использовать свои самые могущественные заклинания, как это было раньше, заставляя их прибегать к традиционной магии. Спустя четыреста лет после того, как Карсус наложил свое заклинание, Нетерильской империи больше не стало, её раздавили враги и погубила собственная гордыня. В Забытых Королевствах Нетерил окончательно утерянная империя, она поднялась до небывалых высот, но в конце концов рухнула. Если вы когданибудь играли в научно-фантастическую игру, которая включает в себя концепцию утраченной, высокоразвитой цивилизации, то вы можете представить, каким должен был быть древний Нетерил. Из этой империи появились многие страшные монстры, диковинные подземелья и удивительные магические предметы, найденные сегодня.
