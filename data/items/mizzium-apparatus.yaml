  | 1 | Размытый образ [blur] |
  | 2 | Порыв ветра [gust of wind] |
  | 3 | Раскаленный металл [heat metal] |
  | 4 | Мельфова кислотная стрела [Melf’s acid arrow] |
  | 5 | Палящий луч [scorching ray] |
  | 6 | Дребезги [shatter] |

