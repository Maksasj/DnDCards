description: |-
  Одна щепотка пыли пикси может заменить любой компонент для любого заклинания школы Очарования 3-го уровня и ниже. У пыли есть и другие магические свойства.

  Если щепотку пыли пикси распылить на существо, то надо кинуть к100 и определить результат по таблице Пыль Пикси.

  Пыль пикси

  | **к100** | **Волшебный эффект** |
  | 01-70 | Обсыпанное пылью существо получает скорость полёта 60 на 10 минут. |
  | 71-80 | Обсыпанное пылью существо должно совершить спасбросок Телосложения Сл 11 или упасть без сознания на 1 минуту. Существо просыпается, если получает урон, или если его привести в себя, тряся или выдав пару оплеух, на что требуется потратить действие. |
  | 81-90 | Обсыпанное пылью существо должно преуспеть в спасброске Мудрости Сл 11 или попасть под действие заклинания смятение [confusion]. |
  | 91-00 | Обсыпанное пылью существо становится невидимым на час. Вся экипировка существа также становится невидимой и остается таковой пока она при существе. Эффект заканчивается, если существо атакует, наносит урон или накладывает заклинание. |
