description: |-
  Этот мерцающий кристалл содержит сущность Внешних Планов. Действием вы можете прикрепить осколок к Крошечному предмету (например, оружию или ювелирному изделию) или отсоединить его. Он отпадает самостоятельно, если ваша настройка на него заканчивается. Вы можете использовать осколок в качестве заклинательной фокусировки, пока несёте или носите его.

  Бросьте к4 и сверьтесь с таблицей «Осколки внешней сущности», чтобы определить сущность и свойства осколка. Пока вы несёте или носите осколок, и используете метамагию на заклинание, вы можете использовать свойство осколка из таблицы.

  Осколки внешней сущности

  | **к4** | **Свойство** |
  | 1 | **Законный**. Вы можете окончить одно из следующих состояний, влияющих на вас или на одно существо, которое вы можете видеть в пределах 30 футов: испуг, глухота, ослепление, отравление, очарование или ошеломление. |
  | 2 | **Хаотичный**. Выберите одно существо, которое получает урон от заклинания. Эта цель совершает все броски атаки и проверки характеристик с помехой до начала вашего следующего хода. |
  | 3 | **Добрый**. Вы или одно существо по вашему выбору, которое вы можете видеть в пределах 30 футов, получаете 3к6 временных хитов. |
  | 4 | **Злой**. Выберите одно существо, которое получает урон от заклинания. Это существо получает дополнительные 3к6 урона некротической энергией. |
