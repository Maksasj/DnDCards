description: |-
  Эта колода карт из плотной бумаги наполнена магией Стихийного Хаоса.

  Магия колоды действует только в том случае, если карты взяты случайным образом (колода реальных игральных карт может имитировать колоду). Действием вы можете взять случайную карту из этой колоды и метнуть её, чтобы совершить дальнобойную атаку заклинанием, используя Ловкость для броска атаки. Дистанция карты 30 футов. При попадании она наносит 1к4 рубящего урона и накладывает магический эффект, определяемый её мастью, как подробно описано в таблице "Колода диких карт". Карта немедленно возвращается в колоду после того, как попадает или промахивается по цели.

  Колода диких карт

  | к4 | Масть | Эффект |
  | 1 | ♣ (Жезлы) | Карта взрывается вспышкой огня. Цель и каждое существо в пределах 5 футов от неё должны совершить спасбросок Ловкости Сл 15, иначе получит 2к8 урона огнём. |
  | 2 | ♦ (Монеты) | Карта обращается полосами молний. Цель должна совершить спасбросок Ловкости Сл 15. При провале цель становится ослеплённой до конца вашего следующего хода, и каждое существо в пределах 10 футов от цели получает 1к6 урона электричеством. |
  | 3 | ♥ (Чаши) | Карта покрывает цель толстым слоем льда. Цель получает 1к10 урона холодом и должна преуспеть в спасброске Телосложения Сл 15, иначе станет опутанной до конца вашего следующего хода. |
  | 4 | ♠ (Мечи) | Карта издает пронзительный, оглушительный взрыв. Цель и каждое существо в пределах 5 футов от неё получают 1к6 урона силовым полем и должны преуспеть в спасброске Силы Сл 15, иначе упадут ничком. |
