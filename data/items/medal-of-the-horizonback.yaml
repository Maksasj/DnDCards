description: Когда по вам попадают атакой, вы можете реакцией увеличить свой КД на 5 до начала вашего следующего хода, в том числе и против вызвавшей срабатывание атаки. Вы должны носить медаль и иметь возможность видеть существо, которое совершило атаку, чтобы использовать это свойство. Как только это свойство было использовано, его нельзя использовать снова, и медаль становится немагической.
