description: |-
  Эта раскрашенная латунная бутылка весит 1 фунт. Если вы действием вынете пробку, из бутылки вырвется густое облако дыма. В конце вашего хода дым исчезает во вспышке безвредного огня, и в свободном пространстве в пределах 30 футов от вас появляется ифрит [efreet].

  Когда бутылку открывают в первый раз, Мастер определяет, что произойдёт дальше:

  | к100 | Эффект |
  | 01-10 | Ифрит нападёт на вас. Через 5 раундов сражения ифрит исчезает, а бутылка теряет магию. |
  | 11-90 | Ифрит служит вам 1 час, выполняя все ваши команды. После этого ифрит возвращается в бутылку, которая закрывается новой пробкой. Пробку нельзя вынуть в течение 24 часов. В последующие два открытия будет происходить то же самое. Если бутылку откроют в четвёртый раз, ифрит сбежит и исчезнет, а бутылка потеряет магию. |
  | 91-00 | Ифрит может три раза наложить для вас заклинание исполнение желаний [wish]. Он исчезает после того как исполнит последнее желание или спустя 1 час, а бутылка после этого теряет магию. |
