description: |-
  Этот двенадцатигранный металлический кубик шириной 12 дюймов в поперечнике с выгравированными цифрами от 1 до 12 на его пятиугольных гранях. Внутри додекаэдра находится магический заводной механизм, который гудит и щелкает при броске.

  Действием додекаэдр можно метнуть на расстояние до 60 футов. После того как кубик останавливается прокатившись по поверхности не менее 10 футов, возникает случайный магический эффект. Если эффект требует наличия цели, но в пределах досягаемости нет ни одной подходящей цели — ничего не происходит. Накладываемые додекаэдром заклинания не требуют никаких компонентов. Бросьте к12 и сверьтесь с таблицей для определения эффекта.

  | к12 | Эффект |
  | 1-2 | Додекаэдр взрывается и уничтожается. Все существа в пределах 20 футов от додекаэдра должны совершить спасбросок Ловкости Сл 13, получая 40 (9к8) урона силовым полем при провале или половину от этого урона при успехе. |
  | 3-4 | Додекаэдр накладывает на себя заклинание свет [light]. Додекаэдр находится под эффектом заклинания до тех пор, пока кто-то не дотронется до него. |
  | 5-6 | Додекаэдр накладывает заклинание луч холода [ray of frost] (+5 к попаданию) на случайное существо, не находящееся за полным укрытием в пределах 60 футов от себя. |
  | 7-8 | Додекаэдр накладывает заклинание электрошок [shocking grasp] (+5 к попаданию) на первое дотронувшееся до него после броска существо. |
  | 9-10 | Додекаэдр накладывает на себя заклинания тьма [darkness]. Продолжительность эффекта 10 минут. |
  | 11-12 | Первое дотронувшееся до додекаэдра после броска существо на 1 час получает 1к10 временных хитов. |
