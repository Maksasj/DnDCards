description: |-
  Вы восстанавливаете хиты, когда выпиваете это зелье. Количество восстанавливаемых хитов зависит от редкости зелья, как показано в таблице «зелья лечения». Вне зависимости от силы зелья оно представляет собой красную жидкость, сверкающую при встряхивании.

  Зелья лечения

  | Зелье... | Редкость | Восстанавливаемые хиты | Цена из AL | Цена из DMG | Цена из XGE |
  | лечения | Обычное | 2к4 + 2 | 50 зм | 25-50 зм | (1к6 + 1) × 5 зм |
  | большого лечения | Необычное | 4к4 + 4 | 100 зм | 50,5-250 зм | 1к6 × 50 зм |
  | отличного лечения | Редкое | 8к4 + 8 | 500 зм | 250,5-2500 зм | 2к10 × 500 зм |
  | превосходного лечения | Очень редкое | 10к4 + 20 | 5000 зм | 2500,5-25000 зм | (1к4 + 1) × 5000 зм |
