description: |-
  Предмет состоит из железного стержня длиной в 2 фута, с поперечиной вверху и двумя загнутыми прутьями внизу.

  К поперечине привязана толстая лыковая верёвка.

  Если действием вы произнесёте командное слово якоря, верёвка волшебным образом начнёт удлиняться, покуда якорь не достигнет дна или верёвка удлинится до своего предела в 1 милю. Верёвка вновь сокращается до 4 футов, если произнести командное слово.
