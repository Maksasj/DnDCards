id: obviators-lenses
name: Линзы риск-менеджера
name_en: Obviator’s Lenses
source_url: https://dnd.su/items/2158-obviators-lenses/
sources:
  - code: AI
    book: Acquisition Incorporated
type_key: magic
attunement: false
type: Чудесный предмет
rarity: редкость варьируется (2-й ранг - необычный, 4-й ранг - редкий)
rarity_key: varies
description: |-
  При получении 2-го ранга вы получаете возможность использовать необычный магический предмет в виде очков, подзорной трубы, монокля или любого другого устройства с одной или двумя линзами. Когда вы смотрите через *линзы риск-менеджера*, вы можете использовать Бонусное действие, чтобы заставить их функционировать как очки детального зрения [eyes of minute seeng] или очки орлиного зрения [eyes of eagle]. Как только вы делаете этот выбор, он не может быть изменен до следующего рассвета.

  **Улучшенные линзы.** При получении 4-го ранга ваши линзы риск-менеджера получают дополнительную силу и становятся редким магическим предметом. Линзы теперь функционируют и как очки детального зрения [eyes of minute seeing] и как очки орлиного зрения [eyes of the eagle].

  Кроме того, вы можете сконцентрировать силу линз, чтобы повысить точность в бою, получая преимущество на бросок атаки оружием (никаких действий не требуется). Если эта атака попадёт то, бросьте дополнительный куб урона оружия. Это свойство линз не может быть использовано повторно до следующего рассвета.
