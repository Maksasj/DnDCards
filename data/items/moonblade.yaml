description: |-
  Из всех магических предметов, созданных эльфами, больше всех ценится и яростнее всех охраняется *Лунный клинок*. В древние времена практически у каждого эльфийского благородного дома было по одному такому клинку. По прошествии столетий часть клинков затерялась и магия их была утеряна вместе с родословными. Другая часть сгинула вместе с владельцами, отправившимися на выполнение заданий. Таким образом, осталось лишь несколько экземпляров этого оружия.

  *Лунный клинок* переходит от родителя к ребёнку. Он остаётся связанным с ним всю жизнь. Если владелец умирает, меч может достаться другому наследнику. Если достойных наследников нет, меч впадает в спячку. Он действует как обычный длинный меч, пока его не найдёт достойная душа, способная пробудить его силу.

  *Лунный клинок* служит только одному хозяину одновременно. Процесс настройки требует особого ритуала в тронном зале эльфийского правителя или храме эльфийских богов.

  *Лунный клинок* не станет служить тому, кого он посчитает трусливым, непостоянным, порочным или не желающим хранить и защищать эльфов. Если клинок вас отвергает, вы 24 часа совершаете с помехой проверки характеристик, броски атаки и спасброски. Если клинок вас принимает, вы настраиваетесь на него, а на клинке появляется новая руна. Вы остаётесь настроенным на это оружие пока не умрёте или оно не уничтожится.

  У *Лунного клинка* на лезвии есть по одной руне за каждого владельца, которому он служил (обычно их 1к6 + 1). Первая руна всегда предоставляет бонус +1 к броскам атаки и урона, совершённым этим магическим оружием. За каждую последующую руну клинок получает дополнительное свойство. Мастер может сам выбрать каждое свойство, а может определить их случайным образом.

  Свойство Лунного клинка

  | к100 | Свойство |
  | 01-40 | Увеличьте бонус к броскам атаки и урона на 1, до максимума +3. Перебросьте, если у Лунного клинка бонус уже +3. |
  | 41-80 | Лунный клинок получает случайным образом определённое малое свойство. |
  | 81-82 | Лунный клинок получает свойство «фехтовальное». |
  | 83-84 | Лунный клинок получает свойство «метательное» (дистанция 20/60 футов). |
  | 85-86 | Лунный клинок функционирует как защитник [defender]. |
  | 87-90 | Лунный клинок совершает критическое попадание при выпадении «19» или «20». |
  | 91-92 | Если вы попадаете атакой, используя *Лунный клинок*, вы дополнительно наносите 1к6 рубящего урона. |
  | 93-94 | Если вы попадаете *Лунным клинком* по существу определённого вида (такому как дракон, исчадие или нежить), цель получает дополнительный урон 1к6 одного из следующих видов: звук, кислота, огонь, холод или электричество. |
  | 95-96 | Вы можете бонусным действием заставить *Лунный клинок* ярко вспыхнуть. Все существа, видящие вас и находящиеся в пределах 30 футов от вас, должны преуспеть в спасброске Телосложения Сл 15, иначе они станут ослеплёнными на 1 минуту. Существо может повторять спасбросок в конце каждого своего хода, оканчивая эффект на себе при успехе. Это свойство нельзя повторно использовать, пока вы не совершите короткий отдых, будучи настроенным на это оружие. |
  | 97-98 | Лунный клинок действует как кольцо хранения заклинаний [ring of spell storing]. |
  | 99 | Вы можете действием призвать эльфийскую тень, при условии, что у вас сейчас нет в услужении такой тени. Эльфийская тень появляется в свободном пространстве в пределах 120 футов от вас. Она использует статистику тени [shadow] из Бестиария, за исключением того, что она нейтральна, обладает иммунитетом к эффектам, изгоняющим нежить, и не создаёт новых теней. Это существо контролируете вы, и вы определяете его действия и перемещения. Оно существует, пока его хиты не опустятся до 0 или вы не отпустите его действием. |
  | 00 | *Лунный клинок* действует как меч головоруб [vorpal sword]. |

  ***Разум.*** *Лунный клинок* — разумное нейтральное-доброе оружие с Интеллектом 12, Мудростью 10 и Харизмой 12. Он обладает слухом и тёмным зрением в пределах 120 футов Это оружие общается с владельцем, передавая эмоции, и посылая в руку владельца покалывающее ощущение, когда хочет передать что-то, что оно почувствовало. Клинок может общаться менее завуалированно, через видения и грёзы, когда владелец спит или находится в трансе.

  ***Индивидуальность.*** Все *Лунные клинки* стремятся продвигать идеалы эльфов: храбрость, преданность, красоту, музыку и жизнь во всех её проявлениях. Это оружие привязано к роду, которому должно служить. Когда оно связывается с владельцем, разделяющим его идеалы, его преданность будет абсолютной.

  Если у *Лунного клинка* и есть недостаток, то это чрезмерная уверенность. Если он выбрал себе владельца, то будет считать, что только эта личность достойна его носить, даже если владелец позже предаст эльфийские идеалы.
