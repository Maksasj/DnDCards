description: Если вы размещаете объект, весящий не более 1 фунта (такой как осколок кристалла, яйцо или камень) выше навершия посоха, пока держите его, объект поднимается на дюйм от навершия посоха и остаётся там до тех пор, пока не будет перемещён или пока посох находится у вас. Посох может одновременно удерживать до трёх таких объектов плавающими над его навершием. Пока вы держите посох, вы можете заставить один или несколько объектов медленно вращаться вокруг своей оси или вокруг друг друга.
