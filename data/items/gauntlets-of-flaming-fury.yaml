description: Пока на вас надеты обе эти стальные перчатки, любое немагическое оружие, которое вы держите в одной перчатке, считается магическим оружием. Бонусным действием вы можете использовать перчатки, чтобы заставить магическое пламя окутать одно или два рукопашных оружия в ваших руках. Каждое пылающее оружие дополнительно наносит 1к6 урона огнём при попадании. Пламя горит до тех пор, пока вы не уберёте или не выпустите оружие. Как только вы используете это свойство, оно не может быть использовано повторно до следующего рассвета.
