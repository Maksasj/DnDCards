description: |-
  Этот потрескивающий кристалл содержит в себе эссенцию стихийного плана. Действием вы можете прикрепить осколок к Крошечному предмету (например, оружию или ювелирному изделию) или отсоединить его. Он отпадает самостоятельно, если ваша настройка на него заканчивается. Вы можете использовать осколок в качестве заклинательной фокусировки, пока несёте или носите его.

  Бросьте к4 и обратитесь к таблице «Осколки эссенции стихийных планов», чтобы определить эссенцию и свойства осколка. Пока вы несёте или носите осколок, использовав метамагию на заклинание, вы можете использовать свойство осколка из таблицы.

  Осколки эссенции стихийных планов

  | **к4** | **Свойство** |
  | 1 | **Воздух.** Вы можете мгновенно пролететь вплоть до 60 футов, не провоцируя атаки. |
  | 2 | **Земля.** Вы получаете сопротивление виду урона по вашему выбору до начала вашего следующего хода. |
  | 3 | **Огонь.** Одна из целей заклинания, которую вы можете видеть, загорается. Горящая цель получает 2к10 урона огнём в начале своего следующего хода, после чего пламя гаснет. |
  | 4 | **Вода.** Вы создаёте волну воды, которая вырывается из вас в радиусе 10 футов. Каждое существо по вашему выбору, которое вы можете видеть в этой области, получает 2к6 урона холодом и должно преуспеть в спасброске Силы против Сл ваших заклинаний, иначе будет отброшено на 10 футов от вас и сбито с ног. |
