description: Эта длинная, тонкая деревянная трубка украшена чашей из гладкого речного камня. Когда трубка зажжена, дым, выдыхаемый из неё, не рассеивается, а задерживается вокруг курящего. Через 10 минут дым образует движущиеся фигуры, которые воспроизводят самые впечатляющие и героические достижения владельца в течение 5 минут. Когда это реалистичное представление заканчивается, дым рассеивается. Трубку нельзя использовать таким образом до следующего рассвета.
