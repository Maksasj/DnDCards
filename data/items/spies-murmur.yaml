description: Это устройство, изготовленное из тёмного металла, носится изогнутым вокруг уха. Если вы знаете существо, носящее другой *шпионский шёпот*, и это существо находится в пределах 1 мили от вас, то вы можете телепатически общаться друг с другом. Бонусным действием вы можете позволить этому существу слышать всё, что вы слышите в течение 1 часа. Бонусным действием вы можете закончить этот эффект раньше, и он так же заканчивается, если вы окажитесь недееспособны.
