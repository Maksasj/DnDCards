description: |-
  Эта маленькая капсула сделана из пчелиного воска, смешанного с песком и различными заколдованными водорослями. Существо, которое употребляет капсулу давления, игнорирует эффекты плавания на глубине более 100 футов (см. плавание под водой).

  У этого предмета нет прописанного времени действия. В качестве ориентиров можете использовать следующее: ведущий дизайнер D&D 5e говорил, что в следующем издании книги время действия будет около 8 часов адаптация приключения для Adventurers League устанавливает время действия капсулы в играх лиги в 1 час
