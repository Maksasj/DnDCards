subclasses:
  - id: cleric.domen-buri
    name: Домен бури
    sources: *a1
    features:
      - id: cleric.domen-buri.bonusnoe-vladenie
        name: Бонусное владение
        level: 1
        subtitle: 1-й уровень, умение домена бури
        description: Вы осваиваете владение воинским оружием и тяжёлыми доспехами.
      - id: cleric.domen-buri.gnev-buri
        name: Гнев бури
        level: 1
        subtitle: 1-й уровень, умение домена бури
        description: Вы можете громогласно покарать атакующих. Если существо в пределах 5 футов от вас, которое вы можете видеть, успешно попадает по вам атакой, вы можете реакцией заставить существо совершить спасбросок Ловкости. Существо получает 2к8 урона звуком или электричеством (по вашему выбору), если провалит спасбросок, и половину этого урона если преуспеет. Вы можете использовать это умение количество раз, равное вашему модификатору Мудрости (минимум 1 раз). Вы восстанавливаете все потраченные применения, когда заканчиваете продолжительный отдых.
      - id: cleric.domen-buri.bozhestvennyj-kanal-razrushitelnyj-gnev
        name: "Божественный канал: разрушительный гнев"
        level: 2
        subtitle: 2-й уровень, умение домена бури
        description: |-
          Вы можете использовать «Божественный канал», чтобы овладеть могуществом бури с необузданной свирепостью.

          Когда вы совершаете бросок урона звуком или электричеством, вы можете использовать «Божественный канал», чтобы нанести максимальный урон вместо броска.
      - id: cleric.domen-buri.udar-groma
        name: Удар грома
        level: 6
        subtitle: 6-й уровень, умение домена бури
        description: Когда вы наносите урон электричеством существу с размером Большое или меньше, вы также можете оттолкнуть его на 10 футов от себя.
      - id: cleric.domen-buri.bozhestvennyj-udar
        name: Божественный удар
        level: 8
        subtitle: 8-й уровень, умение домена бури
        description: Вы получаете способность наполнять удары своего оружия божественной энергией. Один раз в каждый свой ход, когда вы попадаете по существу атакой оружием, вы можете причинить цели дополнительный урон звуком 1к8. Когда вы достигаете 14-го уровня, дополнительный урон возрастает до 2к8.
      - id: cleric.domen-buri.rozhdennyj-burej
        name: Рождённый бурей
        level: 17
        subtitle: 17-й уровень, умение домена бури
        description: У вас появляется скорость полёта, равная вашей текущей наземной скорости ходьбы, когда вы не под землёй и не в помещении.
  - id: cleric.domen-vojny
    name: Домен войны
    sources: *a1
    features:
      - id: cleric.domen-vojny.bonusnoe-vladenie
        name: Бонусное владение
        level: 1
        subtitle: 1-й уровень, умение домена войны
        description: Вы получаете владение воинским оружием и тяжёлыми доспехами.
      - id: cleric.domen-vojny.boevoj-svyaschennik
        name: Боевой священник
        level: 1
        subtitle: 1-й уровень, умение домена войны
        description: Ваш бог наделяет вас воодушевлением, когда вы вступаете в битву. Когда вы используете действие Атака, вы можете совершить одну атаку оружием бонусным действием. Вы можете использовать это умение количество раз, равное вашему модификатору Мудрости (минимум 1 раз). Вы восстанавливаете все потраченные использования, когда завершаете продолжительный отдых.
      - id: cleric.domen-vojny.bozhestvennyj-kanal-napravlennyj-udar
        name: "Божественный канал: направленный удар"
        level: 2
        subtitle: 2-й уровень, умение домена войны
        description: Вы можете использовать «Божественный канал», чтобы нанести удар со сверхъестественной точностью. Когда вы совершаете бросок атаки, вы можете использовать «Божественный канал», чтобы получить бонус +10 к броску. Вы можете решить, применять ли это умение, после того как увидите результат броска, но до того как Мастер скажет, попала атака или промахнулась.
      - id: cleric.domen-vojny.bozhestvennyj-kanal-blagoslovenie-boga-vojny
        name: "Божественный канал: благословение бога войны"
        level: 6
        subtitle: 6-й уровень, умение домена войны
        description: Если существо в пределах 30 футов от вас совершает бросок атаки, вы можете реакцией предоставить этому существу бонус +10 к броску, использовав «Божественный канал». Вы можете решить, применять ли это умение, после того как увидели результат броска, но до того как Мастер скажет, попала атака или промахнулась.
      - id: cleric.domen-vojny.bozhestvennyj-udar
        name: Божественный удар
        level: 8
        subtitle: 8-й уровень, умение домена войны
        description: Вы получаете способность наполнять удары своего оружия божественной энергией. Один раз в каждый свой ход, когда вы попадаете по существу атакой оружием, вы можете причинить цели дополнительный урон 1к8 того же вида, что и у оружия. Когда вы достигаете 14 уровня, дополнительный урон увеличивается до 2к8.
      - id: cleric.domen-vojny.voploschenie-bitvy
        name: Воплощение битвы
        level: 17
        subtitle: 17-й уровень, умение домена войны
        description: Вы получаете сопротивление дробящему, колющему и рубящему урону от немагических атак.
  - id: cleric.domen-zhizni
    name: Домен жизни
    sources: *a1
    features:
      - id: cleric.domen-zhizni.bonusnoe-vladenie
        name: Бонусное владение
        level: 1
        subtitle: 1-й уровень, умение домена жизни
        description: Вы получаете владение тяжёлыми доспехами.
      - id: cleric.domen-zhizni.pobornik-zhizni
        name: Поборник жизни
        level: 1
        subtitle: 1-й уровень, умение домена жизни
        description: Ваши лечащие заклинания становятся более эффективными. Каждый раз, когда вы используете заклинание? 1-го уровня или выше, восстанавливающее хиты существу, это существо восстанавливает дополнительно число хитов, равное 2 + уровень заклинания.
      - id: cleric.domen-zhizni.bozhestvennyj-kanal-sohranenie-zhizni
        name: "Божественный канал: сохранение жизни"
        level: 2
        subtitle: 2-й уровень, умение домена жизни
        description: Вы можете использовать «Божественный канал», чтобы лечить тяжёлые ранения. Вы действием демонстрируете свой священный символ и призываете целительную энергию, которая может восстановить число хитов, равное вашему уровню жреца, умноженному на пять. Выберите любых существ в пределах 30 футов от себя и распределите эти хиты между ними. Это умение не может восстановить существу хиты выше половины от его максимума. Вы не можете использовать это умение на Нежити и Конструктах.
      - id: cleric.domen-zhizni.blagoslovennyj-celitel
        name: Благословенный целитель
        level: 6
        subtitle: 6-й уровень, умение домена жизни
        description: Заклинания лечения, которое вы накладываете на других, также лечат и вас. Когда вы накладываете заклинание 1-го уровня или выше, которое восстанавливает хиты другому существу, вы восстанавливаете себе число хитов, равное 2 + уровень заклинания.
      - id: cleric.domen-zhizni.bozhestvennyj-udar
        name: Божественный удар
        level: 8
        subtitle: 8-й уровень, умение домена жизни
        description: Вы получаете способность наполнять удары своего оружия божественной энергией. Один раз в каждый свой ход, когда вы попадаете по существу атакой оружием, вы можете причинить цели дополнительный урон излучением 1к8. Когда вы достигаете 14-го уровня, дополнительный урон возрастает до 2к8.
      - id: cleric.domen-zhizni.vysshee-iscelenie
        name: Высшее исцеление
        level: 17
        subtitle: 17-й уровень, умение домена жизни
        description: Если вы должны бросить одну или несколько костей, чтобы восстановить заклинанием хиты, вы для каждой кости используете максимальное значение. Например, вместо восстановления существу 2к6 хитов, вы восстанавливаете 12.
  - id: cleric.domen-znanij
    name: Домен знаний
    sources: *a1
    features:
      - id: cleric.domen-znanij.blagoslovenie-znanij
        name: Благословение знаний
        level: 1
        subtitle: 1-й уровень, умение домена знаний
        description: |-
          Вы можете выучить два языка на свой выбор. Вы также получаете владение двумя навыками из следующего списка: История, Магия, Природа, Религия.

          Ваш бонус мастерства удваивается для всех проверок характеристик при использовании выбранных навыков.
      - id: cleric.domen-znanij.bozhestvennyj-kanal-znaniya-vekov
        name: "Божественный канал: знания веков"
        level: 2
        subtitle: 2-й уровень, умение домена знаний
        description: Вы можете использовать «Божественный канал», чтобы получить доступ к источнику знаний. Вы действием выбираете навык или инструмент. На 10 минут вы осваиваете владение выбранным навыком или инструментом.
      - id: cleric.domen-znanij.bozhestvennyj-kanal-chtenie-myslej
        name: "Божественный канал: чтение мыслей"
        level: 6
        subtitle: 6-й уровень, умение домена знаний
        description: |-
          Вы можете использовать свой «Божественный канал», чтобы читать мысли существ. Затем вы можете использовать доступ к разуму существа, чтобы командовать им.

          Выберите действием одно существо, которое вы можете видеть, находящееся в пределах 60 футов от вас. Это существо должно совершить спасбросок Мудрости. Если существо преуспело, вы не можете использовать это умение на нём, пока не завершите продолжительный отдых. Если существо проваливает спасбросок, вы можете прочитать его поверхностные мысли (то, что у него на уме, его текущие эмоции и то, о чём оно активно думает), когда оно находится в пределах 60 футов от вас. Этот эффект длится в течение 1 минуты.

          В течение этого времени вы можете действием окончить этот эффект, накладывая на существо заклинание внушение [suggestion], не тратя ячейку заклинания. Цель автоматически проваливает спасбросок от этого заклинания.
      - id: cleric.domen-znanij.moguschestvennoe-koldovstvo
        name: Могущественное колдовство
        level: 8
        subtitle: 8-й уровень, умение домена знаний
        description: Вы добавляете модификатор Мудрости к урону, который причиняете заговорами жреца.
      - id: cleric.domen-znanij.videniya-proshlogo
        name: Видения прошлого
        level: 17
        subtitle: 17-й уровень, умение домена знаний
        description: |-
          Вы можете вызывать видения прошлого, связанные с предметом, который вы держите, или находящимся вокруг вас окружением. Вы проводите не менее 1 минуты медитируя и молясь, а затем получаете призрачные туманные видения последних событий. Вы можете медитировать таким образом количество минут, равное вашему значению Мудрости, и должны поддерживать концентрацию в течение этого времени, как если бы вы накладывали заклинание.

          После того как вы использовали это умение, вы не можете его использовать повторно, пока не окончите короткий или продолжительный отдых.

          ***Чтение предмета.*** Удерживая предмет во время медитации, вы получаете видение предыдущего владельца этого предмета. После медитации в течение 1 минуты вы узнаёте, как владелец приобрёл и потерял предмет, а также самое последнее значимое событие с участием предмета и его владельца. Если предмет принадлежал другому существу в недавнем прошлом (в пределах количества дней, равного значению вашей Мудрости), вы можете потратить 1 дополнительную минуту на каждого владельца, чтобы узнать ту же информацию о нём.

          ***Чтение окрестностей.*** Пока вы медитируете, вы наблюдаете видения последних событий, произошедших в непосредственной близости (комната, улица, туннель, поляна и тому подобное в пределах куба с длиной ребра 50 футов), на протяжении количества прошедших дней, равного значению вашей Мудрости. За каждую минуту медитации вы узнаёте об одном значимом событии, начиная с самого последнего. Значимые события обычно связаны с сильными эмоциями, например, битвами и предательствами, свадьбами и убийствами, родами и похоронами. Однако они могут также включать в себя более обыденные события, которые, тем не менее, важны в текущей ситуации.
  - id: cleric.domen-obmana
    name: Домен обмана
    sources: *a1
    features:
      - id: cleric.domen-obmana.blagoslovenie-obmanschika
        name: Благословение обманщика
        level: 1
        subtitle: 1-й уровень, умение домена обмана
        description: Вы можете действием коснуться согласного существа, отличного от вас, чтобы позволить ему совершать с преимуществом проверки Ловкости (Скрытность). Это благословение длится 1 час, или пока вы не используете это умение снова.
      - id: cleric.domen-obmana.bozhestvennyj-kanal-dvulichnost
        name: "Божественный канал: двуличность"
        level: 2
        subtitle: 2-й уровень, умение домена обмана
        description: |-
          Вы можете использовать «Божественный канал», чтобы создать иллюзорную копию себя.

          Вы действием создаёте идеальную иллюзию себя, которая существует в течение 1 минуты, или пока вы не потеряете концентрацию (как если бы вы концентрировались на заклинании). Иллюзия появляется в свободном пространстве, которое вы можете видеть в пределах 30 футов от себя. Бонусным действием в свой ход вы можете переместить иллюзию на расстояние до 30 футов в пространство, которое вы можете видеть, но иллюзия должна оставаться в пределах 120 футов от вас. На протяжении действия умения вы можете накладывать заклинания, как если бы вы находились в пространстве иллюзии, но вы должны использовать собственные чувства. Кроме того, когда и вы и ваша иллюзия находитесь в пределах 5 футов от существа, которое может видеть иллюзию, вы совершаете броски атаки по этому существу с преимуществом, так как иллюзия отвлекает его.
      - id: cleric.domen-obmana.bozhestvennyj-kanal-plasch-tenej
        name: "Божественный канал: плащ теней"
        level: 6
        subtitle: 6-й уровень, умение домена обмана
        description: Вы можете использовать «Божественный канал», чтобы исчезать. Вы действием становитесь невидимым до конца своего следующего хода. Вы становитесь видимым, если атакуете или накладываете заклинание.
      - id: cleric.domen-obmana.bozhestvennyj-udar
        name: Божественный удар
        level: 8
        subtitle: 8-й уровень, умение домена обмана
        description: Вы получаете способность наполнять удары своего оружия ядом — это дар вашего божества. Один раз в каждый свой ход, когда вы попадаете по существу атакой оружием, вы можете причинить цели дополнительный урон ядом 1к8. Когда вы достигаете 14-го уровня, дополнительный урон возрастает до 2к8.
      - id: cleric.domen-obmana.uluchshennaya-dvulichnost
        name: Улучшенная двуличность
        level: 17
        subtitle: 17-й уровень, умение домена обмана
        description: Вы можете создать до четырёх копий себя, вместо одной, когда вы используете «Двуличность». Бонусным действием в свой ход вы можете переместить любое количество копий на 30 футов, максимальная дистанция от вас не должна превышать 120 футов.
  - id: cleric.domen-prirody
    name: Домен природы
    sources: *a1
    features:
      - id: cleric.domen-prirody.poslushnik-prirody
        name: Послушник природы
        level: 1
        subtitle: 1-й уровень, умение домена природы
        description: "Вы изучаете один заговор друида на свой выбор. Этот заговор считается заговором жреца для вас, но он не учитывается в общем количестве известных вам заговоров жреца. Вы также получаете владение одним из следующих навыков: Выживание, Природа, Уход за животными."
      - id: cleric.domen-prirody.bonusnoe-vladenie
        name: Бонусное владение
        level: 1
        subtitle: 1-й уровень, умение домена природы
        description: Вы получаете владение тяжёлыми доспехами.
      - id: cleric.domen-prirody.bozhestvennyj-kanal-ocharovanie-zhivotnyh-i-rastenij
        name: "Божественный канал: очарование животных и растений"
        level: 2
        subtitle: 2-й уровень, умение домена природы
        description: |-
          Вы можете использовать «Божественный канал», чтобы очаровать животных и растения.

          Вы действием демонстрируете свой священный символ и называете имя своего божества. Все Звери и Растения, которые могут видеть вас, и находятся в пределах 30 футов от вас, должны совершить спасбросок Мудрости. Если существо провалит спасбросок, оно становится очарованным вами на 1 минуту, или пока не получит урон. Пока существо очаровано, оно дружелюбно к вам и другим существам, которых вы укажете.
      - id: cleric.domen-prirody.sderzhivanie-stihij
        name: Сдерживание стихий
        level: 6
        subtitle: 6-й уровень, умение домена природы
        description: Когда вы или существо в пределах 30 футов от вас получает урон звуком, кислотой, огнём, холодом или электричеством, вы можете реакцией предоставить существу сопротивление этому урону.
      - id: cleric.domen-prirody.bozhestvennyj-udar
        name: Божественный удар
        level: 8
        subtitle: 8-й уровень, умение домена природы
        description: Вы получаете способность наполнять удары своего оружия божественной энергией. Один раз в каждый свой ход, когда вы попадаете по существу атакой оружием, вы можете причинить цели дополнительный урон огнём, холодом или электричеством (на ваш выбор) 1к8. Когда вы достигаете 14-го уровня, дополнительный урон возрастает до 2к8.
      - id: cleric.domen-prirody.master-prirody
        name: Мастер природы
        level: 17
        subtitle: 17-й уровень, умение домена природы
        description: Вы получаете способность командовать животными и растительными существами. Пока существа очарованы вашим умением «Очарование животных и растений», вы можете бонусным действием в свой ход устно указать, что каждое из них будет делать в свой следующий ход.
  - id: cleric.domen-sveta
    name: Домен света
    sources: *a1
    features:
      - id: cleric.domen-sveta.dopolnitelnyj-zagovor
        name: Дополнительный заговор
        level: 1
        subtitle: 1-й уровень, умение домена света
        description: Вы изучаете заговор свет [light], если еще не имели его раньше. Этот заговор не учитывается в количестве известных вам заговоров жреца.
      - id: cleric.domen-sveta.zaschischayuschaya-vspyshka
        name: Защищающая вспышка
        level: 1
        subtitle: 1-й уровень, умение домена света
        description: Вы можете создать божественный свет между собой и атакующим противником. Если вас атакует существо, которое вы видите в пределах 30 футов, вы можете реакцией создать помеху его броску атаки, вызывая перед атакующим вспышку света, до того как он попадёт или промажет. Существа, которые не могут быть ослеплены, обладают иммунитетом к этому умению. Вы можете использовать это умение количество раз, равное вашему модификатору Мудрости (минимум один раз). Вы восстанавливаете все потраченные использования, когда завершаете продолжительный отдых.
      - id: cleric.domen-sveta.bozhestvennyj-kanal-siyanie-rassveta
        name: "Божественный канал: сияние рассвета"
        level: 2
        subtitle: 2-й уровень, умение домена света
        description: |-
          Вы можете использовать «Божественный канал», чтобы призывать солнечный свет, прогоняющий тьму и причиняющий урон излучением врагам.

          Вы действием демонстрируете свой священный символ, и вся магическая тьма в пределах 30 футов от вас рассеивается. Кроме того, все враждебные существа в пределах 30 футов от вас должны совершить спасбросок Телосложения. Существа получают урон излучением, равный 2к10 + ваш уровень жреца в случае провала, и половину этого урона в случае успешного спасброска. Существа с полным укрытием от вас не подвержены воздействию.
      - id: cleric.domen-sveta.uluchshennaya-vspyshka
        name: Улучшенная вспышка
        level: 6
        subtitle: 6-й уровень, умение домена света
        description: Вы можете использовать умение «Защищающая вспышка», когда существо, которое вы можете видеть в пределах 30 футов от себя, атакует не вас, а другое существо.
      - id: cleric.domen-sveta.moguschestvennoe-koldovstvo
        name: Могущественное колдовство
        level: 8
        subtitle: 8-й уровень, умение домена света
        description: Вы добавляете модификатор Мудрости к урону, который причиняете заговорами жреца.
      - id: cleric.domen-sveta.korona-sveta
        name: Корона света
        level: 17
        subtitle: 17-й уровень, умение домена света
        description: Вы можете действием создать ауру солнечного света, которая существует 1 минуту или пока вы не рассеете её еще одним действием. Вы испускаете яркий свет в радиусе 60 футов и тусклый свет в радиусе еще 30 футов. Ваши противники, находящиеся на ярком свету, совершают с помехой спасброски от любых заклинаний, причиняющих урон огнём или излучением.
  - id: cleric.domen-smerti
    name: Домен смерти
    sources:
      - code: DMG14
        book: Dungeon Master’s Guide
    features:
      - id: cleric.domen-smerti.bonusnoe-vladenie
        name: Бонусное владение
        level: 1
        subtitle: 1-й уровень, умение домена смерти
        description: Вы получаете владение воинским оружием.
      - id: cleric.domen-smerti.zhnec
        name: Жнец
        level: 1
        subtitle: 1-й уровень, умение домена смерти
        description: Вы изучаете один заговор из школы Некромантии из списка любого класса. Когда вы накладываете заговор школы Некромантии, в обычных условиях нацеливающийся только на одно существо, вы можете нацелиться на двух существ, находящихся в пределах дистанции и при этом в пределах 5 футов друг от друга.
      - id: cleric.domen-smerti.bozhestvennyj-kanal-kasanie-smerti
        name: "Божественный канал: касание смерти"
        level: 2
        subtitle: 2-й уровень, умение домена смерти
        description: |-
          Вы можете использовать «Божественный канал» для уничтожения касанием чужой жизненной силы.

          Когда вы попадаете по существу рукопашной атакой, вы можете использовать «Божественный канал», чтобы нанести цели дополнительный урон некротической энергией, равный 5 + ваш удвоенный уровень Жреца.
      - id: cleric.domen-smerti.neizbezhnoe-razrushenie
        name: Неизбежное разрушение
        level: 6
        subtitle: 6-й уровень, умение домена смерти
        description: Способность жреца проводить негативную энергию улучшается. Урон некротической энергией, причиняемый вашими заклинаниями Жреца и «Божественным каналом», игнорируют сопротивление урону некротической энергией.
      - id: cleric.domen-smerti.bozhestvennyj-udar
        name: Божественный удар
        level: 8
        subtitle: 8-й уровень, умение домена смерти
        description: Вы получаете способность наполнять удары своего оружия некротической энергией. Один раз в каждый свой ход, когда вы попадаете по существу атакой оружием, вы можете причинить цели дополнительный урон некротической энергией 1к8. Когда вы достигаете 14-го уровня, дополнительный урон возрастает до 2к8.
      - id: cleric.domen-smerti.uluchshennyj-zhnec
        name: Улучшенный жнец
        level: 17
        subtitle: 17-й уровень, умение домена смерти
        description: Когда вы накладываете заклинание школы Некромантии с 1-го по 5-й уровень, нацеливающееся только на одно существо, это заклинание может нацелиться на двух существ, находящихся в пределах дистанции и при этом в пределах 5 футов друг от друга. Если заклинание уничтожает материальные компоненты, жрец должен предоставить по полному набору для каждой цели.
  - id: cleric.domen-magii
    name: Домен магии
    sources:
      - code: SCAG
        book: Sword Coast Adventurer’s Guide
    features:
      - id: cleric.domen-magii.nachinayuschij-mag
        name: Начинающий маг
        level: 1
        subtitle: 1-й уровень, умение домена магии
        description: Вы получаете владение навыком Магия и узнаёте два заговора на ваш выбор из списка заклинаний волшебника. Для вас эти заговоры считаются заговорами жреца.
      - id: cleric.domen-magii.bozhestvennyj-kanal-ograzhdenie-magiej
        name: "Божественный канал: ограждение магией"
        level: 2
        subtitle: 2-й уровень, умение домена магии
        description: |-
          Вы можете использовать «Божественный канал», чтобы оградиться от существ из иных миров.

          Вы действием демонстрируете свой священный символ, и один выбранный вами Небожитель, Элементаль, Фея или Исчадие в 30 футах от вас должен совершить спасбросок Мудрости, при условии, что существо вас видит и слышит. Если существо проваливает спасбросок, оно изгоняется на 1 минуту или пока не получит любой урон.

          Изгнанное существо должно тратить свои ходы, пытаясь уйти от вас как можно дальше, и не может добровольно переместиться в пространство, находящееся в пределах 30 футов от вас. Оно также не может совершать реакции. Действием существо может использовать только Рывок или пытаться освободиться от эффекта, препятствующее его передвижению. Если двигаться некуда, существо может использовать действие Уклонение.

          После 5-го уровня, провалив спасбросок против вашей способности «Ограждения магией», существо изгоняется на 1 минуту (как заклинание изгнание [banishment], концентрация не требуется), если он не находится на своём родном плане и его показатель опасности равен или ниже порога указанного в таблице «Ограждения магией».

          **Ограждения магией**

          | Уровень жреца | Изгоняется существо с ПО... |
          | 5 | 1/2 или ниже |
          | 8 | 1 или ниже |
          | 11 | 2 или ниже |
          | 14 | 3 или ниже |
          | 17 | 4 или ниже |
      - id: cleric.domen-magii.razrushitel-zaklinanij
        name: Разрушитель заклинаний
        level: 6
        subtitle: 6-й уровень, умение домена магии
        description: При восстановлении хитов союзнику с помощью заклинания 1-го уровня или выше, вы можете так же развеять одно выбранное вами заклинание, наложенное на это существо. Уровень прерываемого заклинания должен быть равен или ниже уровню ячейки целебного заклинания.
      - id: cleric.domen-magii.moguschestvennoe-koldovstvo
        name: Могущественное КОЛДОВСТВО
        level: 8
        subtitle: 8-й уровень, умение домена магии
        description: Вы добавляете модификатор Мудрости к урону, который причиняете заговорами жреца.
      - id: cleric.domen-magii.masterstvo-magii
        name: Мастерство магии
        level: 17
        subtitle: 17-й уровень, умение домена магии
        description: "Вы выбираете четыре заклинания из списка заклинаний волшебника, по одному следующих уровней: 6-й, 7-й, 8-й и 9-й. Добавьте их в список доменных заклинаний. Как и все доменные заклинания, они всегда подготовлены и для вас считаются заклинаниями жреца."
  - id: cleric.domen-kuzni
    name: Домен кузни
    sources:
      - code: XGE
        book: Xanathar’s Guide to Everything
    features:
      - id: cleric.domen-kuzni.bonusnoe-vladenie
        name: Бонусное владение
        level: 1
        subtitle: 1-й уровень, умение домена кузни
        description: Вы получаете владение тяжёлыми доспехами и инструментами кузнеца.
      - id: cleric.domen-kuzni.blagoslovlenie-kuznicy
        name: Благословление кузницы
        level: 1
        subtitle: 1-й уровень, умение домена кузни
        description: |-
          Вы получаете способность наделять магией оружие или доспехи. В конце продолжительного отдыха вы можете коснуться одного немагического предмета, который является доспехом, простым или воинским оружием. До конца вашего следующего продолжительного отдыха или до тех пор пока вы не умрёте, этот объект считается магическим предметом, дающим бонус +1 к КД, если это доспех, или бонус +1 к броскам атаки и урона, если это оружие.

          Использовав это умение, вы не можете использовать его повторно до окончания продолжительного отдыха.
      - id: cleric.domen-kuzni.bozhestvennyj-kanal-blagoslovenie-remeslennika
        name: "Божественный канал: благословение ремесленника"
        level: 2
        subtitle: 2-й уровень, умение домена кузни
        description: |-
          Вы можете использовать свой «Божественный канал» для создания простых вещей. Вы проводите ритуал длительностью в час, который создаёт немагический предмет, содержащий немного металла: простое или воинское оружие, доспехи, десять боеприпасов, набор инструментов или другой металлический объект. Создание завершается через час, предмет появляется в свободном пространстве по вашему выбору на поверхности в пределах 5 футов от вас.

          То, что вы создаёте, может быть чем-то, что стоит не более 100 зм. В рамках этого ритуала вы должны выложить металл, который может содержать монеты, со стоимостью, равной стоимости создаваемого предмета. Металл безвозвратно сливается и превращается в творение в конце ритуала, магически формируя даже неметаллические части творения.

          Ритуал может создать дубликат немагического предмета, который содержит металл, такой как ключ, если вы обладаете оригиналом во время ритуала.
      - id: cleric.domen-kuzni.dusha-kuznicy
        name: Душа кузницы
        level: 6
        subtitle: 6-й уровень, умение домена кузни
        description: |-
          Ваше мастерство жреца кузни предоставляет вам особые способности:

          - Вы получаете сопротивление огненному урону.
          - Когда вы носите тяжёлый доспех, то получаете +1 к КД
      - id: cleric.domen-kuzni.bozhestvennyj-udar
        name: Божественный удар
        level: 8
        subtitle: 8-й уровень, умение домена кузни
        description: |-
          Вы получаете возможность наполнять свои удары оружием огненной силой кузницы. Один раз в каждый свой ход, когда вы попадаете по существу атакой оружием, вы можете причинить цели дополнительный урон огнём 1к8.

          Когда вы достигаете 14-го уровня, дополнительный урон увеличивается до 2к8.
      - id: cleric.domen-kuzni.svyatoj-kuznicy-i-ognya
        name: Святой кузницы и огня
        level: 17
        subtitle: 17-й уровень, умение домена кузни
        description: |-
          Ваше благословенное сходство с огнём и металлом становится более мощным:

          - Вы получаете иммунитет к огненному урону
          - Когда вы носите тяжёлые доспехи, вы получаете сопротивление дробящему, колющему и рубящему урону от немагических атак.
  - id: cleric.domen-upokoeniya
    name: Домен упокоения
    sources:
      - code: XGE
        book: Xanathar’s Guide to Everything
    features:
      - id: cleric.domen-upokoeniya.krug-smerti
        name: Круг смерти
        level: 1
        subtitle: 1-й уровень, умение домена упокоения
        description: |-
          Вы получаете возможность управлять гранью между жизнью и смертью. Если обычно вы должны бросить одну или несколько костей, чтобы заклинанием восстановить хиты существу с 0 хитов, то вместо этого вы используете максимально возможное число, для каждой кости.

          Кроме того, вы изучаете заговор уход за умирающим [spare the dying], который не учитывается при подсчёте известных вам заговоров жреца. Для вас он имеет дистанцию 30 футов, и вы можете накладывать его бонусным действием.
      - id: cleric.domen-upokoeniya.glaza-mogily
        name: Глаза могилы
        level: 1
        subtitle: 1-й уровень, умение домена упокоения
        description: |-
          Вы получаете возможность иногда ощущать присутствие нежити, существование которой является оскорблением естественного цикла жизни.

          Действием вы можете открыть свой разум, чтобы магическим образом обнаружить Нежить. До конца вашего следующего хода вы знаете местоположение любой Нежити в пределах 60 футов от вас, которая не находится за полным укрытием и не защищена от магии прорицания.

          Это чувство ничего не позволяет вам узнать о возможностях существа или идентифицировать его. Вы можете использовать это умение количество раз, равное вашему модификатору Мудрости (минимум 1 раз).

          Вы восстанавливаете все потраченные применения после окончания продолжительного отдыха.
      - id: cleric.domen-upokoeniya.bozhestvennyj-kanal-put-k-mogile
        name: "Божественный канал: путь к могиле"
        level: 2
        subtitle: 2-й уровень, умение домена упокоения
        description: |-
          Вы можете использовать свой «Божественный канал», чтобы пометить жизненную силу другого существа как подлежащую уничтожению.

          Действием вы выбираете одно существо, которое вы можете видеть, в пределах 30 футов от вас, проклиная его до конца вашего следующего хода. Когда вы или союзник попадете по проклятому существу атакой, у существа будет уязвимость ко всему урону от атаки, а затем проклятие заканчивается.
      - id: cleric.domen-upokoeniya.strazh-na-poroge-smerti
        name: Страж на пороге смерти
        level: 6
        subtitle: 6-й уровень, умение домена упокоения
        description: |-
          Вы получаете возможность препятствовать смерти.

          Когда вы или существо, которое вы можете видеть в пределах 30 футов, подвергаются критическому удару, вы можете реакцией превратить этот удар в нормальный удар. Любые эффекты, вызванные критическим ударом, будут отменены.

          Вы можете использовать это умение количество раз, равное вашему модификатору Мудрости (минимум 1 раз).

          Вы восстанавливаете все потраченные применения, после окончания продолжительного отдыха.
      - id: cleric.domen-upokoeniya.moguschestvennoe-koldovstvo
        name: Могущественное колдовство
        level: 8
        subtitle: 8-й уровень, умение домена упокоения
        description: Вы добавляете модификатор Мудрости к урону, который вы наносите любым заговором жреца.
      - id: cleric.domen-upokoeniya.hranitel-dush
        name: Хранитель душ
        level: 17
        subtitle: 17-й уровень, умение домена упокоения
        description: |-
          Вы можете схватить остатки жизненной силы умирающего и использовать их, чтобы исцелить живых. Когда враг, которого вы можете видеть, умирает в пределах 60 футов от вас, вы или одно существо по вашему выбору, находящееся в пределах 60 футов от вас, восстанавливает количество хитов, равное числу Костей Хитов врага.

          Вы можете использовать эту способность, только если вы не являетесь недееспособным. Использовав это умение, вы не можете использовать его повторно до начала вашего следующего хода.
  - id: cleric.domen-mira
    name: Домен мира
    sources:
      - code: TCE
        book: Tasha’s Cauldron of Everything
    features:
      - id: cleric.domen-mira.zaklinaniya-domena
        name: Заклинания домена
        level: 1
        subtitle: 1-й уровень, умение домена мира
        description: |-
          Вы получаете заклинания домена согласно таблице «Заклинания домена мира».

          **Заклинания домена мира**

          | Уровень жреца | Заклинания |
          | 1 | героизм [heroism], убежище [sanctuary] |
          | 3 | охраняющая связь [warding bond], подмога [aid] |
          | 5 | маяк надежды [beacon of hope], послание [sending] |
          | 7 | аура очищения [aura of purity], Отилюков упругий шар [Оtiluke’s resilient sphere] |
          | 9 | высшее восстановление [greater restoration], ментальная связь Рэри [Rary’s telepathic bond] |
      - id: cleric.domen-mira.ustanovlenie-mira
        name: Установление мира
        level: 1
        subtitle: 1-й уровень, умение домена мира
        description: Вы получаете владение навыком Проницательность, Выступление или Убеждение (по вашему выбору).
      - id: cleric.domen-mira.obodryayuschaya-svyaz
        name: Ободряющая связь
        level: 1
        subtitle: 1-й уровень, умение домена мира
        description: |-
          Вы можете создать укрепляющую связь между существами, которые находятся в мире друг с другом. Действием вы можете выбрать количество согласных существ (целью можете быть и вы), равное вашему бонусу мастерства, которых вы можете видеть в пределах 30 футов от вас. Вы создаёте между этими существами магическую связь, которая длится 10 минут или до тех пор, пока не используете это умение повторно. Пока любое из связанных существ находится в пределах 30 футов от другого, каждое существо может бросить к4 и добавить выпавшее значение к своим броску атаки, проверке характеристики или спасброску. Каждое существо может добавлять к4 не более одного раза за ход.

          Вы можете использовать это умение количество раз, равное вашему бонусу мастерства. Вы восстанавливаете все потраченные использования после окончания продолжительного отдыха.
      - id: cleric.domen-mira.bozhestvennyj-kanal-balzam-mira
        name: "Божественный канал: Бальзам мира"
        level: 2
        subtitle: 2-й уровень, умение домена мира
        description: Вы можете использовать свой «Божественный канал», чтобы сделать само своё присутствие умиротворяющим бальзамом. Действием вы можете передвинуться на любое расстояние вплоть до своей скорости, не провоцируя атак. Когда вы оказываетесь в пределах 5 футов от любого другого существа во время этого действия, вы можете восстановить существу количество хитов, равное 2к6 + ваш модификатор Мудрости (минимум 1 хит). Существо может получить это исцеление только один раз, пока вы совершаете это действие.
      - id: cleric.domen-mira.zaschitnaya-svyaz
        name: Защитная связь
        level: 6
        subtitle: 6-й уровень, умение домена мира
        description: Связь, которую вы устанавливаете между личностями, помогает им защищать друг друга. Когда существо, связанное вашим умением «Ободряющая связь», должно получить урон, другое связанное с ним существо, находящееся в пределах 30 футов от него, может реакцией телепортироваться в свободное пространство в пределах 5 футов от первого существа, после чего оно получает весь урон, который был предназначен первому существу.
      - id: cleric.domen-mira.moguschestvennoe-koldovstvo
        name: Могущественное колдовство
        level: 8
        subtitle: 8-й уровень, умение домена мира
        description: Вы добавляете свой модификатор Мудрости к урону, который наносите любыми заговорами жреца.
      - id: cleric.domen-mira.rasshirennaya-svyaz
        name: Расширенная связь
        level: 17
        subtitle: 17-й уровень, умение домена мира
        description: Преимущества ваших умений «Ободряющая связь» и «Защитная связь» теперь действуют, когда существа находятся в пределах 60 футов друг от друга. Более того, когда существо использует «Защитную связь», оно получает сопротивление урону, получаемому в результате этого умения.
  - id: cleric.domen-poryadka
    name: Домен порядка
    sources:
      - code: TCE
        book: Tasha’s Cauldron of Everything
    features:
      - id: cleric.domen-poryadka.zaklinaniya-domena
        name: Заклинания домена
        level: 1
        subtitle: 1-й уровень, умение домена порядка
        description: |-
          Вы получаете заклинания домена согласно таблице «Заклинания домена порядка».

          **Заклинания домена порядка**

          | Уровень жреца | Заклинания |
          | 1 | героизм [heroism], приказ [command] |
          | 3 | область истины [zone of truth], удержание личности [hold person] |
          | 5 | замедление [slow], множественное лечащее слово [mass healing word] |
          | 7 | поиск существа [locate creature], принуждение [compulsion] |
          | 9 | общение [commune], подчинение личности [dominate person] |
      - id: cleric.domen-poryadka.bonusnye-vladeniya
        name: Бонусные владения
        level: 1
        subtitle: 1-й уровень, умение домена порядка
        description: Вы получаете владение тяжёлыми доспехами. Вы также получаете владение навыком Запугивание или Убеждение (по вашему выбору).
      - id: cleric.domen-poryadka.golos-avtoriteta
        name: Голос авторитета
        level: 1
        subtitle: 1-й уровень, умение домена порядка
        description: |-
          Вы можете призвать силу закона, чтобы повести союзников в атаку. Когда вы накладываете заклинание на союзника, используя ячейку 1-го уровня и выше, этот союзник может реакцией совершить одну атаку оружием по существу, которое вы можете видеть, по вашему выбору.

          Если заклинание затрагивает больше чем одного союзника, вы выбираете, кто из союзников может совершать атаку в данный момент.
      - id: cleric.domen-poryadka.bozhestvennyj-kanal-trebovanie-poryadka
        name: "Божественный канал: Требование порядка"
        level: 2
        subtitle: 2-й уровень, умение домена порядка
        description: |-
          Вы можете использовать свой «Божественный канал», чтобы надавить на кого-то.

          Действием вы демонстрируете священный символ. Каждое существо по вашему выбору в пределах 30 футов от вас, которое может слышать или видеть вас, должно преуспеть в спасброске Мудрости, иначе будет очаровано вами до окончания вашего следующего хода или до того, как очарованное существо получит урон. При провале спасброска вы также можете заставить любое очарованное существо выронить то, что у него в руках.
      - id: cleric.domen-poryadka.voploschenie-zakona
        name: Воплощение закона
        level: 6
        subtitle: 6-й уровень, умение домена порядка
        description: |-
          Вы становитесь невероятно сильны в применении магической энергии для подчинения других.

          Когда вы накладываете заклинание школы Очарования, используя ячейку заклинаний 1-го уровня или выше, со временем накладывания «1 действие», вы можете сменить время накладывания этого заклинания на «1 бонусное действие».

          Вы можете использовать это умение количество раз, равное вашему модификатору Мудрости (минимум 1 раз). Вы восстанавливаете все потраченные использования после окончания продолжительного отдыха.
      - id: cleric.domen-poryadka.bozhestvennyj-udar
        name: Божественный удар
        level: 8
        subtitle: 8-й уровень, умение домена порядка
        description: Вы получаете способность наделять удары своего оружия божественной энергией. Один раз в каждый свой ход, когда вы попадаете по существу атакой оружием, вы можете дополнительно нанести цели 1к8 урона психической энергией. Когда вы достигаете 14-го уровня, этот урон увеличивается до 2к8.
      - id: cleric.domen-poryadka.gnev-poryadka
        name: Гнев порядка
        level: 17
        subtitle: 17-й уровень, умение домена порядка
        description: Враги, которых вы намереваетесь уничтожить, падут перед вами и вашими союзниками. Если вы наносите урон «Божественным ударом» по существу в свой ход, то можете проклясть это существо до начала вашего следующего хода. В следующий раз, когда один из ваших союзников попадет по проклятому существу атакой, цель также получит 2к8 урона психической энергией, после чего проклятие закончится. Вы можете проклясть противника таким способом только один раз за ход.
  - id: cleric.domen-sumerek
    name: Домен сумерек
    sources:
      - code: TCE
        book: Tasha’s Cauldron of Everything
    features:
      - id: cleric.domen-sumerek.zaklinaniya-domena
        name: Заклинания домена
        level: 1
        subtitle: |-
          1-й уровень, умение домена сумерек*
          Вы получаете заклинания домена согласно таблице «Заклинания домена сумерек».
        description: |-
          **Заклинания домена сумерек**

          | Уровень жреца | Заклинания |
          | 1 | огонь фей [faerie fire], усыпление [sleep] |
          | 3 | видение невидимого [see invisibility], лунный луч [moonbeam] |
          | 5 | аура живучести [aura of vitality], Леомундова хижина [Leomund’s tiny hut] |
          | 7 | аура жизни [aura of life], высшая невидимость [greater invisibility] |
          | 9 | круг силы [circle of power], фальшивый двойник [mislead] |
          |  |
      - id: cleric.domen-sumerek.bonusnoe-vladenie
        name: Бонусное владение
        level: 1
        subtitle: 1-й уровень, умение домена сумерек
        description: Вы получаете владение воинским оружием и тяжёлыми доспехами.
      - id: cleric.domen-sumerek.glaza-nochi
        name: Глаза ночи
        level: 1
        subtitle: 1-й уровень, умение домена сумерек
        description: |-
          Вы способны видеть сквозь непроглядную тьму. Вы получаете тёмное зрение в пределах 300 футов. На этой дистанции вы можете видеть в тусклом свете так же, как при ярком свете, а в полной темноте — как при тусклом свете.

          Действием вы можете магическим образом наделить этим тёмным зрением определённое количество согласных существ, которых вы можете видеть в пределах 10 футов. Количество существ равно вашему модификатору Мудрости (минимум одно существо). Эффект общего тёмного зрения длится 1 час. После того, как вы поделились своим тёмным зрением, вы не можете сделать это вновь, пока не закончите продолжительный отдых или не потратите ячейку заклинаний любого уровня на повторное использование этого умения.
      - id: cleric.domen-sumerek.blagoslovenie-bditelnosti
        name: Благословение бдительности
        level: 1
        subtitle: 1-й уровень, умение домена сумерек
        description: Ночь научила вас бдительности. Действием вы касаетесь одного существа (включая себя) и даруете ему преимущество на совершение следующего броска инициативы. Это преимущество пропадает сразу после совершения броска или при повторном использовании этого умения.
      - id: cleric.domen-sumerek.bozhestvennyj-kanal-sumerechnoe-svyatilische
        name: "Божественный канал: Сумеречное святилище"
        level: 2
        subtitle: 2-й уровень, умение домена сумерек
        description: |-
          Вы можете использовать «Божественный канал», чтобы поддержать ваших союзников спокойствием сумерек.

          Действием вы демонстрируете свой священный символ, и вас окружает сумеречная сфера. Сфера, наполненная тусклым светом, появляется с центром на вас, её радиус равен 30 футам. Сфера перемещается вместе с вами и существует 1 минуту или до тех пор, пока вы не станете недееспособны или не умрёте. Каждый раз, когда существо (включая вас) оканчивает свой ход в пределах сферы, вы можете даровать этому существу одно из описанных ниже преимуществ:

          - Даровать временные хиты в количестве, равном 1к6 + ваш уровень жреца.
          - Окончить одно действие эффекта очарования или испуга.
      - id: cleric.domen-sumerek.shagi-nochi
        name: Шаги ночи
        level: 6
        subtitle: 6-й уровень, умение домена сумерек
        description: |-
          Вы можете использовать мистическую силу ночи, чтобы подняться в воздух. Бонусным действием, когда вы находитесь в тусклом свете или темноте, вы можете магическим образом даровать себе скорость полёта, равную вашей скорости ходьбы, на 1 минуту. Вы можете использовать бонусное действие подобным образом количество раз, равное вашему бонусу мастерства.

          Вы восстанавливаете все потраченные использования после окончания продолжительного отдыха.
      - id: cleric.domen-sumerek.bozhestvennyj-udar
        name: Божественный удар
        level: 8
        subtitle: 8-й уровень, умение домена сумерек
        description: Вы получаете способность наделять удары своего оружия божественной энергией. Один раз в каждый свой ход, когда вы попадаете по существу атакой оружием, вы можете нанести цели дополнительно 1к8 урона излучением. Когда вы достигаете 14-го уровня, этот урон увеличивается до 2к8.
      - id: cleric.domen-sumerek.sumerechnaya-pelena
        name: Сумеречная пелена
        level: 17
        subtitle: 17-й уровень, умение домена сумерек
        description: "Вы призываете сумрак, окутывающий вас защищающим объятьем: вы и ваши союзники, находящиеся в сфере, созданной вашим сумеречным святилищем, получаете укрытие на половину."
