id: cleric
name: Жрец
name_en: Cleric
source_url: https://dnd.su/class/89-cleric/
sources: &a1
  - code: PH14
    book: Player's Handbook
features:
  - id: cleric.ispolzovanie-zaklinanij
    name: Использование заклинаний
    level: 1
    subtitle: 1-й уровень, умение жреца
    description: |-
      Будучи проводником божественной силы, вы можете накладывать заклинания жреца. Вы найдёте список заклинаний, доступных жрецу в этом разделе: заклинания жреца. Так же правила по использованию заклинаний есть в этой статье: ***использование заклинаний.***

      **Заговоры (заклинания 0-го уровня).** На 1-м уровне вы знаете три заговора на свой выбор из списка заклинаний жреца. Вы узнаёте дополнительные заговоры жреца на более высоких уровнях, как показано в колонке «Известные заговоры».

      **Подготовка и сотворение заклинаний.** Таблица «Жрец» показывает, какое количество ячеек для накладывания заклинаний жреца у вас есть на первом и более высоких уровнях. Для накладывания одного из этих заклинаний вы должны потратить ячейку заклинаний того же уровня или выше, что и само заклинание. Вы восстановите все потраченные ячейки, когда закончите продолжительный отдых.

      Вы подготавливаете список заклинаний жреца, доступных для накладывания. При этом вы выбираете **количество заклинаний жреца, равное модификатору Мудрости + уровень жреца (минимум одно заклинание)**. Уровень заклинаний не должен превышать уровень самой высокой имеющейся у вас ячейки заклинаний.

      Например, если вы жрец 3-го уровня, то у вас есть четыре ячейки заклинаний 1-го уровня и две ячейки 2-го уровня. При Мудрости 16 ваш список подготовленных заклинаний может включать в себя шесть заклинаний 1-го или 2-го уровня в любой комбинации. Если вы подготовили заклинание 1-го уровня лечение ран [cure wounds], вы можете наложить его, используя ячейку 1-го уровня или ячейку 2-го уровня. Накладывание заклинания не удаляет его из списка подготовленных заклинаний.

      Вы можете изменить список подготовленных заклинаний, когда заканчиваете продолжительный отдых. Подготовка нового списка заклинаний жреца требует времени, проведённого в молитвах и медитации: не менее 1 минуты за уровень заклинания для каждого заклинания в вашем списке.

      **Базовая характеристика заклинаний.** При накладывании заклинаний жрец использует Мудрость. Сила ваших заклинаний исходит от вашей преданности своему божеству. Вы используете Мудрость в случаях, когда заклинание ссылается на базовую характеристику. Кроме того, вы используете модификатор Мудрости при определении Сл спасбросков от ваших заклинаний жреца, и при броске атаки заклинаниями.

      **Сл спасброска** = 8 + ваш бонус мастерства + ваш модификатор Мудрости

      **Модификатор броска атаки** = ваш бонус мастерства + ваш модификатор Мудрости

      **Ритуальное колдовство.** Вы можете сотворить заклинание жреца как ритуал, если у этого заклинания есть ключевое слово «ритуал», и оно подготовлено вами.

      **Фокусировка заклинания.** Вы можете использовать священный символ в качестве заклинательной фокусировки для заклинаний жреца.
  - id: cleric.dopolnitelnye-zaklinaniya-zhreca
    name: Дополнительные заклинания жреца
    level: 1
    subtitle: 1-й уровень, опциональное умение жреца
    description: |-
      Заклинания из представленного списка расширяют ваш список заклинаний жреца, представленный в «*Книге игрока*». Список отсортирован по уровню заклинаний, а не по уровню персонажа. Если заклинание может быть наложено как ритуал, то в скобках также будет указано «ритуал».

      | Уровень
      заклинания | Заклинания |
      | 3 | аура живучести [aura of vitality], покров духа [spirit shroud] |
      | 4 | аура жизни [aura of life], аура очищения [aura of purity] |
      | 5 | призыв духа небожителя [summon celestial] |
      | 6 | солнечный луч [sunbeam] |
      | 8 | солнечный ожог [sunburst] |
      | 9 | слово силы: исцеление [power word heal] |
  - id: cleric.bozhestvennyj-domen
    name: Божественный домен
    level: 1
    subtitle: 1-й уровень, умение жреца
    description: |-
      Выберите один домен, связанный с вашим божеством. Все домены детально рассмотрены в конце описания класса, и каждый содержит примеры божеств, связанных с ним. Ваш выбор даёт вам заклинания домена и другие умения. Он также даёт вам дополнительные способы использования «Божественного канала», когда вы получаете это умение на 2-м уровне, и дополнительные умения на 6-м, 8-м и 17-м уровнях.

      **Заклинания домена.** У каждого домена есть список заклинаний, которые вы получаете на новых уровнях жреца. Как только вы получаете заклинание домена, оно всегда считается подготовленным и не учитывается при подсчёте количества заклинаний, которые можно подготовить.

      Если вы получаете доступ к заклинанию, отсутствующему в списке заклинаний жреца, оно всё равно будет считаться для вас заклинанием жреца.
  - id: cleric.bozhestvennyj-kanal
    name: Божественный канал
    level: 2
    subtitle: 2-й уровень, умение жреца
    description: |-
      Вы получаете возможность направлять божественную энергию непосредственно от своего божества, используя её для подпитки магических эффектов. Вы начинаете с двумя такими эффектами: «Изгнание Нежити» и эффектом, определяемым вашим доменом. Некоторые домены дают вам дополнительные эффекты, как только вы получите новые уровни.

      Когда вы используете «Божественный канал», вы выбираете, какой эффект создать. Затем вы должны окончить короткий или продолжительный отдых, чтобы использовать «Божественный канал» снова. Некоторые эффекты «Божественного канала» требуют совершить спасбросок. Когда вы используете эффекты такого рода, Сл равна Сл спасброска от ваших заклинаний жреца.

      Начиная с 6-го уровня вы можете использовать «Божественный канал» дважды перед отдыхом, а начиная с 18-го уровня вы можете использовать его три раза перед отдыхом: по окончании короткого или продолжительного отдыха вы восстановите все потраченные использования.

      **Божественный канал: изгнание нежити.** Вы действием демонстрируете свой священный символ и читаете молитву, изгоняющую Нежить. Вся Нежить, которая может видеть или слышать вас в пределах 30 футов, должна совершить спасбросок Мудрости. Если существо провалило спасбросок, оно изгоняется на 1 минуту, или пока не получит урон. Изгнанное существо должно тратить свои ходы, пытаясь уйти от вас как можно дальше, и не может добровольно переместиться в пространство, находящееся в пределах 30 футов от вас. Оно также не может совершать реакции. Действием существо может использовать только Рывок или пытаться освободиться от эффекта, препятствующего его передвижению. Если двигаться некуда, существо может использовать действие Уклонение.
  - id: cleric.pravednoe-vosstanovlenie
    name: Праведное восстановление
    level: 2
    subtitle: 2-й уровень, опциональное умение жреца
    description: "Вы можете использовать «Божественный канал», чтобы подпитать свои заклинания. Бонусным действием вы касаетесь своего священного символа, произносите молитву и возвращаете одну потраченную ячейку заклинаний, уровень которой не превышает половины вашего бонуса мастерства (с округлением в большую сторону). Вы можете использовать это умение количество раз, зависящее от уровня в этом классе: один раз на 2-м уровне, два раза на 6-м уровне, три раза на 18-м уровне. Вы восстанавливаете все потраченные использования после окончания продолжительного отдыха."
  - id: cleric.universalnost-zagovorov
    name: Универсальность заговоров
    level: 4
    subtitle: 4-й уровень, опциональное умение жреца
    description: Каждый раз, когда вы достигаете определённого уровня в этом классе и получаете умение «Увеличение характеристик», вы можете заменить один заговор, полученный умением «Использование заклинаний» этого класса, на другой заговор из списка заклинаний жреца.
  - id: cleric.unichtozhenie-nezhiti
    name: Уничтожение нежити
    level: 5
    subtitle: 5-й уровень, умение жреца
    description: |-
      Когда Нежить проваливает спасбросок от вашего умения «Изгнание Нежити», существо мгновенно уничтожается, если его показатель опасности не превышает значения, указанного в таблице:

      | Уровень жреца | Уничтожается Нежить с ПО... |
      | 5 | 1/2 или ниже |
      | 8 | 1 или ниже |
      | 11 | 2 или ниже |
      | 14 | 3 или ниже |
      | 17 | 4 или ниже |
  - id: cleric.blagoslovlennye-udary
    name: Благословлённые удары
    level: 8
    subtitle: 8-й уровень, опциональное умение жреца, заменяющее умения «Божественный удар» или «Могущественное колдовство»
    description: Вы благословлены божественной мощью в битве. Когда существо получает урон от вашего заговора или атаки оружием, вы можете дополнительно нанести 1к8 урона излучением. Как только вы нанесёте этот урон, вы не сможете использовать это умение снова до начала вашего следующего хода.
  - id: cleric.bozhestvennoe-vmeshatelstvo
    name: Божественное вмешательство
    level: 10
    subtitle: 10-й уровень, умение жреца
    description: |-
      Вы можете воззвать к своему божеству о помощи, когда сильно в этом нуждаетесь. Мольба о помощи совершается действием. Опишите помощь, которую вы ждёте, и киньте процентную кость. Если выпадет число, не превышающее ваш уровень жреца, ваше божество вмешается. Мастер сам выбирает природу вмешательства; подойдёт эффект какого-либо заклинания жреца или заклинания домена.

      Если божество вмешивается, вы не можете использовать это умение в течение 7 дней. В противном случае вы можете использовать это умение после продолжительного отдыха. На 20-м уровне ваше воззвание автоматически успешно и не требует проверки.
