id: fighter
name: Воин
name_en: Fighter
source_url: https://dnd.su/class/91-fighter/
sources: &a1
  - code: PH14
    book: Player's Handbook
features:
  - id: fighter.boevoj-stil
    name: Боевой стиль
    level: 1
    subtitle: 1-й уровень, умение воина
    description: Вы выбираете боевой стиль, соответствующий вашей специализации. Выберите один из следующих вариантов. Вы не можете выбирать один и тот же вариант боевого стиля, даже если позже у вас будет возможность выбрать еще один стиль.
    options:
      - id: fighter.boevoj-stil.duelyant
        name: Дуэлянт
        description: Пока вы держите рукопашное оружие в одной руке и не используете другого оружия, вы получаете бонус +2 к броскам урона этим оружием.
      - id: fighter.boevoj-stil.zaschita
        name: Защита
        description: Если существо, которое вы видите, атакует не вас, а другое существо, находящееся в пределах 5 футов от вас, вы можете реакцией создать помеху его броску атаки. Для этого вы должны использовать щит.
      - id: fighter.boevoj-stil.oborona
        name: Оборона
        description: Пока вы носите доспехи, вы получаете бонус +1 к КД.
      - id: fighter.boevoj-stil.srazhenie-bolshim-oruzhiem
        name: Сражение большим оружием
        description: Если у вас выпало «1» или «2» на кости урона при атаке, которую вы совершали рукопашным оружием, удерживая его двумя руками, то вы можете перебросить эту кость, и должны использовать новый результат, даже если снова выпало «1» или «2». Чтобы воспользоваться этим преимуществом, ваше оружие должно иметь свойство «двуручное» или «универсальное».
      - id: fighter.boevoj-stil.srazhenie-dvumya-oruzhiyami
        name: Сражение двумя оружиями
        description: Если вы сражаетесь двумя оружиями, вы можете добавить модификатор характеристики к урону от второй атаки.
      - id: fighter.boevoj-stil.strelba
        name: Стрельба
        description: Вы получаете бонус +2 к броску атаки, когда атакуете дальнобойным оружием.
      - id: fighter.boevoj-stil.perehvat
        name: Перехват
        description: |-
          *Опциональный вариант боевого стиля*

          Когда существо, которое вы можете видеть, попадает атакой по цели в пределах 5 футов от вас (но не по вам), вы можете реакцией уменьшить урон, получаемый целью, на количество, равное 1к10 + ваш бонус мастерства (вплоть до 0 урона). Чтобы использовать эту реакцию, вы должны держать в руках щит либо простое или воинское оружие.
      - id: fighter.boevoj-stil.prevoshodnaya-tehnika
        name: Превосходная техника
        description: |-
          *Опциональный вариант боевого стиля*

          Вы изучаете один боевой приём на ваш выбор из списка архетипа воина «Мастер боевых искусств». Если приём требует, чтобы цель совершила спасбросок для сопротивления эффекту приёма, то Сл спасброска равна 8 + ваш бонус мастерства + ваш модификатор Силы или Ловкости (по вашему выбору).

          Вы получаете одну кость превосходства: к6. Эта кость добавляется к другим костям превосходства, полученным вами из других источников. Эта кость используется для ваших приёмов и тратится при использовании. Вы восстанавливаете все свои израсходованные кости превосходства после окончания короткого или продолжительного отдыха.
      - id: fighter.boevoj-stil.srazhenie-vslepuyu
        name: Сражение вслепую
        description: |-
          *Опциональный вариант боевого стиля*

          Вы получаете слепое зрение в пределах 10 футов. В пределах этой дистанции вы можете видеть всё, что не находится за полным укрытием, даже если вы ослеплены или находитесь в темноте. Более того, вы можете увидеть невидимое существо в пределах этой дистанции, если только оно не преуспело в попытке спрятаться от вас.
      - id: fighter.boevoj-stil.srazhenie-golymi-rukami
        name: Сражение голыми руками
        description: |-
          *Опциональный вариант боевого стиля*

          Ваши безоружные удары могут наносить дробящий урон, равный 1к6 + ваш модификатор Силы, при попадании. Если вы не держите в руках ни оружие, ни щит, то кость урона увеличивается с к6 до к8.

          В начале каждого своего хода вы можете нанести 1к4 дробящего урона одному существу, которое вы держите в захвате.
      - id: fighter.boevoj-stil.srazhenie-metatelnym-oruzhiem
        name: Сражение метательным оружием
        description: |-
          *Опциональный вариант боевого стиля*

          Вы можете вытащить оружие со свойством «метательное» частью атаки, которую вы совершаете этим оружием.

          Кроме того, когда вы попадаете по существу дальнобойной атакой, используя метательное оружие, вы получаете бонус +2 к броску урона.
  - id: fighter.vtoroe-dyhanie
    name: Второе дыхание
    level: 1
    subtitle: 1-й уровень, умение воина
    description: |-
      Вы обладаете ограниченным источником выносливости, которым можете воспользоваться, чтобы уберечь себя. В свой ход вы можете бонусным действием восстановить хиты в размере 1к10 + ваш уровень воина.

      Использовав это умение, вы должны завершить короткий либо продолжительный отдых, чтобы получить возможность использовать его снова.
  - id: fighter.vsplesk-dejstvij
    name: Всплеск действий
    level: 2
    subtitle: 2-й уровень, умение воина
    description: Вы получаете возможность на мгновение преодолеть обычные возможности. В свой ход вы можете совершить одно дополнительное действие помимо обычного и бонусного действий. Использовав это умение, вы должны завершить короткий или продолжительный отдых, чтобы получить возможность использовать его снова. Начиная с 17-го уровня, вы можете использовать это умение дважды, прежде чем вам понадобится отдых, но в течение одного хода его всё равно можно использовать лишь один раз.
  - id: fighter.voinskij-arhetip
    name: Воинский архетип
    level: 3
    subtitle: 3-й уровень, умение воина
    description: Вы выбираете архетип, отражающий стиль и технику, к которым вы стремитесь. Подробности всех архетипов приведены ниже. Выбранный вами архетип предоставляет вам умения на 3-м, 7-м, 10-м, 15-м и 18-м уровнях.
  - id: fighter.universalnost-voina
    name: Универсальность воина
    level: 4
    subtitle: 4-й уровень, опциональное умение воина
    description: |-
      Каждый раз, когда вы достигаете определённого уровня в этом классе и получаете умение «Увеличение характеристик», вы можете сделать одно из следующих действий, отражающих смену направления вашего развития в боевых практиках:

      - Замените известный вам боевой стиль на другой из тех, что доступны воину.
      - Если вам известен какой-либо приём, вы можете заменить этот приём на другой.
  - id: fighter.dopolnitelnaya-ataka
    name: Дополнительная атака
    level: 5
    subtitle: 5-й уровень, умение воина
    description: |-
      Если вы в свой ход совершаете действие Атака, вы можете совершить две атаки вместо одной.

      Количество атак увеличивается до трёх на 11-м уровне этого класса, и до четырёх на 20-м уровне.
  - id: fighter.upornyj
    name: Упорный
    level: 9
    subtitle: 9-й уровень, умение воина
    description: |-
      Вы можете перебросить проваленный спасбросок и должны использовать новый результат. После этого вы можете повторно использовать это умение только после завершения продолжительного отдыха.

      Вы можете использовать это умение дважды между периодами продолжительного отдыха после достижения 13-го уровня, и трижды после достижения 17-го уровня.
lists:
  - id: fighter.boevye-priemy
    name: Боевые приёмы
    entries:
      - id: fighter.boevye-priemy.aktivnoe-uklonenie
        name: Активное уклонение
        description: При перемещении вы можете потратить одну кость превосходства, совершить её бросок и добавить выпавшее значение к КД, пока не прекратите перемещение.
      - id: fighter.boevye-priemy.ataka-s-vypadom
        name: Атака с выпадом
        description: Если вы в свой ход совершаете рукопашную атаку оружием, вы можете потратить одну кость превосходства, чтобы увеличить досягаемость этой атаки на 5 футов. В случае попадания вы добавляете кость превосходства к броску урона этой атаки.
      - id: fighter.boevye-priemy.ataka-s-manevrom
        name: Атака с манёвром
        description: Если вы попадаете по существу атакой оружием, вы можете потратить одну кость превосходства, чтобы один из ваших товарищей смог переместиться в более выгодное положение. Вы добавляете кость превосходства к броску урона этой атаки и выбираете дружественное существо, которое может видеть или слышать вас. Это существо может реакцией переместиться на расстояние до половины своей скорости, не провоцируя при этом атаки от цели вашей атаки.
      - id: fighter.boevye-priemy.ataka-s-ugrozoj
        name: Атака с угрозой
        description: Если вы попадаете по существу атакой оружием, вы можете потратить одну кость превосходства, чтобы попытаться напугать цель. Вы добавляете кость превосходства к броску урона этой атаки, а цель должна совершить спасбросок Мудрости. При провале цель испугана вами до конца вашего следующего хода.
      - id: fighter.boevye-priemy.ataka-s-fintom
        name: Атака с финтом
        description: Вы можете в свой ход потратить одну кость превосходства и бонусным действием совершить финт, выбрав в качестве цели одно существо в пределах 5 футов. Следующий бросок атаки по этому существу в этом ходу вы совершаете с преимуществом. Если атака попадает, добавьте кость превосходства к броску урона этой атаки. Оба преимущества пропадают, если вы не используете их в том же ходу, в котором получили их.
      - id: fighter.boevye-priemy.obezoruzhivayuschaya-ataka
        name: Обезоруживающая атака
        description: Если вы попадаете по существу атакой оружием, вы можете потратить одну кость превосходства, чтобы попытаться обезоружить противника, заставляя его выронить один предмет по вашему выбору, который он держит. Вы добавляете кость превосходства к броску урона атаки, а цель должна совершить спасбросок Силы. В случае провала она роняет выбранный вами предмет. Предмет падает у её ног.
      - id: fighter.boevye-priemy.oprokidyvayuschaya-ataka
        name: Опрокидывающая атака
        description: Если вы попадаете по существу атакой оружием, вы можете потратить одну кость превосходства, чтобы попытаться сбить цель с ног. Вы добавляете кость превосходства к броску урона атаки, и, если размер цели Большой или меньше, она должна совершить спасбросок Силы. В случае провала вы сбиваете цель с ног.
      - id: fighter.boevye-priemy.otvetnyj-udar
        name: Ответный удар
        description: Если существо промахивается по вам рукопашной атакой, вы можете реакцией потратить одну кость превосходства, чтобы совершить рукопашную атаку оружием по этому существу. Если вы попадаете, вы добавляете кость превосходства к броску урона этой атаки.
      - id: fighter.boevye-priemy.otvlekayuschij-udar
        name: Отвлекающий удар
        description: Если вы попадаете по существу атакой оружием, вы можете потратить одну кость превосходства, чтобы отвлечь существо, открывая его для ваших союзников. Вы добавляете кость превосходства к броску урона этой атаки. Следующий бросок атаки по этой цели любого существа кроме вас совершается с преимуществом, если атака совершается до начала вашего следующего хода.
      - id: fighter.boevye-priemy.parirovanie
        name: Парирование
        description: Если другое существо причиняет вам урон рукопашной атакой, вы можете реакцией потратить одну кость превосходства, чтобы уменьшить урон на величину, равную броску вашей кости превосходства + ваш модификатор Ловкости.
      - id: fighter.boevye-priemy.provociruyuschaya-ataka
        name: Провоцирующая атака
        description: Если вы попадаете по существу атакой оружием, вы можете потратить одну кость превосходства, чтобы попытаться спровоцировать противника атаковать вас. Вы добавляете кость превосходства к броску урона этой атаки, а цель должна совершить спасбросок Мудрости. При провале цель до конца вашего следующего хода совершает с помехой броски атаки по всем целям, кроме вас.
      - id: fighter.boevye-priemy.splochenie
        name: Сплочение
        description: Вы можете в свой ход бонусным действием потратить одну кость превосходства, чтобы поддержать решимость одного из ваших спутников. Если вы это сделаете, выберите дружественное существо, которое может видеть или слышать вас. Это существо получает временные хиты, равные броску кости превосходства + ваш модификатор Харизмы.
      - id: fighter.boevye-priemy.tolkayuschaya-ataka
        name: Толкающая атака
        description: Если вы попадаете по существу атакой оружием, вы можете потратить одну кость превосходства, чтобы попытаться оттолкнуть цель. Вы добавляете кость превосходства к броску урона атаки, и, если размер цели Большой или меньше, она должна совершить спасбросок Силы. При провале вы толкаете цель на расстояние до 15 футов от себя.
      - id: fighter.boevye-priemy.tochnaya-ataka
        name: Точная атака
        description: Если вы совершаете бросок атаки оружием по существу, вы можете потратить одну кость превосходства, чтобы добавить её к броску. Вы можете использовать этот приём до или после совершения броска атаки, но до применения эффектов атаки.
      - id: fighter.boevye-priemy.udar-komanduyuschego
        name: Удар командующего
        description: Если вы совершаете в свой ход действие Атака, вы можете отказаться от одной из ваших атак и бонусным действием направить удар одного из ваших соратников. Если вы это сделаете, выберите дружественное существо, которое может видеть или слышать вас и потратьте одну кость превосходства. Это существо может немедленно совершить реакцией одну атаку оружием, добавив кость превосходства к броску урона этой атаки.
      - id: fighter.boevye-priemy.shirokaya-ataka
        name: Широкая атака
        description: Если вы попадаете по существу атакой рукопашным оружием, вы можете потратить одну кость превосходства, чтобы попытаться причинить урон другому существу этой же атакой. Выберите другое существо в пределах 5 футов от первоначальной цели и в пределах вашей досягаемости. Если исходный бросок атаки попал бы по второму существу, оно получает урон, равный броску кости превосходства. Урон того же вида, что и для исходной атаки.
      - id: fighter.boevye-priemy.ataka-s-zahvatom
        name: Атака с захватом
        description: Сразу же после того, как вы попали рукопашной атакой оружием по существу в свой ход, вы можете потратить кость превосходства и бонусным действием попытаться взять существо в захват (правила захвата приведены в *«Книге игрока»*). Добавьте кость превосходства к вашей проверке Силы (Атлетика).
      - id: fighter.boevye-priemy.bystryj-brosok
        name: Быстрый бросок
        description: Бонусным действием вы можете потратить кость превосходства и совершить дальнобойную атаку оружием со свойством «метательное». Вы можете вытащить метательное оружие частью этого действия. При попадании добавьте кость превосходства к броску урона.
      - id: fighter.boevye-priemy.gotovnost
        name: Готовность
        description: Когда существо, которое вы можете видеть, входит в пределы досягаемости вашего рукопашного оружия, которое вы держите, вы можете реакцией потратить кость превосходства и совершить одну атаку по этому существу, используя это оружие. Если атака попадает по цели, добавьте кость превосходства к урону.
      - id: fighter.boevye-priemy.zasada
        name: Засада
        description: Когда вы совершаете проверку Ловкости (Скрытность) или бросок инициативы, вы можете потратить кость превосходства и добавить выпавшее на ней значение к броску. Вы можете сделать это, только если не являетесь недееспособным.
      - id: fighter.boevye-priemy.komandirskij-napor
        name: Командирский напор
        description: Когда вы совершаете проверку Харизмы (Запугивание, Выступление или Убеждение), вы можете потратить кость превосходства и добавить выпавшее значение к проверке.
      - id: fighter.boevye-priemy.podmena
        name: Подмена
        description: |-
          В свой ход, когда вы находитесь в пределах 5 футов от существа, вы можете потратить одну кость превосходства и поменяться местами с этим существом, потратив при этом как минимум 5 футов передвижения. Существо должно быть согласно и не должно быть недееспособным. Это передвижение не провоцирует атак. 
          Бросьте кость превосходства. До начала вашего следующего хода вы или другое существо (на ваш выбор) получаете бонус к КД, равный выпавшему значению.
      - id: fighter.boevye-priemy.takticheskaya-ocenka
        name: Тактическая оценка
        description: Когда вы совершаете проверку Мудрости (Проницательность) или Интеллекта (История или Расследование), вы можете потратить кость превосходства и добавить выпавшее значение к проверке.
subclasses:
  - id: fighter.master-boevyh-iskusstv
    name: Мастер боевых искусств
    sources: *a1
    features:
      - id: fighter.master-boevyh-iskusstv.boevoe-prevoshodstvo
        name: Боевое превосходство
        level: 3
        subtitle: 3-й уровень, умение мастера боевых искусств
        description: |-
          Если вы выбираете этот архетип, вы изучаете приёмы, использующие специальные кости, называемые костями превосходства.

          **Приёмы.** Вы изучаете три приёма на ваш выбор. Большинство приёмов тем или иным образом усиливают атаку. Во время одной атаки вы можете использовать только один приём. Вы изучаете два дополнительных приёма при достижении 7-го, 10-го и 15-го уровней. Каждый раз, при изучении новых приёмов, вы можете также заменить один из известных вам приёмов на другой.

          **Кости превосходства.** У вас есть четыре кости превосходства. Это кости к8. Кости превосходства тратятся при использовании. Вы восполняете все потраченные кости в конце короткого или продолжительного отдыха.

          Вы получаете ещё по одной кости превосходства на 7-м и 15-м уровнях.

          **Спасброски.** Некоторые из ваших приёмов требуют от цели спасброска, чтобы избежать эффекта приёма. Сложность такого спасброска рассчитывается следующим образом:

          **Сложность спасброска приёма** = 8 + ваш бонус мастерства + ваш модификатор Силы или Ловкости (на ваш выбор)
      - id: fighter.master-boevyh-iskusstv.uchenik-vojny
        name: Ученик войны
        level: 3
        subtitle: 3-й уровень, умение мастера боевых искусств
        description: Вы осваиваете владение одним из ремесленных инструментов на ваш выбор.
      - id: fighter.master-boevyh-iskusstv.poznaj-svoego-vraga
        name: Познай своего врага
        level: 7
        subtitle: 7-й уровень, умение мастера боевых искусств
        description: |-
          Если вы потратите как минимум 1 минуту, рассматривая, или по другому взаимодействуя с существом вне боя, вы можете узнать некоторую информацию о его способностях в сравнении с вашими. Мастер сообщит вам, равняется ли существо, превосходит или уступает вам в двух характеристиках на ваш выбор из перечисленных:

          - Значение Силы
          - Значение Ловкости
          - Значение Телосложения
          - Класс Доспеха
          - Текущие хиты
          - Общее количество уровней (если есть)
          - Количество уровней в классе Воин (если есть)
      - id: fighter.master-boevyh-iskusstv.uluchshennoe-boevoe-prevoshodstvo
        name: Улучшенное боевое превосходство
        level: 10
        subtitle: 10-й уровень, умение мастера боевых искусств
        description: Ваша кость превосходства увеличивается до к10. На 18-м уровне — до к12.
      - id: fighter.master-boevyh-iskusstv.neoslabevayuschij
        name: Неослабевающий
        level: 15
        subtitle: 15-й уровень, умение мастера боевых искусств
        description: Если вы совершаете бросок инициативы, не имея костей превосходства, вы получаете одну.
  - id: fighter.misticheskij-rycar
    name: Мистический рыцарь
    sources: *a1
    features:
      - id: fighter.misticheskij-rycar.ispolzovanie-zaklinanij
        name: Использование заклинаний
        level: 3
        subtitle: 3-й уровень, умение мистического рыцаря
        description: |-
          К своим воинским талантам вы добавляете возможность накладывать заклинания. Смотрите общие правила о заклинаниях и список заклинаний волшебника.

          **Заговоры.** Вы изучаете 2 **заговора** на свой выбор из списка заклинаний волшебника. Дополнительный заговор волшебника вы изучите на 10-м уровне.

          **Ячейки заклинаний.** Таблица заклинаний мистического рыцаря содержит информацию о количестве доступных вам ячеек заклинаний для накладывания заклинаний волшебника. Чтобы накладывать заклинание волшебника определённого уровня, вы должны потратить ячейку того же уровня или выше. Все потраченные ячейки заклинаний вы восстанавливаете после окончания продолжительного отдыха.

          Например, если вы знаете заклинание 1-го уровня щит [shield] и имеете ячейки 1-го и 2-го уровней, вы можете наложить это заклинание, использовав любую из этих ячеек.

          **Известные заклинания первого и более высоких уровней.** Вы знаете три **заклинания** 1-го уровня из списка волшебника на свой выбор, два из которых должны принадлежать к школам Воплощения и Ограждения.

          Колонка «известные заклинания» в таблице показывает, когда вы сможете выучить новые заклинания волшебника. Все эти заклинания должны принадлежать школам Воплощения или Ограждения, и не должны превышать уровень доступных вам ячеек заклинаний. Например, при достижении 7 уровня в этом классе вы можете выучить новое заклинание 1-го или 2-го уровня.

          Заклинания, которые вы выучите на 8-м, 14-м и 20-м уровнях, могут принадлежать любой школе магии.

          Каждый раз, получая уровень в этом классе, вы можете заменить одно из заклинаний волшебника, известное вам, другим по вашему выбору. Новое заклинание должно быть из списка доступных волшебнику, у вас должны быть ячейки соответствующего уровня, и заклинание должно принадлежать школам Воплощения или Ограждения, кроме случаев, когда вы заменяете заклинания, полученные из любой школы на 3-м, 8-м, 14-м или 20-м уровнях.

          **Базовая характеристика заклинаний.** Интеллект является базовой характеристикой для ваших заклинаний, поскольку вы узнаёте заклинания посредством изучения и запоминания. Когда заклинание требует использовать базовую характеристику, вы используете Интеллект. Кроме того, вы используете модификатор Интеллекта при определении Сл спасбросков от ваших заклинаний волшебника и при броске атаки заклинаниями.

          **Сл спасброска** = 8 + ваш бонус мастерства + ваш модификатор Интеллекта

          **Модификатор броска атаки** = ваш бонус мастерства + ваш модификатор Интеллекта
      - id: fighter.misticheskij-rycar.svyaz-s-oruzhiem
        name: Связь с оружием
        level: 3
        subtitle: 3-й уровень, умение мистического рыцаря
        description: |-
          Вы узнаёте ритуал, позволяющий создать магическую связь между вами и одним оружием. Вы выполняете ритуал в течение 1 часа, и он может быть совершён в течение короткого отдыха. Оружие во время проведения ритуала должно находиться на доступном расстоянии от вас, и в конце вы должны прикоснуться к нему и создать связь.

          Как только вы привязали к себе оружие, вы не можете быть обезоруженным, пока не станете недееспособным. Если оружие находится на одном плане существования с вами, вы можете в свой ход бонусным действием призвать его, телепортируя себе в руку.

          У вас может быть не более двух привязанных оружий одновременно, и бонусным действием вы призываете их по одному. Если вы попытаетесь создать связь с третьим оружием, вам придётся разорвать связь с одним из первых двух.
      - id: fighter.misticheskij-rycar.boevaya-magiya
        name: Боевая магия
        level: 7
        subtitle: 7-й уровень, умение мистического рыцаря
        description: Если вы действием накладываете заговор, вы можете бонусным действием совершить одну атаку оружием.
      - id: fighter.misticheskij-rycar.misticheskij-udar
        name: Мистический удар
        level: 10
        subtitle: 10-й уровень, умение мистического рыцаря
        description: Вы узнаёте, как с помощью удара оружием снизить сопротивляемость цели вашим заклинаниям. Если вы попадаете по существу атакой оружием, это существо совершает следующий спасбросок от вашего заклинания, использованного до конца вашего следующего хода, с помехой.
      - id: fighter.misticheskij-rycar.volshebnyj-ryvok
        name: Волшебный рывок
        level: 15
        subtitle: 15-й уровень, умение мистического рыцаря
        description: Вы получаете возможность телепортироваться на 30 футов в свободное пространство, которое вы видите, когда используете «Всплеск действий». Вы можете телепортироваться до или после дополнительного действия.
      - id: fighter.misticheskij-rycar.uluchshennaya-boevaya-magiya
        name: Улучшенная боевая магия
        level: 18
        subtitle: 18-й уровень, умение мистического рыцаря
        description: Если вы действием накладываете заклинание, вы можете бонусным действием совершить одну атаку оружием.
  - id: fighter.chempion
    name: Чемпион
    sources: *a1
    features:
      - id: fighter.chempion.uluchshennye-kriticheskie-popadaniya
        name: Улучшенные критические попадания
        level: 3
        subtitle: 3-й уровень, умение чемпиона
        description: Ваши атаки оружием совершают критическое попадание при выпадении «19» или «20» на кости атаки.
      - id: fighter.chempion.vydayuschijsya-atlet
        name: Выдающийся атлет
        level: 7
        subtitle: 7-й уровень, умение чемпиона
        description: |-
          Вы можете добавлять половину бонуса мастерства, округлённую в большую сторону, ко всем проверкам Силы, Ловкости или Телосложения, куда этот бонус еще не включён.

          Кроме того, если вы совершаете прыжок в длину с разбега, дальность прыжка увеличивается на количество футов, равное модификатору Силы.
      - id: fighter.chempion.dopolnitelnyj-boevoj-stil
        name: Дополнительный боевой стиль
        level: 10
        subtitle: 10-й уровень, умение чемпиона
        description: На 10 уровне вы можете выбрать второй боевой стиль.
      - id: fighter.chempion.prevoshodnye-kriticheskie-popadaniya
        name: Превосходные критические попадания
        level: 15
        subtitle: 15-й уровень, умение чемпиона
        description: Ваши атаки оружием совершают критическое попадание при выпадении «18–20» на кости атаки.
      - id: fighter.chempion.ucelevshij
        name: Уцелевший
        level: 18
        subtitle: 18-й уровень, умение чемпиона
        description: Вы достигаете вершин стойкости в бою. В начале каждого своего хода вы восстанавливаете количество хитов, равное 5 + ваш модификатор Телосложения, если количество ваших хитов не превышает половины от максимума. Это умение не работает, если у вас 0 хитов.
  - id: fighter.rycar-purpurnogo-drakona
    name: Рыцарь Пурпурного дракона
    sources:
      - code: SCAG
        book: Sword Coast Adventurer’s Guide
    features:
      - id: fighter.rycar-purpurnogo-drakona.splochayuschij-krik
        name: Сплочающий крик
        level: 3
        subtitle: 3-й уровень, умение рыцаря пурпурного дракона
        description: |-
          Вы изучаете приёмы, позволяющие вдохновить ваших союзников на сражение, не смотря на былые ранения.

          Когда вы используете «Второе дыхание», вы можете выбрать до трёх союзных существ в пределах 60 футов от вас. Каждый из них восстанавливает количество хитов равное вашему уровню воина, при условии, что существо может вас видеть и слышать.
      - id: fighter.rycar-purpurnogo-drakona.poslannik-korony
        name: Посланник короны
        level: 7
        subtitle: 7-й уровень, умение рыцаря пурпурного дракона
        description: |-
          Рыцари Пурпурного Дракона служат посланниками короны Кормира. Предполагается, что рыцари высокого положения будут вести себя достойно.

          Вы получаете владение навыком Убеждение. Если вы уже владеете этим навыком, выберите владение в одном из следующих навыков: Уход за животными, Проницательность, Запугивание или Выступление.

          Ваш бонус владения удваивается при любой проверке характеристики, использующей Убеждение. Вы сохраняете выгоду от этого умения вне зависимости от навыка, которым вы овладели, используя это умение.
      - id: fighter.rycar-purpurnogo-drakona.vdohnovlyayuschij-vsplesk
        name: Вдохновляющий всплеск
        level: 10
        subtitle: 10-й уровень, умение рыцаря пурпурного дракона
        description: |-
          При использовании «Всплеска действий», вы можете выбрать одно союзное существо в пределах 60 футов от вас. Это существо может совершить рукопашную или дальнобойную атаку оружием за действие реакции, при условии, что существо вас слышит и видит.

          Начиная с 18-го уровня, вы можете выбрать двух союзников в пределах 60 футов, вместо одного.
      - id: fighter.rycar-purpurnogo-drakona.oplot
        name: Оплот
        level: 15
        subtitle: 15-й уровень, умение рыцаря пурпурного дракона
        description: Вы можете распространить выгоды от вашего умения «Упорный» на союзников. Когда вы решите использовать умение «Упорный», чтобы перебросить спасбросок Интеллекта, Мудрости или Харизмы и не являетесь недееспособным, вы можете выбрать союзника в пределах 60 футов от вас, который провалил спасбросок против подобного эффекта. Если существо может видеть или слышать вас, оно может перебросить спасбросок и обязано использовать новый результат.
  - id: fighter.kavalerist
    name: Кавалерист
    sources:
      - code: XGE
        book: Xanathar’s Guide to Everything
    features:
      - id: fighter.kavalerist.dopolnitelnye-vladeniya
        name: Дополнительные владения
        level: 3
        subtitle: 3-й уровень, умение кавалериста
        description: |-
          Вы получаете владение одним из следующих навыков по вашему выбору: Выступление, История, Проницательность, Убеждение или Уход за животными.

          В качестве альтернативы вы можете выучить один язык по вашему выбору.
      - id: fighter.kavalerist.nepokolebimaya-metka
        name: Непоколебимая метка
        level: 3
        subtitle: 3-й уровень, умение кавалериста
        description: |-
          Вы можете угрожать врагам, мешая их атакам и наказывая их за вред другим. Когда вы попадаете по существу рукопашной атакой оружием, вы можете пометить это существо до конца вашего следующего хода.

          Эффект метки заканчивается, если вы становитесь недееспособным или умираете, или же если кто-то еще отметит эту цель. Пока отмеченное существо находится в пределах 5 футов от вас, оно совершает с помехой броски атак, целью которых не являетесь вы.

          Кроме того, если отмеченное существо наносит урон кому угодно, кроме вас, вы можете совершить особую рукопашную атаку оружием против помеченного существа бонусным действием в свой следующий ход.

          Эту атаку вы совершаете с преимуществом, при попадании нанося дополнительный урон, равный половине вашего уровня воина.

          Независимо от количества существ, которых вы отметили, вы можете совершить эту специальную атаку количество раз, равное модификатору вашей Силы (минимум один), и восстанавливаете все потраченные атаки, после окончания продолжительного отдыха.
      - id: fighter.kavalerist.rozhdennyj-v-sedle
        name: Рожденный в седле
        level: 3
        subtitle: 3-й уровень, умение кавалериста
        description: |-
          Ваше мастерство всадника становится очевидным. Вы совершаете с преимуществом спасброски, чтобы избежать падения с вашего скакуна.

          Если вы падаете со скакуна и приземляетесь в пределах 10 футов, то вы приземляетесь на ноги, если не становитесь недееспособным.

          И наконец, забраться в седло и спешиться стоит вам всего 5 футов передвижения, а не половину скорости.
      - id: fighter.kavalerist.zaschitnyj-manevr
        name: Защитный маневр
        level: 7
        subtitle: 7-й уровень, умение кавалериста
        description: |-
          Вы учитесь отражать удары, направленные на вас, вашего скакуна или других существ поблизости.

          Если по вам или по другому существу в пределах 5 футах от вас, которое вы можете видеть, попадают атакой, вы можете реакцией бросить 1к8, если в данный момент вооружены рукопашным оружием или носите щит. Результат броска добавляется к КД цели против этой атаки.

          Если атака все равно попадает, цель имеет сопротивление урону от этой атаки.

          Вы можете использовать это умение количество раз, равное вашему модификатору Телосложения (минимум один), и восстанавливаете все потраченные использования после окончания продолжительного отдыха.
      - id: fighter.kavalerist.derzhat-stroj
        name: Держать строй
        level: 10
        subtitle: 10-й уровень, умение кавалериста
        description: Вы становитесь мастером сдерживания своих противников. Вы можете совершить провоцированную атаку, если враждебное существо перемещается на 5 футов и более, оставаясь в пределах досягаемости. Для этого вы реакцией совершаете одну рукопашную атаку по спровоцировавшему существу, и если вы попадаете по нему такой атакой, его скорость уменьшается до 0 до конца текущего хода.
      - id: fighter.kavalerist.svirepyj-natisk
        name: Свирепый натиск
        level: 15
        subtitle: 15-й уровень, умение кавалериста
        description: |-
          Вы можете сбивать своих врагов, независимо от того, на скакуне вы или нет.

          Если перед атакой существа вы двигаетесь не менее 10 футов по прямой линии, а затем попадаете атакой, существо должно преуспеть в спасброске Силы (Сл = 8 + ваш бонус мастерства + ваш модификатор Силы), иначе будет сбито с ног.

          Вы можете использовать это умение только один раз за ход.
      - id: fighter.kavalerist.bditelnyj-zaschitnik
        name: Бдительный защитник
        level: 18
        subtitle: 18-й уровень, умение кавалериста
        description: |-
          Вы реагируете на опасность с чрезвычайной бдительностью. В бою вы получаете особую реакцию, которую вы можете использовать один раз за ход каждого существа, кроме вас самих.

          Вы можете использовать эту реакцию только чтобы совершить провоцированную атаку и не можете использовать её в тот же ход, когда использовали свою нормальную реакцию.
  - id: fighter.misticheskij-luchnik
    name: Мистический лучник
    sources:
      - code: XGE
        book: Xanathar’s Guide to Everything
    features:
      - id: fighter.misticheskij-luchnik.znaniya-misticheskogo-luchnika
        name: Знания мистического лучника
        level: 3
        subtitle: 3-й уровень, умение мистического лучника
        description: Вы учите некоторые природные секреты и магическую теорию – типичные для практиков этой военной эльфийской традиции. Вы получаете владение, по вашему выбору, навыком Магия или Природа, а также учите заговор фокусы [prestidigitation] или искусство друидов [druidcraft] .
      - id: fighter.misticheskij-luchnik.magicheskij-vystrel
        name: Магический выстрел
        level: 3
        subtitle: 3-й уровень, умение мистического лучника
        description: |-
          Вы учитесь высвобождать особые магические эффекты вместе с некоторыми своими выстрелами в бою. Когда вы получаете это умение, вы учите два варианта магического выстрела по своему выбору (см. «Варианты Магического выстрела» ниже).

          Раз в ход, когда вы выпускаете стрелу из своего короткого или длинного лука в качестве части действия Атака, вы можете применить один из своих вариантов магического выстрела к этой стреле.

          Вы решаете, применять ли эту способность, после успешного попадания стрелой в существо, кроме случаев, когда выбранный вариант не требует броска атаки.

          У вас есть два использования этой способности, и вы восстанавливаете все потраченные использования после окончания короткого или продолжительного отдыха.

          Вы выбираете дополнительный вариант магического выстрела, когда достигаете определенных уровней в этом классе: 7-го, 10-го, 15-го, 18-го.

          Каждый вариант улучшается, когда вы становитесь воином 18-го уровня.
      - id: fighter.misticheskij-luchnik.zacharovannaya-strela
        name: Зачарованная стрела
        level: 7
        subtitle: 7-й уровень, умение мистического лучника
        description: |-
          Вы получаете способность заряжать стрелы магией.

          Когда вы стреляете немагической стрелой из короткого или длинного лука, вы можете сделать её магической с целью преодоления сопротивления и иммунитета к не магическим атакам и урону. Магия угасает в стреле сразу же после попадания или промаха по цели.
      - id: fighter.misticheskij-luchnik.stranstvuyuschaya-strela
        name: Странствующая стрела
        level: 7
        subtitle: 7-й уровень, умение мистического лучника
        description: Вы учитесь направлять сбившуюся стрелу к новой цели. Когда вы делаете бросок атаки магической стрелой и промахиваетесь, вы можете бонусным действием перебросить бросок атаки по другой цели, находящейся в пределах 60 футов от изначальной цели.
      - id: fighter.misticheskij-luchnik.vystrel-vsegda-nagotove
        name: Выстрел всегда наготове
        level: 15
        subtitle: 15-й уровень, умение мистического лучника
        description: Ваше магическое мастерство всегда наготове в начале битвы. Если вы совершаете бросок инициативы, и у вас не осталось использований магического выстрела, вы восстанавливаете одно использование.
      - id: fighter.misticheskij-luchnik.varianty-magicheskogo-vystrela
        name: Варианты магического выстрела
        description: |-
          Умение «Магический выстрел» позволяет вам выбирать его варианты на определённых уровнях. В этом разделе представлены варианты в алфавитном порядке. Все эти эффекты магические, и каждый ассоциируется с одной из школ магии.

          Если вариант предполагает спасбросок, то ваша Сл Магического выстрела равна 8 + ваш бонус мастерства + модификатор Интеллекта.

          **Взрывная стрела.**Вы наделяете вашу стрелу энергией силы, взятой из школы Воплощения. Эта энергия детонирует после вашей атаки. Сразу же после того, как стрела попадает по существу, цель и все остальные существа в радиусе 10 футов от неё получает 2к6 урона силовым полем каждое.

          Урон силовым полем увеличивается до 4к6, когда вы достигаете 18-го уровня в этом классе.

          **Изгоняющая стрела.** Вы используете магию Ограждения, чтобы временно изгнать свою цель в безвредное место в Стране Фей. Существо, в которое попала стрела, должно преуспеть в спасброске Харизмы, иначе оно будет изгнано. Будучи изгнанным, существо становится недееспособным и его скорость равна 0. В конце своего следующего хода цель появляется в месте, которое занимала, или ближайшем незанятом месте.

          После достижения 18-го уровня в этом классе цель также получает 2к6 урона силовым полем, когда по ней попадает стрела.

          **Ищущая стрела.** Используя магию Прорицания, вы даруете своей стреле способность искать цель. Когда вы используете этот вариант, вы не совершаете бросок атаки. Вместо этого, выберите одно существо, которое вы видели за прошедшую минуту. Стрела летит к этому существу, огибает углы, если нужно, и игнорирует укрытие на половину и укрытие на три четверти.

          Если цель находится в радиусе досягаемости оружия, и если есть путь, по которому стрела может добраться до цели, то цель должна совершить спасбросок Ловкости. Иначе стрела исчезает, пролетев столько, сколько смогла. При провале цель получает урон, как будто в неё попала стрела, плюс дополнительные 1к6 урона силовым полем, и вы узнаёте, где сейчас находится цель. При успешном спасброске цель получает половину урона, и вы не узнаёте, где она находится.

          Урон силовым полем увеличивается до 2к6 когда вы достигаете 18-го уровня в этом классе.

          **Обманная стрела.** Ваша магия Очарования заставляет выпущенную стрелу временно запутать свою цель. Существо, в которое попала эта стрела, получает дополнительно 2к6 урона психической энергией. Выберите одного из ваших союзников в пределах 30 футов от цели. Цель должна преуспеть в спасброске Мудрости, иначе будет очарована выбранным союзником до начала вашего следующего хода. Этот эффект заканчивается раньше, если выбранный союзник атакует очарованную цель, нанесет ей урон или заставит совершить спасбросок.

          Психический урон увеличивается до 4к6, когда вы достигаете 18-го уровня в этом классе.

          **Ослабляющая стрела.** Вы вплетаете магию Некромантии в вашу стрелу.

          Существо, по которому попала стрела, получает дополнительно 2к6 урона некротической энергией. Цель должна также преуспеть в спасброске Телосложения, иначе урон, наносимый её атаками оружием, уменьшается в два раза до начала вашего следующего хода.

          Некротический урон увеличивается до 4к6, когда вы достигаете 18-го уровня в этом классе.

          **Пронзающая стрела.** Вы используете магию Преобразования, чтобы придать стреле свойство бесплотности. Когда вы используете этот вариант, вы не совершаете бросок атаки. Вместо этого стрела летит по линии в 1 фут шириной и 30 футов длиной, до того как исчезнуть. Стрела проходит сквозь объекты беспрепятственно, игнорируя укрытия. Каждое существо на этой линии должно совершить спасбросок Ловкости. При провале существо получает урон, как будто стрела попала по нему, плюс дополнительные 1к6 колющего урона. При успешном спасброске цель получает половину этого урона.

          Колющий урон увеличивается до 2к6, когда вы достигаете 18-го уровня в этом классе.

          **Сжимающая стрела.** Когда эта стрела попадает по цели, магия Вызова создаёт хватающие ядовитые колючие кусты, которые обвивают цель. Существо, по которому попала стрела, получает дополнительно 2к6 урона ядом, его скорость уменьшается на 10 футов и оно получает 2к6 рубящего урона каждый ход, когда оно в первый раз за ход сдвигается на 1 фут или больше без телепортации.

          Цель или любое существо, которое может дотянуться до цели, может действием убрать кусты с помощью успешной проверки Силы (Атлетика) против Сл спасброска вашего магического выстрела. В противном случае кусты существуют в течение 1 минуты либо пока вы снова не используете этот вариант.

          Урон ядом и рубящий урон оба увеличиваются до 4к6, когда вы достигаете 18-го уровня в этом классе.

          **Теневая стрела.** Вы вплетаете магию Иллюзии в свою стрелу, которая заслоняет зрение врага тенями. Существо, в которое попала стрела, получает дополнительно 2к6 урона психической энергией и должно преуспеть в спасброске Мудрости, иначе не сможет видеть далее 5 футов до начала вашего следующего хода.

          Урон психической энергией увеличивается до 4к6 когда вы достигаете 18-го уровня в этом классе.
