id: warlock
name: Колдун
name_en: Warlock
source_url: https://dnd.su/class/104-warlock/
sources: &a1
  - code: PH14
    book: Player's Handbook
features:
  - id: warlock.potustoronnij-pokrovitel
    name: Потусторонний покровитель
    level: 1
    subtitle: 1-й уровень, умение колдуна
    description: Вы заключаете сделку с потусторонним существом на ваш выбор. Подробности всех покровителей смотрите ниже. Ваш выбор определит умения, предоставляемые вам на 1-м, 6-м, 10-м и 14-м уровнях.
  - id: warlock.magiya-dogovora
    name: Магия договора
    level: 1
    subtitle: 1-й уровень, умение колдуна
    description: |-
      Исследования тайн и магия, дарованная покровителем, дают вам возможность использовать заклинания. Вы найдёте список заклинаний, доступных колдуну в этом разделе: **заклинания колдуна.** Так же правила по использованию заклинаний есть в этой статье: *использование заклинаний*.

      **Заговоры (заклинания 0-го уровня).** Вы знаете два **заговора** на свой выбор из списка заклинаний колдуна. Вы узнаёте дополнительные заговоры колдуна на более высоких уровнях, как показано в колонке «Известные заговоры».

      **Ячейки заклинаний.** Таблица «Колдун» показывает, какое количество ячеек для накладывания заклинаний колдуна с 1-го по 5-й уровень у вас есть, а также уровень этих ячеек — все ваши ячейки заклинаний одного уровня. Для накладывания одного из заклинаний колдуна 1-го уровня и выше вы должны потратить ячейку заклинаний. Вы восстановите все потраченные ячейки, когда завершите короткий или продолжительный отдых.

      Например, если ваш персонаж 5-го уровня, у вас есть две ячейки заклинаний 3-го уровня. Чтобы использовать заклинание 1-го уровня ведьмин снаряд [witch bolt] вы должны потратить одну из этих ячеек, и заклинание сработает как заклинание 3-го уровня.

      **Известные заклинания первого и более высоких уровней.** На 1-м уровне вы знаете два заклинания 1-го уровня по своему выбору из списка заклинаний колдуна.

      Колонка «Известные заклинания» показывает, когда вы сможете выучить новые заклинания 1-го уровня и выше. Уровень заклинания, которое вы выбрали, не должен превышать уровень ячеек, указанный в таблице для колдуна вашего уровня. Например, когда вы получите 6-й уровень, вы изучите новое заклинание колдуна, которое может быть 1-го, 2-го или 3-го уровней.

      Кроме того, когда вы получаете уровень в этом классе, вы можете выбрать одно из известных вам заклинаний колдуна и заменить его другим заклинанием из списка заклинаний колдуна, с уровнем, не превышающим уровень ячеек заклинаний.

      **Базовая характеристика заклинаний.** При накладывании заклинаний колдун использует Харизму. Вы используете Харизму в случаях, когда заклинание ссылается на базовую характеристику. Кроме того, вы используете модификатор Харизмы при определении Сл спасбросков от ваших заклинаний колдуна, и при броске атаки заклинаниями.

      **Сл спасброска** = 8 + ваш бонус мастерства + ваш модификатор Харизмы

      **Модификатор броска атаки** = ваш бонус мастерства + ваш модификатор Харизмы

      **Фокусировка заклинания.** Вы можете использовать магическую фокусировку в качестве заклинательной фокусировки для заклинаний колдуна.
  - id: warlock.dopolnitelnye-zaklinaniya-kolduna
    name: Дополнительные заклинания колдуна
    level: 1
    subtitle: 1-й уровень, опциональное умение колдуна
    description: |-
      Заклинания из представленного ниже списка расширяют ваш список заклинаний колдуна, представленный в «*Книге игрока*». Список отсортирован по уровню заклинаний, а не по уровню персонажа.

      | Уровень
      заклинания | Заклинание |
      | Заговор | вспышка мечей [sword burst], громовой клинок [booming blade], клинок зеленого пламени [green-flame blade], лассо молнии [lightning lure], расщепление разума [mind sliver] |
      | 3 | покров духа [spirit shroud], крепость интеллекта [intellect fortress], призыв духа нежити [summon undead], призыв духа тени [summon shadowspawn], призыв духа феи [summon fey] |
      | 4 | призыв духа аберрации [summon aberration] |
      | 5 | круг телепортации [teleportation circle], планарные узы [planar binding], фальшивый двойник [mislead] |
      | 6 | призыв духа исчадия [summon fiend], потусторонний облик Таши [Tasha’s otherwordly guise] |
      | 7 | сон синей вуали [dream of the blue veil] |
      | 9 | врата [gate], клинок разрушения [blade of disaster], смертный ужас [weird] |
  - id: warlock.tainstvennye-vozzvaniya
    name: Таинственные воззвания
    level: 2
    subtitle: 2-й уровень, умение колдуна
    description: |-
      В процессе изучения оккультных знаний вы раскопали таинственные воззвания: фрагменты запрещенных знаний, которые даруют магические способности.

      Вы получаете два воззвания на свой выбор. Смотрите список воззваний. Получая новые уровни колдуна, вы получаете дополнительные воззвания на свой выбор, как показано в колонке «известные воззвания».

      Кроме того, когда вы получаете новый уровень этого класса, вы можете выбрать одно известное вам воззвание и заменить его другим, которое вы способны выучить на этом уровне.
  - id: warlock.predmet-dogovora
    name: Предмет договора
    level: 3
    subtitle: 3-й уровень, умение колдуна
    description: "Потусторонний покровитель дарует вам подарок за верную службу. Вы получаете одно из следующих умений на выбор:"
    options:
      - id: warlock.predmet-dogovora.dogovor-grimuara
        name: Договор гримуара
        description: |-
          Ваш покровитель дарует вам гримуар, который называется «Книга теней». Когда вы получаете это умение, выберите 3 заговора из списков любых классов. Пока книга с вами, вы можете применять эти заговоры неограниченно. Они не учитываются при подсчёте максимального числа заговоров, которые вы можете знать, и считаются для вас заклинаниями колдуна.

          Если вы теряете книгу, вам нужно провести ритуал длительностью в 1 час, чтобы получить замену от своего покровителя. Вы можете провести этот ритуал во время короткого или продолжительного отдыха. Предыдущая книга при этом уничтожается. Книга обращается в прах при вашей смерти.
      - id: warlock.predmet-dogovora.dogovor-klinka
        name: Договор клинка
        description: |-
          Вы можете действием создать оружие договора в своей пустой руке. Каждый раз вы сами выбираете, какое именно рукопашное оружие вы создаёте. Вы получаете владение этим оружием, пока используете его. Оружие считается магическим при определении преодоления сопротивления и иммунитета от немагических атак и урона.

          Оружие договора исчезает, если оно в течение 1 минуты находится дальше 5 футов от вас. Оно также исчезает, если вы используете это умение еще раз, отзываете оружие (действие не требуется), или умираете. Вы можете трансформировать одно магическое оружие в своё оружие договора, проведя специальный ритуал, держа это оружие. Ритуал совершается 1 час, его можно провести во время короткого отдыха. Впоследствии вы можете отозвать оружие, помещая его между измерениями. Оно будет появляться в руке, когда вы будете в дальнейшем создавать оружие договора. Вы не можете сделать это с артефактом или разумным оружием. Оружие перестаёт быть оружием договора, когда вы умираете, выполняете часовой ритуал с другим оружием или когда вы исполните ритуал длиной в час для того, чтобы разорвать связь. Оружие материализуется у ваших ног, если в момент разрыва связи оно находилось между измерениями.
      - id: warlock.predmet-dogovora.dogovor-talismana
        name: Договор талисмана
        description: |-
          *Опциональный вариант договора*

          Ваш покровитель даровал вам уникальный амулет — талисман, который может помогать как вам, так и тому, кто носит его, в момент нужды. Когда носитель этого талисмана проваливает проверку характеристики, он может бросить к4 и прибавить выпавшее значение к проверке. Это преимущество можно использовать количество раз, равное вашему бонусу мастерства, и все потраченные использования восстанавливаются после окончания продолжительного отдыха.

          Если вы теряете талисман, вы можете провести 1-часовую церемонию и получить замену от своего покровителя. Церемония может быть проведена в течение короткого или продолжительного отдыха, после чего утерянный амулет уничтожается. Когда вы умираете, талисман обращается в пепел.
      - id: warlock.predmet-dogovora.dogovor-cepi
        name: Договор цепи
        description: |-
          Вы узнаёте заклинание поиск фамильяра [find familiar] и можете сотворять его как ритуал. Это заклинание не учитывается при подсчёте числа заклинаний, которые вы можете знать.

          Когда вы накладываете это заклинание, вы можете выбрать один из обычных обликов для вашего фамильяра либо один из особых обликов: бес [imp], квазит [quasit], псевдодракон [pseudodragon] или спрайт [sprite].

          Кроме того, когда вы совершаете действие Атака, вы можете вместо одной своей атаки позволить атаковать один раз фамильяру. При этом он совершает свою атаку реакцией.
  - id: warlock.vash-predmet-dogovora
    name: Ваш Предмет договора
    description: |-
      Каждый вариант предмета договора создаёт особое существо или предмет, отражающий природу вашего покровителя.

      **Договор гримуара**. Ваша «Книга Теней» может быть изящным золочёным томом с заклинаниями очарования и иллюзий, дарованным высокомерной Архифеей. Она может быть тяжёлым, переплетённым в кожу демонов и отделанным железом томом, содержащим заклинания вызова и драгоценные, но запретные знания о зловещих уголках космоса. Таким может быть дар Исчадия. Или это может быть изорванный дневник безумца, коснувшегося разума Великого Древнего. Этот дневник содержит обрывки заклинаний, понять которые позволяет только ваше собственное растущее безумие.

      **Договор клинка**. Если вашим покровителем является Архифея, ваше оружие может быть узким клинком, покрытым лозами. Если вы служите Исчадию, вашим оружием может быть топор из чёрного металла, украшенный декоративными языками пламени. Если ваш покровитель — Великий Древний, вашим оружием может стать древнее копьё с самоцветом в наконечнике, выглядящим как ужасный, немигающий глаз.

      **Договор цепи**. Ваш фамильяр смышлёнее чем обычные. Его основной облик может отражать сущность вашего покровителя. Так, спрайт [sprite] или псевдодракон [pseudodragon] относится к Архифее, а бес [imp] или квазит [quasit] к Исчадию. Поскольку сущность Великого Древнего не поддаётся пониманию, ему подходит фамильяр с любым обликом.
    level: 3
  - id: warlock.misticheskaya-universalnost
    name: Мистическая универсальность
    level: 4
    subtitle: 4-й уровень, опциональное умение колдуна
    description: |-
      Каждый раз, когда вы достигаете определённого уровня в этом классе, и получаете умение «Увеличение характеристик», вы можете сделать одно из следующих действий как отражение изменения фокуса в ваших оккультных практиках:

      - Замените один заговор, который вы узнали благодаря умению «Магия договора» этого класса, другим заговором из списка заклинаний колдуна.
      - Замените дар, полученный вами от умения «Предмет договора», на один из других даров, предлагаемых этим умением.
      - Если вы имеете 12-й уровень в этом классе или выше, замените одно заклинание от умения «Таинственный арканум» другим заклинанием колдуна того же уровня.

      Если это изменение делает вас непригодным для любого из ваших таинственных воззваний, вы незамедлительно должны заменить его, выбрав то воззвание, для которого вы подходите.
  - id: warlock.tainstvennyj-arkanum
    name: Таинственный арканум
    level: 11
    subtitle: 11-й уровень, умение колдуна
    description: |-
      Ваш покровитель дарует вам магический секрет, называемый арканумом. Выберите одно заклинание 6-го уровня из списка заклинаний колдуна в качестве арканума.

      Вы можете наложить это заклинание, не используя ячейку заклинаний. Вы должны окончить продолжительный отдых, чтобы сделать это еще раз.

      На следующих уровнях вы получаете новые заклинания, которые можно применить таким образом — одно 7-го уровня на 13-м уровне, одно 8-го уровня на 15-м уровне и одно 9-го уровня на 17-м уровне. После окончания продолжительного отдыха вы восстанавливаете все потраченные использования арканумов.
  - id: warlock.tainstvennyj-master
    name: Таинственный мастер
    level: 20
    subtitle: 20-й уровень, умение колдуна
    description: Вы можете обратиться к внутреннему резерву мистической силы, умоляя при этом покровителя восстановить потраченные ячейки заклинаний. Вам надо потратить 1 минуту, умоляя покровителя, чтобы восстановить все использованные ячейки заклинаний, дарованные умением «Магия договора». Вы должны закончить продолжительный отдых, чтобы применить это умение вновь.
lists:
  - id: warlock.tainstvennye-vozzvaniya
    name: Таинственные воззвания
    entries:
      - id: warlock.tainstvennye-vozzvaniya.vedmachij-vzor
        name: Ведьмачий взор
        prerequisite: 15-й уровень колдуна
        level: 15
        description: Вы можете видеть истинный облик всех перевёртышей и существ, скрытых магией школы Иллюзия или Преобразование, и находящихся в вашей линии обзора, и при этом в пределах 30 футов от вас.
      - id: warlock.tainstvennye-vozzvaniya.vzor-dvuh-umov
        name: Взор двух умов
        description: Вы можете действием коснуться согласного Гуманоида и до конца своего следующего хода воспринимать всё его чувствами. Пока существо находится на том же плане существования, что и вы, вы можете в последующие ходы действием продлевать эту связь до конца своего следующего хода. При восприятии чувствами другого существа, вы получаете все преимущества от особых чувств, которыми обладает это существо, а сами при этом слепы и глухи для своего окружения.
      - id: warlock.tainstvennye-vozzvaniya.videniya-dalekih-korolevstv
        name: Видения далёких королевств
        prerequisite: 15-й уровень колдуна
        level: 15
        description: Вы можете неограниченно накладывать заклинание магический глаз [arcane eye], не тратя ячейки заклинаний.
      - id: warlock.tainstvennye-vozzvaniya.vor-pyati-sudeb
        name: Вор пяти судеб
        description: Вы можете один раз наложить заклинание *порча [bane]*, используя ячейку заклинаний колдуна. Вы не можете сделать это повторно, пока не окончите продолжительный отдых.
      - id: warlock.tainstvennye-vozzvaniya.voshodyaschij-shag
        name: Восходящий шаг
        prerequisite: 9-й уровень колдуна
        level: 9
        description: Вы можете неограниченно накладывать на себя заклинание левитация [levitate], не тратя ячейки заклинаний и материальные компоненты.
      - id: warlock.tainstvennye-vozzvaniya.glaza-hranitelya-run
        name: Глаза хранителя рун
        description: Вы можете читать любые письмена.
      - id: warlock.tainstvennye-vozzvaniya.glas-cepnogo-mastera
        name: Глас цепного мастера
        prerequisite: умение «Договор цепи»
        description: Вы можете телепатически общаться со своим фамильяром и воспринимать всё чувствами фамильяра, пока вы находитесь на одном и том же плане существования. Кроме того, когда вы воспринимаете чувствами фамильяра, вы можете говорить через него своим собственным голосом, даже если фамильяр не способен говорить.
      - id: warlock.tainstvennye-vozzvaniya.dospeh-tenej
        name: Доспех теней
        description: Вы можете неограниченно накладывать на себя заклинание доспехи мага [mage armor], не тратя ячейки заклинаний и материальные компоненты.
      - id: warlock.tainstvennye-vozzvaniya.dyavolskij-vzglyad
        name: Дьявольский взгляд
        description: Вы можете нормально видеть в темноте, как магической, так и немагической, на расстоянии 120 футов.
      - id: warlock.tainstvennye-vozzvaniya.zhazhduschij-klinok
        name: Жаждущий клинок
        prerequisite: 5-й уровень колдуна, умение «Договор клинка»
        level: 5
        description: Вы можете атаковать своим оружием договора два раза вместо одного, когда в свой ход используете действие Атака.
      - id: warlock.tainstvennye-vozzvaniya.zhivotnaya-rech
        name: Животная речь
        description: Вы можете неограниченно накладывать заклинание разговор с животными [speak with animals], не тратя ячейки заклинаний.
      - id: warlock.tainstvennye-vozzvaniya.zavorazhivayuschij-shepot
        name: Завораживающий шёпот
        prerequisite: 7-й уровень колдуна
        level: 7
        description: Вы можете один раз наложить заклинание *принуждение [compulsion]*, используя ячейку заклинаний колдуна. Вы не можете сделать это повторно, пока не окончите продолжительный отдых.
      - id: warlock.tainstvennye-vozzvaniya.znak-durnogo-predznamenovaniya
        name: Знак дурного предзнаменования
        prerequisite: 5-й уровень колдуна
        level: 5
        description: Вы можете один раз наложить заклинание *проклятие [bestow curse]*, используя ячейку заклинаний колдуна. Вы не можете сделать это повторно, пока не окончите продолжительный отдых.
      - id: warlock.tainstvennye-vozzvaniya.kniga-drevnih-sekretov
        name: Книга древних секретов
        prerequisite: умение «Договор гримуара»
        description: |-
          Теперь вы можете вписывать магические ритуалы в свою Книгу Теней. Выберите два заклинания 1-го уровня с ключевым словом «ритуал» из списков заклинаний любых классов. Эти заклинания появляются в книге и не учитываются в общем количестве заклинаний, которые вы можете знать. Держа Книгу Теней в руке, вы можете сотворять выбранные заклинания как ритуалы. Вы не можете накладывать заклинания иначе как ритуалом, если вы не узнали их иным способом. Вы также можете сотворять известные заклинания колдуна как ритуалы, если у них есть ключевое слово «ритуал».

          Во время приключений вы можете добавлять другие ритуальные заклинания в свою Книгу Теней. Когда вы найдёте такое заклинание, вы можете добавить его в книгу, если уровень заклинания не превышает половину вашего уровня колдуна (округляя в большую сторону) и если вы можете потратить время на переписывание заклинания. За каждый уровень заклинания время переписывания занимает 2 часа и стоит 50 золотых монет, которые должны быть потрачены на редкие чернила, необходимые для записи.
      - id: warlock.tainstvennye-vozzvaniya.maska-mnogih-lic
        name: Маска многих лиц
        description: Вы можете неограниченно накладывать заклинание маскировка [disguise self], не тратя ячейки заклинаний.
      - id: warlock.tainstvennye-vozzvaniya.master-beschislennyh-oblikov
        name: Мастер бесчисленных обликов
        prerequisite: 15-й уровень колдуна
        level: 15
        description: Вы можете неограниченно накладывать заклинание смена обличья [alter self], не тратя ячейки заклинаний.
      - id: warlock.tainstvennye-vozzvaniya.misticheskoe-kope
        name: Мистическое копьё
        prerequisite: заговор*мистический заряд [eldritch blast]
        description: Когда вы накладываете мистический заряд [eldritch blast], его дистанция равна 300 футам.
      - id: warlock.tainstvennye-vozzvaniya.mogilnyj-shepot
        name: Могильный шёпот
        prerequisite: 9-й уровень колдуна
        level: 9
        description: Вы можете неограниченно накладывать заклинание разговор с мёртвыми [speak with dead], не тратя ячейки заклинаний.
      - id: warlock.tainstvennye-vozzvaniya.mosch-ischadiya
        name: Мощь исчадия
        description: Вы можете неограниченно накладывать на себя заклинание псевдожизнь [false life] как заклинание 1-го уровня, не тратя ячейки заклинаний и материальные компоненты.
      - id: warlock.tainstvennye-vozzvaniya.muchitelnyj-vzryv
        name: Мучительный взрыв
        prerequisite: заговор мистический заряд [eldritch blast]
        description: Когда вы накладываете мистический заряд [eldritch blast], добавьте модификатор Харизмы к урону, причиняемому при попадании.
      - id: warlock.tainstvennye-vozzvaniya.obmanchivoe-vliyanie
        name: Обманчивое влияние
        description: Вы получаете владение навыками Обман и Убеждение.
      - id: warlock.tainstvennye-vozzvaniya.odin-sredi-tenej
        name: Один среди теней
        prerequisite: 5-й уровень колдуна
        level: 5
        description: Когда вы находитесь в области тусклого света или в темноте, вы можете действием стать невидимым, пока вы не переместитесь или не используете действие или реакцию.
      - id: warlock.tainstvennye-vozzvaniya.ottalkivayuschij-zaryad
        name: Отталкивающий заряд
        prerequisite: заговор мистический заряд [eldritch blast]
        description: Если вы попадаете по существу мистическим зарядом [eldritch blast], вы можете толкнуть его на 10 футов прочь от себя по прямой линии.
      - id: warlock.tainstvennye-vozzvaniya.potustoronnij-pryzhok
        name: Потусторонний прыжок
        prerequisite: 9-й уровень колдуна
        level: 9
        description: Вы можете неограниченно накладывать на себя заклинание прыжок [jump], не тратя ячейки заклинаний и материальные компоненты.
      - id: warlock.tainstvennye-vozzvaniya.pyuschij-zhizn
        name: Пьющий жизнь
        prerequisite: 12-й уровень колдуна, умение «Договор клинка»
        level: 12
        description: Когда вы попадаете по существу оружием договора, это существо получает дополнительный урон некротической энергией, равный вашему модификатору Харизмы (минимум 1).
      - id: warlock.tainstvennye-vozzvaniya.skulptor-ploti
        name: Скульптор плоти
        prerequisite: 7-й уровень колдуна
        level: 7
        description: Вы можете один раз наложить заклинание *превращение [polymorph]*, используя ячейку заклинаний колдуна. Вы не можете сделать это повторно, пока не окончите продолжительный отдых.
      - id: warlock.tainstvennye-vozzvaniya.slugi-haosa
        name: Слуги хаоса
        prerequisite: 9-й уровень колдуна
        level: 9
        description: Вы можете один раз наложить заклинание *призыв элементаля [conjure elemental]*, используя ячейку заклинаний колдуна. Вы не можете сделать это повторно, пока не окончите продолжительный отдых.
      - id: warlock.tainstvennye-vozzvaniya.tainstvennyj-vzglyad
        name: Таинственный взгляд
        description: Вы можете неограниченно накладывать заклинание обнаружение магии [detect magic], не тратя ячейки заклинаний.
      - id: warlock.tainstvennye-vozzvaniya.tryasina-razuma
        name: Трясина разума
        prerequisite: 5-й уровень колдуна
        level: 5
        description: Вы можете один раз наложить заклинание замедление [slow], используя ячейку заклинаний колдуна. Вы не можете сделать это повторно, пока не окончите продолжительный отдых.
      - id: warlock.tainstvennye-vozzvaniya.tumannye-videniya
        name: Туманные видения
        description: Вы можете неограниченно накладывать заклинание безмолвный образ [silent image], не тратя ячейки заклинаний и материальные компоненты.
      - id: warlock.tainstvennye-vozzvaniya.uzhasayuschee-slovo
        name: Ужасающее слово
        prerequisite: 7-й уровень колдуна
        level: 7
        description: Вы можете один раз наложить заклинание *смятение [confusion]*, используя ячейку заклинаний колдуна. Вы не можете сделать это повторно, пока не закончите продолжительный отдых.
      - id: warlock.tainstvennye-vozzvaniya.cepi-karceri
        name: Цепи карцери
        prerequisite: 15-й уровень колдуна, умение «Договор цепи»
        level: 15
        description: Вы можете неограниченно накладывать заклинание удержание чудовища [hold monster], если цель — Исчадие, Небожитель или Элементаль. При этом вы не тратите ячейки заклинаний и материальные компоненты. Вы должны закончить продолжительный отдых, прежде чем снова сможете использовать это заклинание против этого же существа.
      - id: warlock.tainstvennye-vozzvaniya.aspekt-luny
        name: Аспект луны
        prerequisite: умение «Договор гримуара»
        description: Вам больше не нужно спать и вас невозможно усыпить любым способом. Чтобы получить преимущества продолжительного отдыха, вы можете потратить все 8 часов на легкую деятельность, например, прочитать свою Книгу Теней и постоять на страже.
      - id: warlock.tainstvennye-vozzvaniya.bezzhalostnoe-proklyatie
        name: Безжалостное проклятие
        prerequisite: 7-й уровень колдуна, заклинание сглаз [hex] или способность колдуна к проклятию
        level: 7
        description: Ваше проклятие создаёт временную связь между вами и вашей целью. Бонусным действием вы можете магически телепортироваться на расстояние до 30 футов в свободное пространство, которое вы можете видеть в пределах 5 футов от цели, проклятой вашим заклинанием сглаз [hex] или вашим умением колдуна, таким как «Проклятие ведьмовского клинка» или «Знак дурного предзнаменования». Чтобы телепортироваться таким образом, вы должны иметь возможность видеть проклятую цель.
      - id: warlock.tainstvennye-vozzvaniya.bezumnoe-proklyatie
        name: Безумное проклятие
        prerequisite: 5-й уровень колдуна, заклинание сглаз [hex] или способность колдуна к проклятию
        level: 5
        description: Бонусным действием вы вызываете психическое возмущение вокруг цели, проклятой вашим заклинанием сглаз [hex] или вашим умением колдуна, таким как «Проклятие ведьмовского клинка» или «Знак дурного предзнаменования». Когда вы это делаете, вы наносите урон психической энергией проклятой цели и каждому существу по вашему выбору, которое вы можете видеть в пределах 5 футов от цели. Урон психической энергией равен вашему модификатору Харизмы (минимум 1 урон). Чтобы использовать это воззвание, вы должны иметь возможность видеть проклятую цель, и она должна находиться в пределах 30 футов от вас.
      - id: warlock.tainstvennye-vozzvaniya.grobnica-levistusa
        name: Гробница Левистуса
        prerequisite: 5-й уровень колдуна
        level: 5
        description: |-
          Если вы получаете урон, то вы можете реакцией покрыть себя льдом, который тает в конце вашего следующего хода. Вы получаете 10 временных хитов за каждый ваш уровень колдуна, которые принимают как можно больше урона, на который вы совершаете реакцию. Сразу же после получения урона вы получаете уязвимость к урону огнём, ваша скорость уменьшается до 0, а вы становитесь недееспособны. Эти эффекты и любые оставшиеся временные хиты пропадают, когда тает лёд.

          Использовав это воззвание, вы не можете использовать его повторно до окончания короткого или продолжительного отдыха.
      - id: warlock.tainstvennye-vozzvaniya.dar-vechnozhivyh
        name: Дар вечноживых
        prerequisite: умение «Договор цепи»
        description: Всякий раз, когда вы восстанавливаете хиты и ваш фамильяр находится в пределах 100 футов от вас, все кости, брошенные для восстановления хитов, для вас имеют максимальное значение.
      - id: warlock.tainstvennye-vozzvaniya.dar-glubin
        name: Дар глубин
        prerequisite: 5-й уровень колдуна
        level: 5
        description: |-
          Вы можете дышать под водой, и вы получаете скорость плавания, равную вашей скорости ходьбы.

          Вы также можете один раз наложить заклинание подводное дыхание [water breathing], не расходуя ячейку заклинаний. Вы восстанавливаете это умение после окончания продолжительного отдыха.
      - id: warlock.tainstvennye-vozzvaniya.kope-letargii
        name: Копье Летаргии
        prerequisite: заговор мистический заряд [eldritch blast]
        description: Один раз на каждом из ваших ходов, когда вы попадаете по существу мистическим зарядом [eldritch blast], вы можете до конца вашего следующего хода уменьшить его скорость на 10 футов.
      - id: warlock.tainstvennye-vozzvaniya.misticheskaya-kara
        name: Мистическая кара
        prerequisite: 5-й уровень колдуна, умение «Договор клинка»
        level: 5
        description: Один раз за ход, когда вы попадаете по существу своим оружием договора, вы можете потратить ячейку заклинаний колдуна, чтобы нанести дополнительные 1к8 урона силовым полем цели, плюс еще 1к8 за каждый уровень ячейки заклинания, и также можете сбить с ног цель, если она Огромного размера или меньше.
      - id: warlock.tainstvennye-vozzvaniya.plasch-muh
        name: Плащ мух
        prerequisite: 5-й уровень колдуна
        level: 5
        description: |-
          Бонусным действием вы можете окружить себя волшебной аурой, которая выглядит как множество мух. Аура распространяется на 5 футов от вас во всех направлениях, но не через полное укрытие. Этот эффект длится до тех пор, пока вы не станете недееспособны или не отмените его бонусным действием.

          Аура даёт вам преимущество на проверки Харизмы (Запугивание), но даёт помеху на все другие проверки Харизмы. Любое другое существо, которое начинает свой ход в ауре, получает урон ядом, равный вашему модификатору Харизмы (минимум 0 урона).

          Использовав это воззвание, вы не можете использовать его повторно до окончания короткого или продолжительного отдыха.
      - id: warlock.tainstvennye-vozzvaniya.pobeg-obmanschika
        name: Побег обманщика
        prerequisite: 7-й уровень колдуна
        level: 7
        description: Вы можете один раз наложить на себя свободу перемещения [freedom of movement], не тратя ячейки заклинаний. Вы восстанавливаете это умение после окончания продолжительного отдыха.
      - id: warlock.tainstvennye-vozzvaniya.prizrachnyj-vzor
        name: Призрачный взор
        prerequisite: 7-й уровень колдуна
        level: 7
        description: |-
          Вы получаете возможность действием видеть сквозь твёрдые объекты в радиусе 30 футов. В этом диапазоне у вас есть тёмное зрение, если у вас его ещё нет. Это особое зрение длится 1 минуту или до тех пор, пока ваша концентрация не закончится (как если бы вы концентрировались на заклинании). За это время вы воспринимаете объекты как призрачные, прозрачные изображения.

          Использовав это воззвание, вы не сможете использовать его повторно до окончания короткого или продолжительного отдыха.
      - id: warlock.tainstvennye-vozzvaniya.savan-tenej
        name: Саван теней
        prerequisite: 15-й уровень колдуна
        level: 15
        description: Вы можете неограниченно накладывать заклинание невидимость [invisibility], не тратя ячейки заклинаний.
      - id: warlock.tainstvennye-vozzvaniya.uluchshennoe-oruzhie-dogovora
        name: Улучшенное оружие договора
        prerequisite: умение «Договор клинка»
        description: |-
          Вы можете использовать любое оружие, призванное с помощью умения «Договор клинка», в качестве своей заклинательной фокусировки колдуна.

          Кроме того, это оружие получает +1 бонус к атакам и броскам урона, если это не магическое оружие, которое уже имеет бонус к этим броскам.

          Наконец, призванное оружие может быть коротким луком, длинным луком, лёгким арбалетом или тяжёлым арбалетом.
      - id: warlock.tainstvennye-vozzvaniya.hvatka-hadara
        name: Хватка Хадара
        prerequisite: заговор мистический заряд [eldritch blast]
        description: Один раз на каждом из ваших ходов, когда вы попадаете по существу мистическим зарядом [eldritch blast], вы можете переместить это существо по прямой линии на 10 футов ближе к вам.
      - id: warlock.tainstvennye-vozzvaniya.bessmertnyj-rab
        name: Бессмертный раб
        prerequisite: 5-й уровень колдуна
        level: 5
        description: Вы можете накладывать заклинание восставший труп [animate dead] без затраты ячеек заклинаний. Как только вы это сделаете, вы не сможете наложить его подобным образом снова, пока не закончите продолжительный отдых.
      - id: warlock.tainstvennye-vozzvaniya.dar-zaschitnikov
        name: Дар защитников
        prerequisite: 9-й уровень колдуна, умение «Договор гримуара»
        level: 9
        description: |-
          В вашей книге теней появляется новая страница. С вашего разрешения существо может действием записать своё имя на странице. На странице может быть количество имён, равное вашему бонусу мастерства.

          Каждый раз, когда хиты существа, чьё имя записано на этой странице, опускаются до 0 и при этом оно не умирает сразу, вместо этого его хиты опускаются до 1. Как только это умение сработало, оно не может сработать ни на одном существе, пока вы не окончите продолжительный отдых.

          Действием вы можете магическим образом удалить имя со страницы, просто коснувшись его.
      - id: warlock.tainstvennye-vozzvaniya.dar-mastera-cepi
        name: Дар мастера цепи
        prerequisite: умение «Договор цепи»
        description: |-
          Когда вы накладываете заклинание поиск фамильяра [find familiar], вы наделяете призванное существо частичкой своей мистической силы, даруя ему следующие преимущества:

          - Фамильяр получает либо скорость полёта, либо скорость плавания (по вашему выбору), равную 40 футам.
          - Бонусным действием вы можете приказать фамильяру совершить действие Атака.
          - Атаки оружием фамильяра считаются магическими, когда требуется преодолеть иммунитет или сопротивление для немагических атак.
          - Если фамильяр заставляет цель совершить спасбросок, то его Сл равна Сл спасброска ваших заклинаний.
          - Когда фамильяр получает урон, вы можете реакцией даровать ему сопротивление против этого урона.
      - id: warlock.tainstvennye-vozzvaniya.zaschita-talismana
        name: Защита талисмана
        prerequisite: 7-й уровень колдуна, умение «Договор талисмана»
        level: 7
        description: Когда носитель вашего талисмана проваливает спасбросок, он может бросить к4 и добавить выпавшее значение к броску. Это преимущество можно использовать количество раз, равное вашему бонусу мастерства, и все потраченные использования восстанавливаются после окончания продолжительного отдыха.
      - id: warlock.tainstvennye-vozzvaniya.knizhnik-iz-dali
        name: Книжник из дали
        prerequisite: 5-й уровень колдуна, умение «Договор гримуара»
        level: 5
        description: |-
          В вашей книге теней появляется новая страница. С вашего разрешения существо может действием записать своё имя на странице. На странице может быть количество имён, равное вашему бонусу мастерства.

          Вы можете наложить заклинание послание [sending] на цель, имя которой указано на этой странице. При этом вы не тратите ячейку заклинаний и вам не нужны материальные компоненты. Чтобы отправить послание, вам нужно записать его на странице. Цель слышит ваше послание в своей голове, и если отвечает, то ответное послание появляется на странице, а не в вашем разуме. Написанные на странице сообщения исчезают спустя 1 минуту.

          Действием вы можете магическим образом удалить имя со страницы, просто коснувшись его.
      - id: warlock.tainstvennye-vozzvaniya.misticheskij-razum
        name: Мистический разум
        description: Вы совершаете с преимуществом спасброски Телосложения для поддержания концентрации на вашем заклинании.
      - id: warlock.tainstvennye-vozzvaniya.poricanie-talismana
        name: Порицание талисмана
        prerequisite: умение «Договор талисмана»
        description: Когда по носителю вашего талисмана попадают атакой и вы можете видеть атакующего в пределах 30 футов, вы можете реакцией нанести атакующему урон психической энергией, равный вашему бонусу мастерства, и оттолкнуть его на 10 футов от носителя талисмана.
      - id: warlock.tainstvennye-vozzvaniya.svyaz-s-talismanom
        name: Связь с талисманом
        prerequisite: 12-й уровень колдуна, умение «Договор талисмана»
        level: 12
        description: Пока кто-то другой носит ваш талисман, вы можете действием телепортироваться в ближайшее к нему свободное пространство при условии, что вы оба находитесь на одном плане существования. Владелец вашего талисмана может сделать то же самое, используя своё действие для телепортации к вам. Телепортацию можно использовать количество раз, равное вашему бонусу мастерства и все потраченные использования восстанавливаются после окончания продолжительного отдыха.
subclasses:
  - id: warlock.arhifeya
    name: Архифея
    sources: *a1
    features:
      - id: warlock.arhifeya.rasshirennyj-spisok-zaklinanij
        name: Расширенный список заклинаний
        level: 1
        subtitle: 1-й уровень, умение архифеи
        description: |-
          Архифея позволяет вам при изучении заклинаний колдуна выбирать из более широкого списка. В ваш список заклинаний колдуна добавляются следующие заклинания.

          **ДОПОЛНИТЕЛЬНЫЕ ЗАКЛИНАНИЯ АРХИФЕИ**

          | Уровень
          заклинания | Заклинания |
          | 1 | огонь фей [faerie fire], усыпление [sleep] |
          | 2 | воображаемая сила [phantasmal force], умиротворение [calm emotions] |
          | 3 | мерцание [blink], рост растений [plant growth] |
          | 4 | высшая невидимость [greater invisibility], подчинение зверя [dominate beast] |
          | 5 | подчинение личности [dominate person], притворство [seeming] |
      - id: warlock.arhifeya.fejskoe-prisutstvie
        name: Фейское присутствие
        level: 1
        subtitle: 1-й уровень, умение архифеи
        description: |-
          Ваш покровитель дарует вам возможность демонстрировать притягательную и пугающую фейскую внешность. Вы действием можете заставить всех существ в 10-футовом кубе исходящем от вас совершить спасбросок Мудрости Сл ваших заклинаний колдуна. Все существа, провалившие спасбросок, становятся до конца вашего следующего хода очарованными или испуганными вами (на ваш выбор).

          Использовав это умение, вы не можете использовать его снова, не завершив короткого либо продолжительного отдыха.
      - id: warlock.arhifeya.tumannoe-ischeznovenie
        name: Туманное исчезновение
        level: 6
        subtitle: 6-й уровень, умение архифеи
        description: Получив урон, вы можете раствориться облачком тумана. Если вы получили урон, вы можете реакцией стать невидимым и телепортироваться на расстоянии до 60 футов в видимое вами свободное пространство. Вы остаётесь невидимым до начала своего следующего хода, или пока не используете атаку или заклинание. Использовав это умение, вы не можете использовать его снова, не завершив короткого либо продолжительного отдыха.
      - id: warlock.arhifeya.charuyuschaya-zaschita
        name: Чарующая защита
        level: 10
        subtitle: 10-й уровень, умение архифеи
        description: Ваш покровитель обучает вас, как обращать воздействующую на разум магию ваших врагов против них самих. Вы получаете иммунитет к состоянию очарованности, и если другое существо пытается очаровать вас, вы можете реакцией попытаться повернуть очарование против его создателя. Это существо должно преуспеть в спасброске Мудрости Сл ваших заклинаний колдуна, иначе оно станет очаровано вами на 1 минуту, или пока не получит любой урон.
      - id: warlock.arhifeya.temnoe-isstuplenie
        name: Тёмное исступление
        level: 14
        subtitle: 14-й уровень, умение архифеи
        description: |-
          Вы можете погружать существ в иллюзорное пространство. Выберите действием видимое вами существо в пределах 60 футов от себя. Оно должно совершить спасбросок Мудрости Сл ваших заклинаний колдуна. В случае провала оно очаровано или напугано вами (на ваш выбор) на протяжении 1 минуты, или пока вы не потеряете концентрацию (как если бы концентрировались на заклинании). Эффект завершается преждевременно, если существо получает любой урон. Покуда иллюзия длится, существо считает, что оно потерялось в туманном пространстве, образ которого выбираете вы. Существо может видеть и слышать только себя, вас и иллюзию.

          Использовав это умение, вы не можете использовать его снова, не завершив короткого либо продолжительного отдыха.
  - id: warlock.ischadie
    name: Исчадие
    sources: *a1
    features:
      - id: warlock.ischadie.rasshirennyj-spisok-zaklinanij
        name: Расширенный список заклинаний
        level: 1
        subtitle: 1-й уровень, умение исчадия
        description: |-
          Исчадие позволяет вам при изучении заклинаний колдуна выбирать из более широкого списка. В ваш список заклинаний колдуна добавляются следующие заклинания.

          **ДОПОЛНИТЕЛЬНЫЕ ЗАКЛИНАНИЯ ИСЧАДИЯ**

          | Уровень
          заклинания | Заклинания |
          | 1 | огненные ладони [burning hands], приказ [command] |
          | 2 | глухота/слепота [blindness/deafness], палящий луч [scorching ray] |
          | 3 | зловонное облако [stinking cloud], огненный шар [fireball] |
          | 4 | огненная стена [wall of fire], огненный щит [fire shield] |
          | 5 | небесный огонь [flame strike], святилище [hallow] |
      - id: warlock.ischadie.blagoslovenie-temnejshego
        name: Благословение темнейшего
        level: 1
        subtitle: 1-й уровень, умение исчадия
        description: Когда вы опускаете хиты враждебного существа до 0, вы получаете временные хиты, равные вашему модификатору Харизмы + ваш уровень колдуна (минимум 1).
      - id: warlock.ischadie.udacha-temnejshego
        name: Удача темнейшего
        level: 6
        subtitle: 6-й уровень, умение исчадия
        description: |-
          Вы можете воззвать к своему покровителю, чтобы изменить судьбу в свою пользу. Когда вы совершаете проверку характеристики или спасбросок, вы можете использовать это умение, чтобы добавить 1к10 к броску. Вы можете так сделать после основного броска, но до того, как его эффект вступит в силу.

          Использовав это умение, вы не можете использовать его снова до окончания короткого или продолжительного отдыха.
      - id: warlock.ischadie.ustojchivost-ischadiya
        name: Устойчивость исчадия
        level: 10
        subtitle: 10-й уровень, умение исчадия
        description: Вы можете выбрать один вид урона, когда заканчиваете короткий или продолжительный отдых. Вы получаете сопротивление этому виду урона, пока вы не выберете другой вид урона при помощи этого умения. Урон от магического или серебряного оружия игнорирует это сопротивление.
      - id: warlock.ischadie.brosok-skvoz-ad
        name: Бросок сквозь ад
        level: 14
        subtitle: 14-й уровень, умение исчадия
        description: |-
          Когда вы попадаете по существу атакой, вы можете использовать это умение, чтобы мгновенно переместить цель сквозь нижние планы. Существо исчезает и несётся через кошмарный ландшафт.

          В конце вашего следующего хода цель возвращается в пространство, которое занимало, или ближайшее свободное пространство. Если цель — не исчадие, она получает урон психической энергией 10к10 от испытанных жутких ощущений.

          Использовав это умение, вы не можете использовать его снова до окончания продолжительного отдыха.
  - id: warlock.velikij-drevnij
    name: Великий Древний
    sources: *a1
    features:
      - id: warlock.velikij-drevnij.rasshirennyj-spisok-zaklinanij
        name: Расширенный список заклинаний
        level: 1
        subtitle: 1-й уровень, умение великого древнего
        description: |-
          Великий Древний позволяет вам при изучении заклинаний колдуна выбирать из более широкого списка. В ваш список заклинаний колдуна добавляются следующие заклинания.

          **ДОПОЛНИТЕЛЬНЫЕ ЗАКЛИНАНИЯ ВЕЛИКОГО ДРЕВНЕГО**

          | Уровень
          заклинания | Заклинания |
          | 1 | диссонирующий шёпот [dissonant whisper], жуткий смех Таши [Tasha’s hideous laughter] |
          | 2 | воображаемая сила [phantasmal force], обнаружение мыслей [detect thoughts] |
          | 3 | подсматривание [clairvoyance], послание [sending] |
          | 4 | подчинение зверя [dominate beast], Эвардовы чёрные щупальца [Еvard’s black tentackles] |
          | 5 | подчинение личности [dominate person], телекинез [telekinesis] |
      - id: warlock.velikij-drevnij.probuzhdennyj-razum
        name: Пробуждённый разум
        level: 1
        subtitle: 1-й уровень, умение великого древнего
        description: Ваше чуждое знание даёт вам возможность касаться разума других существ. Вы можете общаться телепатически с любым существом, которое видите в пределах 30 футов от себя. Вам не нужно знать общий с существом язык для того, чтобы оно понимало ваши телепатические высказывания, но существо должно быть в состоянии понимать как минимум один язык.
      - id: warlock.velikij-drevnij.entropicheskaya-opeka
        name: Энтропическая опека
        level: 6
        subtitle: 6-й уровень, умение великого древнего
        description: Вы научитесь магически опекать себя от атак и использовать неудачную вражескую атаку на пользу себе. Если существо совершает бросок атаки по вам, вы можете реакцией создать помеху для этого броска. Если атака промахнётся по вам, ваш следующий бросок атаки по этому существу совершается с преимуществом, если вы совершите его до конца своего следующего хода. Использовав это умение, вы не можете использовать его снова до окончания короткого или продолжительного отдыха.
      - id: warlock.velikij-drevnij.mentalnyj-schit
        name: Ментальный щит
        level: 10
        subtitle: 10-й уровень, умение великого древнего
        description: Ваши мысли не могут быть прочитаны телепатически или иными средствами, если вы не пожелаете обратного. Вы также получаете сопротивление урону психической энергией, и каждый раз, когда существо причиняет вам урон психической энергией, это существо получает такое же количество урона, что и вы.
      - id: warlock.velikij-drevnij.sozdat-raba
        name: Создать раба
        level: 14
        subtitle: 14-й уровень, умение великого древнего
        description: Вы получаете способность инфицировать разум гуманоидов чужеродной магией своего покровителя. Вы можете действием коснуться недееспособного гуманоида. Это существо становится очарованным вами до тех пор, пока на него не будет наложено заклинание снятие проклятья [remove curse], либо пока оно не перестанет быть очарованным, либо пока вы не используете это умение еще раз. Вы можете общаться телепатически с очарованным существом, пока вы оба находитесь на одном плане существования.
  - id: warlock.bessmertnyj
    name: Бессмертный
    sources:
      - code: SCAG
        book: Sword Coast Adventurer’s Guide
    features:
      - id: warlock.bessmertnyj.rasshirennyj-spisok-zaklinanij
        name: Расширенный список заклинаний
        level: 1
        subtitle: 1-й уровень, умение бессмертного
        description: |-
          Бессмертный позволяет вам выбирать заклинания из расширенного списка, когда вы узнаете заклинания колдуна. В ваш список заклинаний колдуна добавляются следующие заклинания.

          | Уровень заклинания | Заклинания |
          | 1 | псевдожизнь [false life], луч болезни [ray of sickness] |
          | 2 | глухота/слепота [blindness/deafness], тишина [silence] |
          | 3 | притворная смерть [feign death], разговор с мёртвыми [speak with dead] |
          | 4 | аура жизни [aura of life], защита от смерти [death ward] |
          | 5 | заражение [contagion], знание легенд [legend lore] |
      - id: warlock.bessmertnyj.sredi-mertvyh
        name: Среди мёртвых
        level: 1
        subtitle: 1-й уровень, умение бессмертного
        description: |-
          Вы изучаете заговор уход за умирающим [spare the dying], который считается для вас заговором колдуна.

          Также, вы получаете преимущество на спасброски против любых болезней. Вдобавок, нежити сложно вредить вам. Если Нежить целится непосредственно в вас атакой или вредоносным заклинанием, это существо должно совершить спасбросок Мудрости против вашего Сл заклинаний (нежить не обязана проходить такой спасбросок при включении вас в зону поражения заклинания, например, во взрыв огненного шара [fireball]).

          При провале спасброска, существо должно выбрать новую цель, отличную от вас, или совсем провалить заклинание, если подходящих целей нет. При успехе спасброска, это существо становится невосприимчивым к этому эффекту на 24 часа. Нежить также получает такой же иммунитет, если вы целитесь в неё атакой или вредоносным заклинанием.
      - id: warlock.bessmertnyj.otrinuv-smert
        name: Отринув смерть
        level: 6
        subtitle: 6-й уровень, умение бессмертного
        description: |-
          Вы можете получить жизненную силу, когда обманываете смерть сами или помогаете кому-то другому сделать это. Вы можете восстановить 1к8 + модификатор Телосложения (минимум 1) хитов, когда преуспеваете в спасброске против смерти или стабилизируете существо используя уход за умирающим [spare the dying].

          Воспользовавшись этим умением, вы сможете использовать его снова лишь после окончания продолжительного отдыха.
      - id: warlock.bessmertnyj.bessmertnaya-priroda
        name: Бессмертная природа
        level: 10
        subtitle: 10-й уровень, умение бессмертного
        description: |-
          Вы можете задерживать дыхание на неопределённо долгий срок, вас не мучает жажда или голод и вам не нужно спать, хотя вам всё еще необходимо отдыхать, чтобы снизить уровень истощения и получить преимущества от короткого или продолжительного отдыха.

          Вдобавок, вы медленнее стареете. За каждые 10 лет, которые проходят, ваше тело стареет лишь на 1 год, и вы иммунны к магическому старению.
      - id: warlock.bessmertnyj.nerushimaya-zhizn
        name: Нерушимая жизнь
        level: 14
        subtitle: 14-й уровень, умение бессмертного
        description: |-
          Вас посвящают в некоторые настоящие секреты Бессмертных. В свой ход вы можете бонусным действием восстановить хиты равные 1к8 + ваш уровень колдуна. Вдобавок, если вы приставите отрубленную часть тела на место, когда используете это умение, она прирастёт на место.

          Воспользовавшись этим умением, вы сможете использовать его снова лишь после короткого или продолжительного отдыха.
  - id: warlock.vedmovskoj-klinok
    name: Ведьмовской клинок
    sources:
      - code: XGE
        book: Xanathar’s Guide to Everything
    features:
      - id: warlock.vedmovskoj-klinok.rasshirennyj-spisok-zaklinanij
        name: Расширенный список заклинаний
        level: 1
        subtitle: 1-й уровень, умение ведьмовского клинка
        description: |-
          Ваш покровитель позволяет при изучении заклинаний колдуна выбирать из более широкого списка. В ваш список заклинаний колдуна добавляются следующие заклинания.

          | Уровень заклинания | Заклинания |
          | 1-й | щит [shield], гневная кара [wrathful smite] |
          | 2-й | размытый образ [blur], клеймящая кара [branding smite] |
          | 3-й | мерцание [blink], стихийное оружие [elemental weapon] |
          | 4-й | воображаемый убийца [phantasmal killer], оглушающая кара [staggering smite] |
          | 5-й | изгоняющая кара [banishing smite], конус холода [cone of cold] |
      - id: warlock.vedmovskoj-klinok.proklyatie-vedmovskogo-klinka
        name: Проклятие ведьмовского клинка
        level: 1
        subtitle: 1-й уровень, умение ведьмовского клинка
        description: |-
          Вы получаете возможность наложить на кого-то жестокое проклятие. Бонусным действием выберите одно существо, которое вы можете видеть в пределах 30 футов. Цель получает проклятье на 1 минуту. Проклятие заканчивается раньше, если цель умирает, вы умираете или вы становитесь недееспособны. Пока проклятие не закончится, вы получите следующие преимущества:

          - Вы получаете бонус к броскам урона по проклятой цели. Бонус равен вашему бонусу мастерства.
          - Любой бросок атаки, который вы совершаете по проклятой цели, является критическим попаданием при результате «19» или «20» на к20.
          - Если проклятая цель умирает, вы восстанавливаете количество хитов, равное вашему уровню колдуна + ваш модификатор Харизмы (минимум 1 хит).

          Использовав это умение, вы не можете использовать его повторно до окончания короткого или продолжительного отдыха.
      - id: warlock.vedmovskoj-klinok.proklyatyj-voitel
        name: Проклятый воитель
        level: 1
        subtitle: 1-й уровень, умение ведьмовского клинка
        description: |-
          Вы проходите необходимую подготовку, чтобы быть эффективнее в бою. Вы получаете владение средними доспехами, щитами и воинским оружием.

          Влияние вашего покровителя также позволяет мистически направлять вашу волю через оружие. Всякий раз, когда вы заканчиваете продолжительный отдых, вы можете коснуться одного оружия, которым вы владеете, и у которого нет свойства «двуручное».

          Когда вы атакуете этим оружием, вы можете использовать для бросков атаки и урона свой модификатор Харизмы вместо модификатора Силы или Ловкости. Это умение действует до тех пор, пока вы не закончите продолжительный отдых. Если вы позже заключаете Договор клинка, это умение распространяется на любое оружие договора, которое вы вызываете этим умением, независимо от типа оружия.
      - id: warlock.vedmovskoj-klinok.proklyatyj-spektr
        name: Проклятый спектр
        level: 6
        subtitle: 6-й уровень, умение ведьмовского клинка
        description: |-
          Вы можете проклинать душу персоны, которую вы убиваете, временно обязывая её служить вам. Когда вы убиваете гуманоида, вы можете заставить его дух подняться из своего тела в виде спектра [specter].

          Когда появляется спектр [specter], он получает временные хиты, равные половине вашего уровня колдуна. Совершайте броски инициативы для спектра [specter], так как он имеет свой собственный ход. Он подчиняется вашим словесным командам, а также получает специальный бонус к своим броскам атаки, равный вашему модификатору Харизмы (минимум +0).

          Спектр [specter] продолжает служить вам до конца вашего следующего продолжительного отдыха, после чего он уходит в загробную жизнь. После сковывания спектра [specter] этим умением, вы не можете использовать его повторно до окончания продолжительного отдыха.
      - id: warlock.vedmovskoj-klinok.proklyatyj-dospeh
        name: Проклятый доспех
        level: 10
        subtitle: 10-й уровень, умение ведьмовского клинка
        description: Ваше проклятие становится более мощным. Если цель, проклятая вашим проклятием ведьмовского клинка, попадает по вам броском атаки, вы можете реакцией бросить к6. При результате 4 или выше атака промахивается по вам, независимо от броска проклятого существа.
      - id: warlock.vedmovskoj-klinok.master-proklyatij
        name: Мастер проклятий
        level: 14
        subtitle: 14-й уровень, умение ведьмовского клинка
        description: Вы можете перенести «Проклятие ведьмовского клинка» с убитого существа на другое существо. Когда существо, проклятое «Проклятием ведьмовского клинка», умирает, вы можете переместить проклятие на другое существо, которое вы можете видеть в пределах 30 футов от себя, при условии, что вы являетесь дееспособным. Когда вы перемещаете проклятие таким образом, вы не восстанавливаете хиты от смерти ранее проклятого существа.
  - id: warlock.nebozhitel
    name: Небожитель
    sources:
      - code: XGE
        book: Xanathar’s Guide to Everything
    features:
      - id: warlock.nebozhitel.rasshirennyj-spisok-zaklinanij
        name: Расширенный список заклинаний
        level: 1
        subtitle: 1-й уровень, умение небожителя
        description: |-
          Ваш покровитель позволяет вам при изучении заклинаний колдуна выбирать из более широкого списка. В ваш список заклинаний колдуна добавляются следующие заклинания.

          | Уровень заклинания | Заклинания |
          | 1 | лечение ран [cure wounds], направляющий снаряд [guiding bolt] |
          | 2 | пылающий шар [flaming sphere], малое восстановление [lesser restoration] |
          | 3 | дневной свет [daylight], возрождение [revivify] |
          | 4 | страж веры [guardian of faith], огненная стена [wall of fire] |
          | 5 | небесный огонь [flame strike], высшее восстановление [greater restoration] |
      - id: warlock.nebozhitel.dopolnitelnye-zagovory
        name: Дополнительные заговоры
        level: 1
        subtitle: 1-й уровень, умение небожителя
        description: Вы узнаёте заговоры свет [light] и священное пламя [sacred flame]. Для вас они считаются заговорами колдуна и не учитываются при подсчёте известных вам заговоров.
      - id: warlock.nebozhitel.lechaschij-svet
        name: Лечащий свет
        level: 1
        subtitle: 1-й уровень, умение небожителя
        description: |-
          Вы получаете способность направлять небесную энергию для лечения ран. У вас есть набор костей к6, который вы тратите, чтобы подпитывать это лечение. Количество костей равно 1 + ваш уровень колдуна.

          Бонусным действием вы можете вылечить одно существо, которое вы можете видеть в 60 футах, потратив кости из вашего набора. Максимальное количество костей, которые вы можете потратить единовременно, равно вашему модификатору Харизмы (минимум 1 кость). Бросьте кости, которые вы тратите, сложите их значения и восстанавливайте количество хитов, равное полученному значению. Вы восстанавливаете все потраченные кости после окончания продолжительного отдыха.
      - id: warlock.nebozhitel.siyayuschaya-dusha
        name: Сияющая душа
        level: 6
        subtitle: 6-й уровень, умение небожителя
        description: Ваша связь с Небожителем позволяет вам служить проводником для сияющей энергии. Вы получаете сопротивление урону излучением, и когда вы накладываете заклинание, которое наносит урон излучением или огнём, вы можете добавить модификатор Харизмы к одному броску урона излучением или огнём против одной из целей этого заклинания.
      - id: warlock.nebozhitel.nebesnoe-soprotivlenie
        name: Небесное сопротивление
        level: 10
        subtitle: 10-й уровень, умение небожителя
        description: Вы получаете временные хиты, когда вы заканчиваете короткий или продолжительный отдых. Эти временные хиты равны вашему уровню колдуна + ваш модификатор Харизмы. Кроме того, в конце отдыха выбирайте до пяти существ, которых вы можете видеть. Эти существа получают временные хиты, равные половине вашего уровня колдуна + ваш модификатор Харизмы.
      - id: warlock.nebozhitel.zhguchee-vozmezdie
        name: Жгучее возмездие
        level: 14
        subtitle: 14-й уровень, умение небожителя
        description: |-
          Сияющая энергия, которую вы используете, позволяет вам противостоять смерти. Когда вам нужно совершить спасбросок от смерти в начале вашего хода, вы можете вместо этого подняться на ноги со взрывом сияющей энергии. Вы восстанавливаете хиты, равные половине вашего максимального значения хитов, после чего можете встать, если захотите. Каждое существо по вашему выбору, находящееся в пределах 30 футов от вас, получает урон излучением, равный 2к8 + ваш модификатор Харизмы, и ослеплено до конца вашего текущего хода.

          Использовав это умение, вы не можете использовать его повторно до окончания продолжительного отдыха.
  - id: warlock.bezdonnyj
    name: Бездонный
    sources:
      - code: TCE
        book: Tasha’s Cauldron of Everything
    features:
      - id: warlock.bezdonnyj.rasshirennyj-spisok-zaklinanij
        name: Расширенный список заклинаний
        level: 1
        subtitle: 1-й уровень, умение бездонного
        description: |-
          Бездонный позволяет вам выбирать заклинания из расширенного списка, когда вы узнаете заклинания колдуна. В ваш список заклинаний колдуна добавляются следующие заклинания.

          **Дополнительные заклинания бездонного**

          | Уровень
          заклинания | Заклинания |
          | 1 | волна грома [thunderwave], сотворение или уничтожение воды [create or destroy water] |
          | 2 | порыв ветра [gust of wind], тишина [silence] |
          | 3 | метель [sleet storm], молния [lightning bolt] |
          | 4 | власть над водами [control water], призыв духа элементаля [summon elemental] (только вода) |
          | 5 | длань Бигби [Bigby’s hand] (выглядит как щупальце), конус холода [cone of cold] |
      - id: warlock.bezdonnyj.schupalce-iz-glubin
        name: Щупальце из глубин
        level: 1
        subtitle: 1-й уровень, умение бездонного
        description: |-
          Вы можете магически призвать призрачное щупальце, атакующее ваших врагов. Бонусным действием вы создаете 10-футовое щупальце в месте, которое вы можете видеть в пределах 60 футов. Щупальце существует 1 минуту или до тех пор, пока вы не призовёте новое с использованием этого умения.

          Когда вы создаёте щупальце, вы можете совершить рукопашную атаку заклинанием по одному существу в 10 футах от него. При попадании цель получает 1к8 урона холодом, а её скорость уменьшается на 10 футов до начала вашего следующего хода. Когда вы достигаете 10-го уровня в этом классе, урон увеличивается до 2к8.

          Бонусным действием в свой ход вы можете переместить щупальце на расстояние до 30 футов и повторить атаку.

          Вы можете призывать щупальце количество раз, равное вашему бонусу мастерства. Вы восстанавливаете все потраченные использования после окончания продолжительного отдыха.
      - id: warlock.bezdonnyj.dar-morya
        name: Дар моря
        level: 1
        subtitle: 1-й уровень, умение бездонного
        description: Вы получаете скорость плавания 40 футов, а также способность дышать под водой.
      - id: warlock.bezdonnyj.okeanicheskaya-dusha
        name: Океаническая душа
        level: 6
        subtitle: 6-й уровень, умение бездонного
        description: Теперь в пучине вы чувствуете себя как дома. Вы получаете сопротивление урону холодом. Кроме того, когда вы полностью погружены, любое существо, которое также полностью погружено, может понимать вашу речь, а вы можете понимать его.
      - id: warlock.bezdonnyj.zaschitnyj-izgib
        name: Защитный изгиб
        level: 6
        subtitle: 6-й уровень, умение бездонного
        description: Ваше «Щупальце из глубин» может защищать вас и других, ставя себя под удар. Когда вы или существо, которое вы можете видеть, получаете урон, находясь в пределах 10 футов от щупальца, вы можете реакцией выбрать одно из этих существ и уменьшить получаемый им урон на 1к8. Когда вы достигнете 10-го уровня в этом классе, урон, уменьшаемый щупальцем, увеличивается до 2к8.
      - id: warlock.bezdonnyj.oputyvayuschie-schupalca
        name: Опутывающие щупальца
        level: 10
        subtitle: 10-й уровень, умение бездонного
        description: |-
          Вы узнаете заклинание Эвардовы чёрные щупальца [Evard’s black tentackles]. Для вас оно считается заклинанием колдуна и не учитывается в общем количестве известных вам заклинаний. Вы также можете наложить его один раз без использования ячеек заклинаний, и вы восстанавливаете способность сделать это вновь после окончания продолжительного отдыха.

          Каждый раз, когда вы накладываете это заклинание, магия вашего покровителя поддерживает вас, даруя вам количество временных хитов, равное вашему уровню колдуна. Кроме того, урон не может нарушить вашу концентрацию на этом заклинании.
      - id: warlock.bezdonnyj.bezdonnoe-pogruzhenie
        name: Бездонное погружение
        level: 14
        subtitle: 14-й уровень, умение бездонного
        description: |-
          Вы можете магическим образом открыть временные пути к водоёмам. Действием вы можете телепортировать себя и до пяти других согласных существ, которых вы можете видеть на расстоянии 30 футов. Вы исчезаете в вихре из щупалец, а затем появляетесь на расстоянии до 1 мили в водоёме, который вы видели (размером с пруд или больше), или на расстоянии 30 футов от него. Каждый из вас появляется в свободном пространстве на расстоянии 30 футов друг от друга.

          Использовав это умение, вы не сможете применить его повторно, пока не закончите короткий или продолжительный отдых.
  - id: warlock.genij
    name: Гений
    sources:
      - code: TCE
        book: Tasha’s Cauldron of Everything
    features:
      - id: warlock.genij.rasshirennyj-spisok-zaklinanij
        name: Расширенный список заклинаний
        level: 1
        subtitle: 1-й уровень, умение гения
        description: |-
          Ваш покровитель-гений позволяет вам выбирать заклинания из расширенного списка в тот момент, когда вы изучаете заклинания колдуна. Таблица «Расширенный список заклинаний гениев» ниже показывает общие заклинания гениев вместе с их конкретными разновидностями, которые добавляются в ваш список заклинаний колдуна.

          **Расширенный список заклинаний гениев**

          | Уровень заклинания | Заклинание гения | Заклинание дао | Заклинание джинна | Заклинание ифрита | Заклинание марид |
          | 1 | обнаружение зла и добра [detect evil and good] | убежище [sanctuary] | волна грома [thunderwave] | огненные ладони [burning hands] | туманное облако [fog cloud] |
          | 2 | воображаемая сила [phantasmal force] | шипы [spike growth] | порыв ветра [gust of wind] | палящий луч [scorching ray] | размытый образ [blur] |
          | 3 | сотворение пищи и воды [create food and water] | слияние с камнем [meld into stone] | стена ветров [wind wall] | огненный шар [fireball] | метель [sleet storm] |
          | 4 | воображаемый убийца [phantasmal killer] | изменение формы камня [stone shape] | высшая невидимость [greater invisibility] | огненный щит [fire shield] | власть над водами [control water] |
          | 5 | сотворение [creation] | каменная стена [wall of stone] | притворство [seeming] | небесный огонь [flame strike] | конус холода [cone of cold] |
          | 9 | исполнение желаний [wish] | - | - | - | - |
      - id: warlock.genij.sosud-geniya
        name: Сосуд гения
        level: 1
        subtitle: 1-й уровень, умение гения
        description: |-
          Ваш покровитель дарует вам магический сосуд, содержащий частичку силы гения. Это сосуд Крошечного размера, который также является магической фокусировкой для заклинаний колдуна. Вы можете сами решить, что это за объект, или же сделать выбор с помощью таблицы «Сосуд гения».

          **Сосуд гения**

          | к6 | Сосуд |
          | 1 | Масляная лампа |
          | 2 | Урна |
          | 3 | Кольцо с отделением |
          | 4 | Закупоренная бутылка |
          | 5 | Статуэтка с пустотой внутри |
          | 6 | Изысканный фонарь |

          Когда вы прикасаетесь к сосуду гения, вы можете использовать его следующим образом:

          ***Передышка на дне бутылки.*** Действием вы можете магически исчезнуть и войти в сосуд, который остаётся на том месте, где вы его держали. Внутренности сосуда — это межпространственное измерение в форме цилиндра с радиусом в 20 футов, 20 футов высотой, напоминающее ваш сосуд. Интерьер обставлен удобными подушками и низкими столами, и в нём поддерживается комфортная температура. Пока вы находитесь внутри, вы можете слышать все, что происходит вокруг сосуда, как если бы вы были на его месте. Вы можете оставаться в сосуде количество часов, равное удвоенному значению вашего бонуса мастерства. Вы покидаете сосуд раньше этого времени, если используете бонусное действие, чтобы покинуть его, умираете или если сосуд уничтожается. Если вы покидаете сосуд, вы оказываетесь в свободном пространстве максимально близко к сосуду. Любые предметы, принесенные внутрь сосуда, остаются в нём до тех пор, пока они не будут вынесены оттуда или сосуд не будет уничтожен, при этом любой объект, находящийся внутри сосуда, появляется невредимым в свободном пространстве максимально близко к сосуду. Войдя в сосуд, вы не сможете войти в него повторно, пока не закончите продолжительный отдых.

          ***Гнев гения.*** Один раз в каждый свой ход, когда вы попадаете броском атаки, вы можете нанести дополнительный урон по цели, равный вашему бонусу мастерства. Тип этого урона определяется выбранной вами разновидностью гения: дробящий урон (дао), урон звуком (джинн), урон огнём (ифрит), урон холодом (марид).

          Класс доспеха сосуда гения равен Сл спасброска ваших заклинаний. Его хиты равны вашему уровню колдуна + вашему бонусу мастерства. Сосуд также имеет иммунитет к урону психической энергией и ядом.

          Если сосуд будет уничтожен или вы потеряете его, вы можете провести часовую церемонию, чтобы получить замену от покровителя. Эта церемония может быть проведена как часть короткого или продолжительного отдыха. По её окончании предыдущий сосуд уничтожается, если он до сих пор существует. Этот сосуд исчезает в языках стихийной силы, когда вы умираете.
        options:
          - id: warlock.genij.sosud-geniya.peredyshka-na-dne-butylki
            name: Передышка на дне бутылки
            description: Действием вы можете магически исчезнуть и войти в сосуд, который остаётся на том месте, где вы его держали. Внутренности сосуда — это межпространственное измерение в форме цилиндра с радиусом в 20 футов, 20 футов высотой, напоминающее ваш сосуд. Интерьер обставлен удобными подушками и низкими столами, и в нём поддерживается комфортная температура. Пока вы находитесь внутри, вы можете слышать все, что происходит вокруг сосуда, как если бы вы были на его месте. Вы можете оставаться в сосуде количество часов, равное удвоенному значению вашего бонуса мастерства. Вы покидаете сосуд раньше этого времени, если используете бонусное действие, чтобы покинуть его, умираете или если сосуд уничтожается. Если вы покидаете сосуд, вы оказываетесь в свободном пространстве максимально близко к сосуду. Любые предметы, принесенные внутрь сосуда, остаются в нём до тех пор, пока они не будут вынесены оттуда или сосуд не будет уничтожен, при этом любой объект, находящийся внутри сосуда, появляется невредимым в свободном пространстве максимально близко к сосуду. Войдя в сосуд, вы не сможете войти в него повторно, пока не закончите продолжительный отдых.
          - id: warlock.genij.sosud-geniya.gnev-geniya
            name: Гнев гения
            description: "Один раз в каждый свой ход, когда вы попадаете броском атаки, вы можете нанести дополнительный урон по цели, равный вашему бонусу мастерства. Тип этого урона определяется выбранной вами разновидностью гения: дробящий урон (дао), урон звуком (джинн), урон огнём (ифрит), урон холодом (марид)."
      - id: warlock.genij.stihijnyj-dar
        name: Стихийный дар
        level: 6
        subtitle: 6-й уровень, умение гения
        description: |-
          Вы начинаете перенимать отличительные черты своего покровителя. Вы получаете сопротивление урону того вида, который соответствует разновидности вашего покровителя: дробящему урону (дао), урону звуком (джинн), урону огнём (ифрит), урону холодом (марид).

          Помимо этого вы можете бонусным действием даровать себе скорость полёта, равную 30 футам. Этот эффект длится 10 минут, и всё это время вы можете парить. Вы можете использовать бонусное действие подобным образом количество раз, равное вашему бонусу мастерства. Вы восстанавливаете все потраченные использования после окончания продолжительного отдыха.
      - id: warlock.genij.spasitelnyj-sosud
        name: Спасительный сосуд
        level: 10
        subtitle: 10-й уровень, умение гения
        description: |-
          Когда вы входите в сосуд гения при помощи умения «Передышка на дне бутылки», вы можете выбрать до пяти согласных существ, которых вы можете видеть в пределах 30 футов. Выбранные существа переносятся в сосуд вместе с вами.

          Бонусным действием вы можете высвободить любое количество существ из сосуда. Они все покидают сосуд в том случае, если вы покидаете его или сосуд уничтожается.

          Также кто угодно (включая вас), оставаясь в сосуде минимум 10 минут, получает все преимущества короткого отдыха. Помимо этого, кто угодно может добавить ваш бонус мастерства к количеству восстанавливаемых хитов, если тратит Кости Хитов во время этого короткого отдыха.
      - id: warlock.genij.ogranichennoe-zhelanie
        name: Ограниченное желание
        level: 14
        subtitle: 14-й уровень, умение гения
        description: |-
          Вы упрашиваете своего покровителя исполнить ваше скромное желание. Действием вы можете проговорить своё желание в сосуд гения, попросив эффект одного заклинания уровня не выше 6-го уровня, имеющего время накладывания «1 действие». Это заклинание может находиться в списке заклинаний любого класса, вам также не требуются компоненты для его накладывания, включая материальные компоненты со стоимостью; заклинание просто срабатывает как часть вашего действия.

          Использовав это умение, вы больше не сможете применить его повторно, пока не закончите 1к4 продолжительных отдыхов.
  - id: warlock.nezhit
    name: Нежить
    sources:
      - code: VRGR
        book: Van Richten’s Guide to Ravenloft
    features:
      - id: warlock.nezhit.rasshirennyj-spisok-zaklinanij
        name: Расширенный список заклинаний
        level: 1
        subtitle: 1-й уровень, умение нежити
        description: |-
          Нежить позволяет вам при изучении заклинаний колдуна выбирать из более широкого списка. В ваш список заклинаний колдуна добавляются следующие заклинания.

          **Дополнительные заклинания нежити**

          | Уровень
          заклинания | Заклинания |
          | 1 | порча [bane], псевдожизнь [false life] |
          | 2 | глухота/слепота [blindness/deafness], воображаемая сила [phantasmal force] |
          | 3 | призрачный скакун [phantom steed], разговор с мёртвыми [speak with dead] |
          | 4 | защита от смерти [death ward], высшая невидимость [greater invisibility] |
          | 5 | преграда жизни [antilife shell], облако смерти [cloudkill] |
          |  |
      - id: warlock.nezhit.uzhasayuschij-oblik
        name: Ужасающий облик
        level: 1
        subtitle: 1-й уровень, умение нежити
        description: |-
          Вы воплощаете аспект страшной силы своего покровителя. Бонусным действием вы можете трансформироваться на 1 минуту. Преображаясь, вы получаете следующие преимущества:

          - Вы получаете временные хиты в количестве, равном 1к10 + ваш уровень колдуна.
          - Один раз во время каждого из ваших ходов, когда вы попадаете по существу атакой, вы можете заставить его совершить спасбросок Мудрости. При провале цель становится испуганной вами до конца вашего следующего хода.
          - Вы обладаете иммунитетом к состоянию «испуганный».

          Вы можете трансформироваться количество раз, равное вашему бонусу мастерства, и восстанавливаете все потраченные использования после окончания продолжительного отдыха.

          Проявление вашего «Ужасающего облика» отражает какой-то аспект вашего покровителя. Например, ваш облик может быть саваном из теней, образующим корону и мантию вашего покровителя лича, или на вашем теле светятся глифы древних погребальных обрядов, а вокруг дуют пустынные ветра, что напоминает о вашем покровителе мумии.
      - id: warlock.nezhit.zatronutyj-mogiloj
        name: Затронутый могилой
        level: 6
        subtitle: 6-й уровень, умение нежити
        description: |-
          Силы вашего покровителя оказывают глубокое влияние на ваше тело и магию. Вам не нужно есть, пить и дышать.

          Кроме того, один раз в течение каждого вашего хода, когда вы попадаете по существу атакой и причиняете ему урон, вы можете заменить вид урона на урон некротической энергией. Пока вы находитесь в своём «Ужасающем облике», вы можете бросить одну дополнительную кость урона при причинении цели урона некротической энергией.
      - id: warlock.nezhit.omertvevshaya-obolochka
        name: Омертвевшая оболочка
        level: 10
        subtitle: 10-й уровень, умение нежити
        description: |-
          Ваша связь с нежитью позволяет некротической энергии насыщать ваше тело. Вы получаете сопротивление урону некротической энергией. Если вы трансформируетесь, используя свой «Ужасающий облик», вы получаете иммунитет к урону некротической энергией.

          Кроме того, когда ваши хиты опускаются до 0, вы можете вместо этого реакцией уменьшить свои хиты до 1 и заставить своё тело вспыхнуть смертельной энергией. Каждое существо по вашему выбору, которое находится в пределах 30 футов от вас, получает урон некротической энергией, равный 2к10 + ваш уровень колдуна. Затем вы получаете 1 степень истощения. Использовав эту реакцию, вы не сможете использовать её вновь, пока не закончите 1к4 продолжительных отдыха.
      - id: warlock.nezhit.duhovnaya-proekciya
        name: Духовная проекция
        level: 14
        subtitle: 14-й уровень, умение нежити
        description: |-
          Ваш дух способен оторваться от вашей физической оболочки. Действием вы можете проецировать свой дух из тела. Оставленное вами тело находится без сознания в состоянии анабиоза.

          Ваш дух почти во всём похож на вашу смертную оболочку, и он обладает теми же игровыми характеристиками, но не снаряжением. Любой урон или другие эффекты, затрагивающие ваш дух или физическое тело, также влияют на другую форму. Ваш дух может находиться вне тела до 1 часа или до тех пор, пока не нарушится концентрация (как при концентрации на заклинании). Когда проекция заканчивается, ваш дух возвращается в тело или ваше тело магически телепортируется в пространство духа (по вашему выбору).

          Проецируя свой дух, вы получаете следующие преимущества:

          - Ваш дух и тело получают сопротивление дробящему, колющему и рубящему урону.
          - Когда вы накладываете заклинание школы Вызова или Некромантии, заклинание не требует вербальных и соматических компонентов, а также материальных компонентов, у которых отсутствует стоимость.
          - Вы получаете скорость полёта, равную вашей скорости ходьбы, и можете парить. Вы можете перемещаться сквозь существ и предметы, как если бы они были труднопроходимой местностью, но вы получаете 1к10 урона силовым полем, если заканчиваете свой ход внутри существа или предмета.
          - Пока вы используете свой «Ужасающий облик», один раз в течение каждого вашего хода, когда вы причиняете урон некротической энергией существу, вы восстанавливаете хиты, равные половине причинённого урона некротической энергией.

          Использовав это умение, вы больше не сможете применить его повторно, пока не закончите продолжительный отдых .
