id: rogue
name: Плут
name_en: Rogue
source_url: https://dnd.su/class/99-rogue/
sources: &a1
  - code: PH14
    book: Player's Handbook
features:
  - id: rogue.kompetentnost
    name: Компетентность
    level: 1
    subtitle: 1-й уровень, умение плута
    description: |-
      Выберите два ваших владения в навыках или одно владение навыком и владение воровскими инструментами. Ваш бонус мастерства удваивается для всех проверок характеристик, которые вы совершаете, используя любое из выбранных владений.

      На 6-м уровне вы можете выбрать ещё два владения (навыки или воровские инструменты), чтобы получить эту же выгоду.
  - id: rogue.skrytaya-ataka
    name: Скрытая атака
    level: 1
    subtitle: 1-й уровень, умение плута
    description: |-
      Вы знаете, как точно наносить удар и использовать отвлечение врага. Один раз в ход вы можете причинить дополнительные 1к6 урона одному из существ, по которому вы попали атакой, совершённой с преимуществом. Атака должна использовать дальнобойное оружие или оружие со свойством «фехтовальное». Вам не нужно иметь преимущество при броске атаки, если другой враг цели находится в пределах 5 футов от неё. Этот враг не должен быть недееспособным, и у вас не должно быть помехи для броска атаки.

      Дополнительный урон увеличивается, когда вы получаете уровни в этом классе, как показано в колонке «скрытая атака».
  - id: rogue.vorovskoj-zhargon
    name: Воровской жаргон
    level: 1
    subtitle: 1-й уровень, умение плута
    description: |-
      Во время плутовского обучения вы выучили воровской жаргон, тайную смесь диалекта, жаргона и шифра, который позволяет скрывать сообщения в, казалось бы, обычном разговоре. Только другое существо, знающее воровской жаргон, понимает такие сообщения. Это занимает в четыре раза больше времени, нежели передача тех же слов прямым текстом.

      Кроме того, вы понимаете набор секретных знаков и символов, используемый для передачи коротких и простых сообщений. Например, является ли область опасной или территорией гильдии воров, находится ли поблизости добыча, простодушны ли люди в округе, и предоставляют ли здесь безопасное убежище для воров в бегах.
  - id: rogue.hitroe-dejstvie
    name: Хитрое действие
    level: 2
    subtitle: 2-й уровень, умение плута
    description: Ваше мышление и ловкость позволяют двигаться и действовать быстрее. Вы можете в каждом своем ходу боя совершать бонусное действие. Это действие может быть использовано только для Рывка, Отхода или Засады.
  - id: rogue.arhetip-pluta
    name: Архетип плута
    level: 3
    subtitle: 3-й уровень, умение плута
    description: Вы выбираете архетип, который отображает ваши плутовские способности. Подробности всех архетипов находятся ниже. Выбранный вами архетип предоставляет умения на 3-м, 9-м, 13-м и 17-м уровнях.
  - id: rogue.tochnoe-pricelivanie
    name: Точное прицеливание
    level: 3
    subtitle: 3-й уровень, опциональное умение плута
    description: Бонусным действием вы можете дать себе преимущество на следующий бросок атаки в текущем ходу. Вы можете использовать это бонусное действие только в том случае, если не перемещались в этом ходу. После того, как вы используете его, ваша скорость станет равной 0 до конца текущего хода.
  - id: rogue.neveroyatnoe-uklonenie
    name: Невероятное уклонение
    level: 5
    subtitle: 5-й уровень, умение плута
    description: Когда нападающий, которого вы можете видеть, попадает по вам атакой, вы можете реакцией уменьшить вдвое урон, причиняемый вам этой атакой.
  - id: rogue.uvertlivost
    name: Увёртливость
    level: 7
    subtitle: 7-й уровень, умение плута
    description: Вы можете ловко увернуться от зональных эффектов, например, огненного дыхания красного дракона или заклинания град [ice storm]. Если вы попадаете под действие эффекта, который позволяет вам совершить спасбросок Ловкости, чтобы получить только половину урона, вместо этого вы не получаете вовсе никакого урона, если спасбросок был успешен, и получаете только половину урона, если он был провален.
  - id: rogue.nadezhnyj-talant
    name: Надёжный талант
    level: 11
    subtitle: 11-й уровень, умение плута
    description: Вы улучшаете выбранные навыки, пока они не достигнут совершенства. Каждый раз, когда вы совершаете проверку характеристики, которая позволяет добавить бонус мастерства, вы можете при выпадении на к20 результата «1–9» считать, что выпало «10».
  - id: rogue.slepoe-zrenie
    name: Слепое зрение
    level: 14
    subtitle: 14-й уровень, умение плута
    description: Если вы можете слышать, то знаете о местонахождении всех скрытых и невидимых существ в пределах 10 футов от себя.
  - id: rogue.skolzkij-um
    name: Скользкий ум
    level: 15
    subtitle: 15-й уровень, умение плута
    description: Вы увеличиваете силу мышления. Вы получаете владение спасбросками Мудрости.
  - id: rogue.neulovimost
    name: Неуловимость
    level: 18
    subtitle: 18-й уровень, умение плута
    description: Вы можете уклоняться так хорошо, что противник крайне редко может взять над вами верх. Никакие броски атаки не получают преимущества над вами, пока вы не станете недееспособным.
  - id: rogue.udacha
    name: Удача
    level: 20
    subtitle: 20-й уровень, умение плута
    description: |-
      Вы получаете сверхъестественный дар преуспевать, когда это нужнее всего. Если ваша атака промахивается по цели, находящейся в пределах досягаемости, вы можете изменить промах на попадание. В качестве альтернативы, если вы провалили проверку характеристики, вы можете заменить результат, выпавший на к20, на «20».

      Использовав это умение, вы не можете использовать его повторно, пока не завершите короткий или продолжительный отдых.
lists: []
subclasses:
  - id: rogue.vor
    name: Вор
    sources: *a1
    features:
      - id: rogue.vor.bystrye-ruki
        name: Быстрые руки
        level: 3
        subtitle: 3-й уровень, умение вора
        description: Вы можете бонусным действием, предоставленным вашим Хитрым действием, совершить проверку Ловкости (Ловкость рук), использовать воровские инструменты, чтобы обезвредить ловушку или вскрыть замок, или же совершить действие Использование предмета.
      - id: rogue.vor.fortochnik
        name: Форточник
        level: 3
        subtitle: 3-й уровень, умение вора
        description: |-
          Вы получаете возможность лазать быстрее, чем обычно; лазание больше не стоит вам дополнительного движения.

          Кроме того, когда вы совершаете прыжок с разбега, расстояние, которое вы преодолеваете, увеличивается на число футов, равное вашему модификатору Ловкости.
      - id: rogue.vor.vysokaya-skrytnost
        name: Высокая скрытность
        level: 9
        subtitle: 9-й уровень, умение вора
        description: Вы совершаете с преимуществом проверки Ловкости (Скрытность), если в этом ходу перемещались не более чем на половину своей скорости.
      - id: rogue.vor.ispolzovanie-magicheskih-predmetov
        name: Использование магических предметов
        level: 13
        subtitle: 13-й уровень, умение вора
        description: Вы узнаёте достаточно о магических процессах, чтобы импровизировать при использовании предметов, даже если раньше вы не умели ими пользоваться. Вы игнорируете все требования класса, расы и уровня при использовании магических предметов.
      - id: rogue.vor.vorovskie-refleksy
        name: Воровские рефлексы
        level: 17
        subtitle: 17-й уровень, умение вора
        description: Вы обретаете большой опыт организации засад и быстрого отступления при опасности. Вы можете совершить два хода во время первого раунда боя. Совершите первый ход согласно своей нормальной инициативе, и второй ход с инициативой на 10 меньше. Вы не можете использовать это умение, если захвачены врасплох.
  - id: rogue.ubijca
    name: Убийца
    sources: *a1
    features:
      - id: rogue.ubijca.dopolnitelnye-vladeniya
        name: Дополнительные владения
        level: 3
        subtitle: 3-й уровень, умение убийцы
        description: Вы получаете владение набором для грима и инструментами отравителя.
      - id: rogue.ubijca.likvidaciya
        name: Ликвидация
        level: 3
        subtitle: 3-й уровень, умение убийцы
        description: Вы становитесь смертоносными для врагов. Вы совершаете с преимуществом броски атаки по всем существам, которые ещё не совершали ход в этом бою. Кроме того, все попадания по существам, захваченным врасплох, являются критическими попаданиями.
      - id: rogue.ubijca.master-proniknoveniya
        name: Мастер проникновения
        level: 9
        subtitle: 9-й уровень, умение убийцы
        description: |-
          Вы можете создавать себе ложную биографию. Вы должны потратить семь дней и 25 зм, чтобы сделать её достоверной и установить нужные связи. Вы не можете взять биографию, принадлежащую другому лицу. Например, вы можете приобрести соответствующую одежду, рекомендательные письма и официального вида сертификаты, чтобы обозначить себя в качестве члена торгового дома из далёкого города, или внушить, что вы из группы богатых торговцев.

          После принятия новой личности в качестве маскировки другие существа верят, что вы являетесь этой личностью, пока не подадите очевидный повод решить обратное.
      - id: rogue.ubijca.samozvanec
        name: Самозванец
        level: 13
        subtitle: 13-й уровень, умение убийцы
        description: |-
          Вы получаете способность безошибочно подражать чужой речи, почерку и привычкам. Вы должны провести не менее трёх часов изучения этих трёх компонентов поведения существа, слушая его речь, рассматривая почерк и наблюдая за привычками.

          Ваши уловки не видны для случайного наблюдателя. Если осторожное существо подозревает что-то неладное, вы совершаете с преимуществом все проверки Харизмы (Обман), чтобы избежать обнаружения.
      - id: rogue.ubijca.smertelnyj-udar
        name: Смертельный удар
        level: 17
        subtitle: 17-й уровень, умение убийцы
        description: Вы становитесь мастером мгновенной смерти. Если вы атакуете и попадаете по существу, захваченному врасплох, оно должно совершить спасбросок Телосложения (Сл 8 + ваш модификатор Ловкости + ваш бонус мастерства). Проваленный спасбросок означает удвоение урона от вашей атаки по этому существу.
  - id: rogue.misticheskij-lovkach
    name: Мистический ловкач
    sources: *a1
    features:
      - id: rogue.misticheskij-lovkach.ispolzovanie-zaklinanij
        name: Использование заклинаний
        level: 3
        subtitle: 3-й уровень, умение мистического ловкача
        description: |-
          Вы получаете способность накладывать заклинания. Правила по использованию заклинаний есть в этой статье: *использование заклинаний*.

          ***Заговоры.*** Вы знаете три заговора: волшебная рука [mage hand] и два других заговора по своему выбору из списка заклинаний волшебника. Вы узнаёте ещё один заговор волшебника на 10-м уровне.

          ***Ячейки заклинаний.*** В приведённой ниже таблице показано, сколько у вас есть ячеек заклинаний для сотворения заклинаний волшебника для накладывания заклинаний 1-го уровня и выше. Для накладывания одного из этих заклинаний вы должны потратить ячейку заклинаний с уровнем не ниже уровня заклинания. Вы восстанавливаете все потраченные ячейки заклинаний, когда заканчиваете продолжительный отдых.

          Например, если вы знаете заклинание 1-го уровня очарование личности [charm person] и у вас есть ячейки заклинания 1-го и 2-го уровня, вы можете наложить это заклинание, используя любую из этих ячеек.

          ***Известные заклинания первого и более высоких уровней.*** Вы знаете три заклинания волшебника 1-го уровня по своему выбору, два из которых должны быть выбраны из школ Иллюзий или Очарования.

          Колонка «известные заклинания» показывает, когда вы сможете выучить новые заклинания волшебника 1-го уровня и выше. Все эти заклинания должны принадлежать школе Иллюзии или Очарования, и должны быть того уровня, для которого у вас есть ячейки заклинаний. Например, когда вы получите 7-й уровень в этом классе, вы можете узнать одно новое заклинание 1-го или 2-го уровня. Заклинания, которые вы узнаёте на 8-м, 14-м и 20-м уровнях могут принадлежать любой школе магии. Каждый раз, когда вы получаете уровень в этом классе, вы можете заменить одно известное заклинание волшебника другим заклинанием по своему выбору из списка заклинаний волшебника. Уровень нового заклинания не должен превышать уровень самой большой ячейки заклинаний, и оно должно принадлежать школе Иллюзий или Очарования, если только вы не заменяете заклинание, полученное на 8, 14 или 20 уровне из любой школы магии.

          ***Базовая характеристика заклинаний.*** При накладывании заклинаний волшебника вы используете Интеллект, так как вы узнаёте их с помощью специальных исследований и запоминания. Вы используете Интеллект в случаях, когда заклинание ссылается на базовую характеристику. Кроме того, вы используете модификатор Интеллекта при определении Сл спасбросков от ваших заклинаний волшебника, и при броске атаки заклинаниями.

          **Сл спасброска** = 8 + ваш бонус мастерства + ваш модификатор Интеллекта

          **Модификатор броска атаки** = ваш бонус мастерства + ваш модификатор Интеллекта

          | Уровень
          плута | Известные
          заговоры | Известные
          заклинания | Ячейки заклинаний на уровень заклинаний |
